function getFieldValue(doc, key){ return (doc.customFields||{})[key]; }
function setFieldValue(doc, key, val){ doc.customFields = doc.customFields||{}; doc.customFields[key] = val; }
function formatFieldDisplay(doc, col){
  const v = getFieldValue(doc, col.key);
  if(col.fieldType==='checkbox') return `<input type="checkbox" ${v?'checked':''} style="pointer-events:none;vertical-align:middle;"/>`;
  if(col.fieldType==='select'){
    const opt = (col.options||[]).find(o=>o.name===v);
    const dot = v ? `<span class="opt-color-dot" style="background:${resolveColor(opt?opt.color:'var(--text400)')};"></span>` : '';
    return `<span class="select-field-pill">${dot}${v || 'Choose...'}${iconHTML('expand_more',14,'color:var(--text400);')}</span>`;
  }
  return (v===undefined||v===null||v==='') ? '—' : String(v);
}
function editFieldPrompt(doc, col){
  if(col.fieldType==='checkbox'){ setFieldValue(doc, col.key, !getFieldValue(doc, col.key)); render(); return; }
  const cur = getFieldValue(doc, col.key);
  const v = prompt(col.label+':', cur===undefined?'':cur);
  if(v!==null){ setFieldValue(doc, col.key, col.fieldType==='number' ? (parseFloat(v)||0) : v); render(); }
}

// A real dropdown (ATOM-SELECT-02 spirit) for single-select fields — never a
// prompt(), since a prompt can't show the actual list of valid options.
function openSelectFieldPicker(anchor, doc, col){
  document.querySelectorAll('.flyout').forEach(m=>m.remove());
  const current = getFieldValue(doc, col.key);
  const menu = el('<div class="flyout select-field-flyout"></div>');
  const noneBtn = el(`<button class="${!current?'active-opt':''}">— None —</button>`);
  noneBtn.onclick = ()=>{ setFieldValue(doc, col.key, ''); menu.remove(); render(); };
  menu.appendChild(noneBtn);
  menu.appendChild(el('<hr/>'));
  col.options.forEach(opt=>{
    const active = current === opt.name;
    const btn = el(`<button class="${active?'active-opt':''}"><span class="opt-color-dot" style="background:${resolveColor(opt.color)};"></span>${opt.name}${active?iconHTML('check',15,'margin-left:auto;color:var(--accent);'):''}</button>`);
    btn.onclick = ()=>{ setFieldValue(doc, col.key, opt.name); menu.remove(); render(); };
    menu.appendChild(btn);
  });
  positionFlyout(menu, anchor);
  setTimeout(()=>{
    document.addEventListener('click', function h(ev){ if(!menu.contains(ev.target) && ev.target!==anchor){ menu.remove(); document.removeEventListener('click',h); } });
  },0);
}

// ---- Filters (Quick Filters always visible, More Filters collapsible,
//      Customize mode with drag-to-reorder between the two — same pattern
//      as the Candidates List filter panel) ----
function filterValueCount(key){
  const f = state.filters;
  if(key==='uploadDate') return (f.uploadFrom||f.uploadTo) ? 1 : 0;
  if(key==='expirationRange') return (f.expFrom||f.expTo) ? 1 : 0;
  if(key==='expiringOnly') return f.expiringOnly ? 1 : 0;
  if(key==='requiresSign') return f.requiresSign ? 1 : 0;
  return f[key] ? f[key].size : 0;
}
function clearAllFilters(){ state.filters = defaultFilters(); }

function isoDate(d){ return d.toISOString().slice(0,10); }
function addDays(d, n){ const r = new Date(d); r.setDate(r.getDate()+n); return r; }
function addMonths(d, n){ const r = new Date(d); r.setMonth(r.getMonth()+n); return r; }
function sameDay(a, b){ return a && b && isoDate(a)===isoDate(b); }
function endOfWeek(d){ const r = new Date(d); const day = r.getDay(); const add = day===0 ? 0 : 7-day; r.setDate(r.getDate()+add); return r; }
const TODAY = new Date('2026-09-06');

function renderFilterField(container, key, draggable){
  const meta = FILTER_FIELD_META[key];
  const f = state.filters;
  const wrap = document.createElement('div');
  wrap.className = draggable ? 'filter-field-row' : '';
  if(draggable) wrap.appendChild(el(`<span class="drag-handle">${iconHTML('drag_indicator',16)}</span>`));
  const field = document.createElement('div'); field.className = 'filter-field';

  if(meta.type === 'toggle'){
    const row = el(`<div class="filter-toggle-row"><label>${meta.label}</label><div class="switch ${f[key]?'on':''}"><div class="knob"></div></div></div>`);
    row.querySelector('.switch').onclick = ()=>{ f[key] = !f[key]; openModal('filters'); };
    field.appendChild(row);
  } else if(meta.type === 'expirationRange'){
    field.appendChild(el(`<label>${meta.label}</label>`));
    const presetRow = el('<div class="preset-row"></div>');
    const presets = [
      {label:'This week', to: endOfWeek(TODAY)},
      {label:'Next week', to: addDays(TODAY,7)},
      {label:'Next month', to: addMonths(TODAY,1)},
      {label:'Next 3 months', to: addMonths(TODAY,3)},
    ];
    presets.forEach(p=>{
      const active = sameDay(f.expFrom, TODAY) && sameDay(f.expTo, p.to);
      const btn = el(`<button type="button" class="preset-chip${active?' active':''}">${p.label}</button>`);
      btn.onclick = ()=>{ f.expFrom = TODAY; f.expTo = p.to; openModal('filters'); };
      presetRow.appendChild(btn);
    });
    field.appendChild(presetRow);
    const row = el(`<div class="filter-range"><input type="date" value="${f.expFrom?isoDate(f.expFrom):''}"/><span style="color:var(--text400)">–</span><input type="date" value="${f.expTo?isoDate(f.expTo):''}"/></div>`);
    const [fromI, toI] = row.querySelectorAll('input');
    fromI.onchange = (e)=>{ f.expFrom = e.target.value ? new Date(e.target.value) : null; openModal('filters'); };
    toI.onchange = (e)=>{ f.expTo = e.target.value ? new Date(e.target.value) : null; openModal('filters'); };
    field.appendChild(row);
  } else if(meta.type === 'daterange'){
    field.appendChild(el(`<label>${meta.label}</label>`));
    const row = el(`<div class="filter-range"><input type="date" value="${f.uploadFrom||''}"/><span style="color:var(--text400)">–</span><input type="date" value="${f.uploadTo||''}"/></div>`);
    const [fromI, toI] = row.querySelectorAll('input');
    fromI.onchange = (e)=>{ f.uploadFrom = e.target.value || null; };
    toI.onchange = (e)=>{ f.uploadTo = e.target.value || null; };
    field.appendChild(row);
  } else { // multiselect
    field.appendChild(el(`<label>${meta.label}</label>`));
    const count = filterValueCount(key);
    const box = el(`<div class="filter-input-box"><span class="${count?'':'ph'}">${count? count+' selected' : 'All'}</span>${iconHTML('expand_more',16,'color:var(--text400)')}</div>`);
    const list = document.createElement('div'); list.className='filter-checklist'; list.style.display='none';
    meta.options.forEach(([val,lbl])=>{
      const optLabel = el(`<label><input type="checkbox" ${f[key].has(val)?'checked':''}/> ${lbl}</label>`);
      optLabel.querySelector('input').onchange = (e)=>{
        if(e.target.checked) f[key].add(val); else f[key].delete(val);
        openModal('filters');
      };
      list.appendChild(optLabel);
    });
    box.onclick = ()=>{ list.style.display = list.style.display==='none' ? 'block' : 'none'; };
    field.appendChild(box); field.appendChild(list);
  }
  wrap.appendChild(field);
  container.appendChild(wrap);
  return wrap;
}

  const moreSection = el('<div id="moreSection" style="display:none;"><div class="filter-divider"></div><div id="moreWrap"></div></div>');
  modal.appendChild(quickWrap); modal.appendChild(aiFlagWrap); modal.appendChild(moreToggleWrap); modal.appendChild(moreSection);
  const moreWrap = moreSection.querySelector('#moreWrap');

  // Fixed, never draggable — has its own interactive switch nested inside.
  renderFilterField(aiFlagWrap, 'expiringOnly', false);

  if(customizing){
    moreSection.style.display = 'block';
    quickWrap.appendChild(el('<div class="filter-section-label">QUICK FILTERS</div>'));
    moreSection.querySelector('.filter-divider').before(el('<div class="filter-section-label" style="margin-top:0">MORE FILTERS</div>'));
    filterFieldOrder.quick.forEach(key=> renderFilterField(quickWrap, key, true));
    filterFieldOrder.more.forEach(key=> renderFilterField(moreWrap, key, true));
    quickWrap.dataset.filterList = 'quick';
    moreWrap.dataset.filterList = 'more';
    const onMoved = (evt)=>{
      try{
        const fromList = evt.from.dataset.filterList, toList = evt.to.dataset.filterList;
        const [moved] = filterFieldOrder[fromList].splice(evt.oldIndex, 1);
        filterFieldOrder[toList].splice(evt.newIndex, 0, moved);
        openModal('filters');
      }catch(err){ console.error('Reorder failed:', err); openModal('filters'); }
    };
    safeSortable(quickWrap, { group:'docFilterFields', onEnd:onMoved });
    safeSortable(moreWrap, { group:'docFilterFields', onEnd:onMoved });
  } else {
    filterFieldOrder.quick.forEach(key=> renderFilterField(quickWrap, key, false));
    const moreCount = filterFieldOrder.more.reduce((n,k)=>n+filterValueCount(k),0);
    const toggleLink = el(`<div class="more-filters-link">${iconHTML(filterMoreExpanded?'remove':'add',14)} ${filterMoreExpanded?'Fewer filters':'More filters'}${moreCount?` (${moreCount} active)`:''}</div>`);
    toggleLink.onclick = ()=>{ filterMoreExpanded = !filterMoreExpanded; openModal('filters'); };
    moreToggleWrap.appendChild(toggleLink);
    if(filterMoreExpanded){
      moreSection.style.display = 'block';
      filterFieldOrder.more.forEach(key=> renderFilterField(moreWrap, key, false));
    }
  }

  const applyBtn = el('<button class="btn primary" style="width:100%;margin-top:8px;">Apply filters</button>');
  applyBtn.onclick = ()=>{ state.filterCustomizeMode=false; state.page=1; closeModal(); };
  modal.appendChild(applyBtn);
  return wrap;
}

// ---- Rename ----
function modalRename(file){
  const m = modalShell(`<h2>Rename File</h2><div class="field"><label>File name</label><input type="text" id="renameInput" value="${file.name}"/></div>`);
  const modal = m.querySelector('.modal');
  const actions = el('<div class="actions"></div>');
  const cancelBtn = el('<button class="btn">Cancel</button>');
  cancelBtn.onclick = closeModal;
  const saveBtn = el('<button class="btn primary">Save</button>');
  saveBtn.onclick = ()=>{
    const val = modal.querySelector('#renameInput').value.trim();
    if(!val) return;
    const oldName = file.name;
    file.name = val;
    logActivity(file, `Renamed from "${oldName}" to "${val}"`);
    showToast('File renamed');
    closeModal();
  };
  actions.appendChild(cancelBtn); actions.appendChild(saveBtn);
  modal.appendChild(actions);
  return m;
}

// ---- Move ----
function modalMove(fileList){
  const m = modalShell(`<h2>Move ${fileList.length>1?fileList.length+' Files':'"'+fileList[0].name+'"'}</h2><p class="mdesc">Choose the destination folder.</p>`);
  const modal = m.querySelector('.modal');
  const field = el('<div class="field"><label>Destination folder</label></div>');
  const select = el('<select id="moveSelect"></select>');
  FOLDERS.forEach(f=> select.appendChild(el(`<option value="${f.id}">${f.name}</option>`)));
  field.appendChild(select);
  modal.appendChild(field);
  const actions = el('<div class="actions"></div>');
  const cancelBtn = el('<button class="btn">Cancel</button>');
  cancelBtn.onclick = closeModal;
  const moveBtn = el('<button class="btn primary">Move</button>');
  moveBtn.onclick = ()=>{
    const dest = modal.querySelector('#moveSelect').value;
    fileList.forEach(f=>{ logActivity(f, `Moved from "${folderName(f.folder)}" to "${folderName(dest)}"`); f.folder = dest; });
    showToast(`Moved to ${folderName(dest)}`);
    state.selected.clear();
    closeModal();
  };
  actions.appendChild(cancelBtn); actions.appendChild(moveBtn);
  modal.appendChild(actions);
  return m;
}

// ---- Delete ----
// A document mid-workflow — waiting on the driver, or waiting on office
// review — can't just be deleted out from under that in-progress state; it
// has to be resolved (Cancel Request, or Approve/Reject) first, or the
// decision trail silently disappears with it.
const PROTECTED_STATUSES = ['pending_approval', 'awaiting_upload', 'awaiting_signature'];
function protectedStatusReason(status){
  if(status==='pending_approval') return 'is waiting on your approval';
  if(status==='awaiting_upload') return "has a request out to the driver — cancel it first";
  if(status==='awaiting_signature') return "has a signature request out to the driver — cancel it first";
  return null;
}
function modalDelete(fileList){
  const blocked = fileList.filter(f=> PROTECTED_STATUSES.includes(f.status));
  const deletable = fileList.filter(f=> !PROTECTED_STATUSES.includes(f.status));

  if(blocked.length && deletable.length===0){
    // Nothing in the selection can actually be deleted — say so plainly
    // instead of showing a delete button that can't do anything.
    const m = modalShell(`<h2>${iconHTML('block',20,'color:var(--danger);vertical-align:middle;margin-right:6px;')}Can't delete ${blocked.length>1?'these files':'this file'}</h2>
      <p class="mdesc">${blocked.length>1
        ? `All ${blocked.length} selected files are mid-workflow — resolve each one (Approve/Reject, or Cancel Request) before deleting.`
        : `"${blocked[0].name}" ${protectedStatusReason(blocked[0].status)}.`}</p>`);
    const modal = m.querySelector('.modal');
    const okBtn = el('<button class="btn primary" style="width:100%;">Got it</button>');
    okBtn.onclick = closeModal;
    modal.appendChild(okBtn);
    return m;
  }

  const m = modalShell(`<h2>${iconHTML('warning',20,'color:var(--danger);vertical-align:middle;margin-right:6px;')}Delete ${deletable.length>1?deletable.length+' files':'file'}?</h2>
    <p class="mdesc">${deletable.length>1?`This will permanently delete ${deletable.length} files.`:`This will permanently delete "${deletable[0].name}".`} This action is irreversible.${blocked.length?` ${blocked.length} other selected file${blocked.length!==1?'s are':' is'} mid-workflow and will be skipped.`:''}</p>`);
  const modal = m.querySelector('.modal');
  const actions = el('<div class="actions"></div>');
  const cancelBtn = el('<button class="btn">Cancel</button>');
  cancelBtn.onclick = closeModal;
  const delBtn = el('<button class="btn danger">Delete</button>');
  delBtn.onclick = ()=>{
    const ids = new Set(deletable.map(f=>f.id));
    files = files.filter(f=> !ids.has(f.id));
    state.selected.clear();
    showToast(`${deletable.length} file${deletable.length!==1?'s':''} deleted${blocked.length?`, ${blocked.length} skipped`:''}`);
    closeModal();
  };
  actions.appendChild(cancelBtn); actions.appendChild(delBtn);
  modal.appendChild(actions);
  return m;
}

// ============ BOOT ============
render();

function applyDesktopScale(){
  const DESIGN_WIDTH = 1320, DESIGN_HEIGHT = 1040;
  // Fill the available width, scaling up as needed — `zoom` genuinely
  // re-renders at the new size (real layout + rasterization) rather than
  // stretching a bitmap like `transform: scale()` does, so it stays crisp
  // even above 1x. No cap here: on a wide monitor the design should fill it,
  // not float in a box with empty space on every side.
  const scale = window.innerWidth / DESIGN_WIDTH;
  if('zoom' in document.body.style){
    // `zoom` triggers a real re-layout/re-rasterization at the new size
    // (Chrome, Edge, Safari, and current Firefox all support it) — crisp at
    // any ratio, unlike `transform: scale()` which just stretches a bitmap.
    app.style.transform = '';
    app.style.zoom = scale;
    document.body.style.width = '';
    document.body.style.height = '';
  } else {
    app.style.transformOrigin = 'top left';
    app.style.transform = `scale(${scale})`;
    document.body.style.width = (DESIGN_WIDTH*scale)+'px';
    document.body.style.height = (DESIGN_HEIGHT*scale)+'px';
  }
}
applyDesktopScale();
window.addEventListener('resize', applyDesktopScale);
</script>
