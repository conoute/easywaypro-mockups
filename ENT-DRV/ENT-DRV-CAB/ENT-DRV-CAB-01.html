<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>ENT-DRV-CAB-01 — Documents (Functional Mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<style>
  .sortable-ghost{opacity:.3 !important;outline:1.5px dashed var(--border);outline-offset:-1px;border-radius:6px;}
  .sortable-ghost > *{visibility:hidden;}
  .sortable-fallback, .sortable-drag{opacity:.85 !important;box-shadow:0 12px 28px rgba(0,0,0,.22),0 2px 6px rgba(0,0,0,.12) !important;border-radius:8px;background:#fff !important;}
  :root{
    --accent:#48C876; --info:#56a8dd; --warning:#FFAD20; --danger:#E82C3F; --purple:#7852F7; --accentBlue:#2E5BFF;
    --rail:#2e2a5c; --text900:#333761; --text600:#666989; --text400:#9a9ab0; --neutral300:#b3b4c4; --neutral200:#d0d0da;
    --border:#e5e6eb; --border2:#eeeef2; --rowBorder:#f0f0f4; --headerBg:#fafafc;
    --bg50:#f5f5f7; --white:#fff;
    --success-bg:#eafcf1; --success-t:#1e8e5a;
    --warning-bg:#fff5e6; --warning-t:#a85e00;
    --danger-bg:#fdecec; --danger-t:#c22b2b;
    --neutral-bg:#f0f0f4; --neutral-t:#666989;
    --doc-pdf:#E24B4A; --doc-doc:#56a8dd; --doc-xls:#48C876; --doc-jpg:#FFAD20;
  }
  *{box-sizing:border-box;}
  .material-symbols-outlined{
    font-family:'Material Symbols Outlined'; font-variation-settings:'FILL' 0;
    font-weight:normal; font-style:normal; line-height:1;
    display:inline-block; white-space:nowrap; word-wrap:normal;
    -webkit-font-feature-settings:'liga'; font-feature-settings:'liga'; -webkit-font-smoothing:antialiased;
  }
  .material-symbols-outlined.icon-filled{font-variation-settings:'FILL' 1;}
  body{margin:0;font-family:'Source Sans 3',sans-serif;color:var(--text900);background:#f4f4f7;font-size:13px;overflow-x:hidden;display:flex;justify-content:center;}
  .app{display:flex;width:1320px;height:1040px;overflow:hidden;transform-origin:top left;}

  /* ---- RAIL ---- */
  .rail{width:64px;flex-shrink:0;background:var(--rail);display:flex;flex-direction:column;margin:16px 0 16px 16px;border-radius:16px;overflow:hidden;transition:width .22s ease;}
  .rail.expanded{width:220px;}
  .rail-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:6px 10px;}
  .rail-scroll::-webkit-scrollbar{width:0;display:none;}
  .rail-top{flex-shrink:0;display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:16px 10px 0;}
  .rail-tune{flex-shrink:0;display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:0 10px 14px;}
  .rail .logo{width:36px;height:36px;border-radius:50%;background:#fff;color:var(--rail);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin:0 auto;overflow:hidden;}
  .rail-powered-by{display:flex;align-items:center;gap:8px;justify-content:center;padding-top:10px;opacity:.7;}
  .rail.expanded .rail-powered-by{justify-content:flex-start;padding-left:8px;opacity:1;}
  .easyway-wordmark{opacity:0;width:0;overflow:hidden;white-space:nowrap;font-size:14px;font-weight:700;color:#fff;letter-spacing:-.2px;transition:opacity .1s ease;}
  .rail.expanded .easyway-wordmark{opacity:1;width:auto;transition:opacity .25s ease .12s;}
  .rail .icon-slot{width:36px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:0;flex-shrink:0;color:#bdbcd9;cursor:pointer;margin:0 auto;padding:0;transition:width .22s ease,padding .22s ease,justify-content .22s ease,gap .22s ease;}
  .rail.expanded .icon-slot{gap:10px;width:100%;justify-content:flex-start;padding:0 8px;margin:0;}
  .icon-label{opacity:0;width:0;overflow:hidden;white-space:nowrap;font-size:12.5px;font-weight:600;transition:opacity .12s ease;}
  .rail.expanded .icon-label{opacity:1;width:auto;transition:opacity .2s ease .1s;}
  .rail-tooltip{position:fixed;transform:translateY(-50%);background:#1a1830;color:#fff;font-size:11.5px;font-weight:600;padding:6px 10px;border-radius:6px;white-space:nowrap;z-index:300;box-shadow:0 6px 16px rgba(0,0,0,.25);pointer-events:none;}
  .rail .icon-slot.active{background:#3d3970;color:#fff;}
  .rail .icon-slot:hover{background:#3d3970;color:#fff;}
  .rail .rail-divider{width:36px;height:1px;background:#4a4680;margin:4px auto;transition:width .22s ease;}
  .rail.expanded .rail-divider{width:100%;}
  .rail-section-label{font-size:8px;font-weight:700;color:#8482ac;letter-spacing:.5px;text-align:center;padding:2px 0 4px;width:100%;}
  .rail.expanded .rail-section-label{text-align:left;padding-left:8px;}
  .rail-collapse-toggle{width:36px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#8482ac;cursor:pointer;margin:0 auto;transition:width .22s ease,padding .22s ease,justify-content .22s ease,gap .22s ease;}
  .rail.expanded .rail-collapse-toggle{width:100%;justify-content:flex-start;padding:0 8px;margin:0;gap:10px;}
  .rail-collapse-toggle:hover{background:rgba(255,255,255,.08);color:#fff;}

  .main{flex:1;display:flex;flex-direction:column;min-width:0;}

  /* ---- TOPBAR ---- */
  .topbar{flex-shrink:0;background:#fff;margin:16px 16px 0;border-radius:16px 16px 0 0;}
  .topbar-row1{display:flex;align-items:center;gap:16px;padding:16px 24px;}
  .topbar-search{background:var(--bg50);border-radius:8px;height:38px;display:flex;align-items:center;gap:8px;padding:0 12px;width:320px;flex-shrink:0;}
  .topbar-search input{border:none;background:none;outline:none;font-size:13px;color:var(--text900);font-family:inherit;width:100%;}
  .topbar-quickview{background:var(--warning);border-radius:8px;height:36px;width:36px;padding:0;display:flex;align-items:center;justify-content:center;gap:7px;color:#fff;font-size:12px;font-weight:700;flex-shrink:0;cursor:pointer;overflow:hidden;white-space:nowrap;transition:width .22s ease,padding .22s ease,justify-content .22s ease;}
  .topbar-quickview:hover{width:118px;padding:0 12px;justify-content:flex-start;}
  .topbar-quickview .qv-label{opacity:0;width:0;overflow:hidden;transition:opacity .12s ease;}
  .topbar-quickview:hover .qv-label{opacity:1;width:auto;transition:opacity .2s ease .1s;}
  .topbar-user{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .topbar-user .name{font-weight:700;font-size:13px;color:var(--text900);}
  .topbar-user .role{font-size:11px;color:var(--text400);}
  .topbar-row2{display:flex;align-items:center;gap:6px;padding:10px 24px;border-top:1px solid var(--border2);font-size:12.5px;color:var(--text400);}
  .topbar-row2 .current{font-weight:600;color:var(--text900);}
  .avatar-sm{width:36px;height:36px;border-radius:50%;background:var(--border2);flex-shrink:0;}
  .topbar-chat{position:relative;cursor:pointer;display:flex;align-items:center;}

  .content{flex:1;overflow-y:auto;padding:20px 24px 24px;display:flex;flex-direction:column;gap:0;min-height:0;background:#fff;margin:0 16px 16px;border-radius:0 0 16px 16px;}

  /* ---- CABINET LAYOUT ---- */
  .cabinet{display:flex;gap:0;flex:1;min-height:0;margin:-20px -24px -24px;}
  .cab-left{width:296px;flex-shrink:0;padding:20px;border-right:1px solid var(--border2);overflow-y:auto;transition:width .18s ease,padding .18s ease;}
  .cab-left.collapsed{width:44px;padding:20px 0;display:flex;justify-content:center;overflow:hidden;}
  .cab-show-btn{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;color:var(--text400);cursor:pointer;}
  .cab-show-btn:hover{background:var(--bg50);color:var(--text900);}
  .cab-right{flex:1;min-width:0;display:flex;flex-direction:column;padding:0;overflow:hidden;}

  .cab-topline{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .cab-topline .hide-link{color:var(--text400);font-size:12.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:2px;}
  .cab-topline .kebab{color:var(--text900);cursor:pointer;}
  .cab-header{display:flex;align-items:center;gap:14px;margin-bottom:14px;}
  .cab-avatar{width:56px;height:56px;border-radius:50%;background:#dbeafe;color:#3b82c4;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex-shrink:0;}
  .cab-name{font-weight:700;font-size:16px;color:var(--text900);}
  .cab-type{font-size:12.5px;color:var(--text400);margin-top:2px;}
  .cab-pill{display:inline-block;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.3px;margin-bottom:14px;background:var(--warning-bg);color:var(--warning-t);}
  .cab-toggle-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .cab-toggle-row .tlabel{font-size:13px;color:var(--text900);}
  .cab-toggle-row .tsub{font-size:11px;color:var(--text400);}
  .switch{width:36px;height:20px;border-radius:10px;background:var(--border2);position:relative;cursor:pointer;flex-shrink:0;transition:background .15s;}
  .switch.on{background:var(--accent);}
  .switch .knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;}
  .switch.on .knob{left:18px;}
  .cab-info-row{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--text400);padding:7px 0;}
  .cab-contact-row{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;}
  .cab-contact-row .k{color:var(--text400);}
  .cab-contact-row .v{color:var(--text900);}
  .cab-section-title{font-weight:700;font-size:14px;color:var(--text900);margin:16px 0 10px;padding-top:14px;border-top:1px solid var(--border2);}
  .screen-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:12.5px;}
  .screen-pill{padding:3px 9px;border-radius:6px;font-size:10.5px;font-weight:700;}
  .screen-pill.pending{background:var(--warning-bg);color:var(--warning-t);}
  .screen-pill.clean{background:var(--success-bg);color:var(--success-t);}
  .screen-pill.na{background:var(--neutral-bg);color:var(--text400);}

  /* ---- TABS ---- */
  .tabs-bar{display:flex;align-items:center;gap:6px;padding:0 20px;border-bottom:1px solid var(--border2);flex-shrink:0;}
  .tabs-scroll{display:flex;gap:26px;overflow-x:auto;scrollbar-width:none;}
  .tabs-scroll::-webkit-scrollbar{display:none;}
  .tab-arrow{color:var(--text400);cursor:pointer;flex-shrink:0;padding:8px 2px;}
  .tab{display:flex;align-items:center;gap:6px;cursor:pointer;padding:14px 0 10px;flex-shrink:0;border-bottom:3px solid transparent;}
  .tab .label{font-weight:700;font-size:14.5px;color:var(--text400);white-space:nowrap;}
  .tab.active .label{color:var(--text900);}
  .tab.active{border-bottom-color:var(--text900);}
  .tab .count{background:var(--border2);color:var(--text400);font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px;}
  .tab.active .count{background:#f2f1f8;color:var(--text900);}
  .tab-tune{margin-left:auto;flex-shrink:0;color:var(--text400);cursor:pointer;padding:8px;}

  /* ---- TOOLBAR / INSTRUMENT BAR ---- */
  .doc-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;overflow-x:auto;padding:14px 20px;flex-shrink:0;}
  .doc-toolbar::-webkit-scrollbar{height:6px;}
  .search{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;padding:9px 12px;width:260px;flex-shrink:0;}
  .search input{border:none;outline:none;font-size:12.5px;width:100%;font-family:inherit;color:var(--text900);}
  .search-clear-btn{display:flex;color:var(--text400);cursor:pointer;border-radius:50%;flex-shrink:0;}
  .btn{border:1px solid var(--border);background:#fff;border-radius:8px;padding:8px 14px;font-size:12.5px;font-weight:600;color:var(--text900);cursor:pointer;font-family:inherit;flex-shrink:0;display:flex;align-items:center;gap:6px;}
  .btn:hover{background:var(--bg50);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.primary:hover{filter:brightness(0.95);}
  .btn.dark{background:var(--text900);border-color:var(--text900);color:#fff;}
  .btn.dark:hover{background:#292c50;}
  .btn.danger{background:var(--danger);border-color:var(--danger);color:#fff;}
  .badge-count{background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:9px;margin-left:2px;}
  .spacer{flex:1;}

  /* ---- FOLDERS ---- */
  .folders-wrap{padding:4px 20px 14px;flex-shrink:0;}
  .folders-label{font-size:11px;font-weight:700;color:var(--text400);letter-spacing:.4px;margin-bottom:8px;}
  .folders-row{display:flex;gap:10px;flex-wrap:wrap;}
  .folder-card{display:flex;align-items:center;gap:10px;border:1.5px solid var(--border2);border-radius:10px;padding:10px 14px 10px 10px;cursor:pointer;background:#fff;transition:border-color .12s, box-shadow .12s, transform .12s;width:216px;flex-shrink:0;overflow:hidden;position:relative;box-sizing:border-box;}
  .folder-card.drag-over{border-color:var(--accent);border-style:dashed;}
  .folder-card .folder-drag-handle{color:var(--text400);cursor:grab;display:flex;flex-shrink:0;}
  .folder-card .folder-kebab{margin-left:auto;flex-shrink:0;}
  .folder-card.sortable-ghost{border-style:dashed;border-color:var(--accent);}
  .folder-card.drag-over{border-color:var(--accent);}
  .folder-card:hover{border-color:var(--neutral300);}
  .folder-card.selected{border-color:var(--accent);border-width:1.5px;background:#f4fdf7;}
  .folder-card .ficon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .folder-card .fname{font-weight:600;font-size:12.5px;color:var(--text900);}
  .folder-card .fcount{font-size:11px;color:var(--text400);}
  .folder-card.create{border-style:dashed;color:var(--text400);}
  .folder-card.create .fname{color:var(--text400);}
  .all-files-row{display:flex;align-items:center;gap:10px;padding:0 20px 6px;}
  .all-files-row .divider{flex:1;height:1px;background:var(--border2);}
  .all-files-row .lbl{font-size:11px;font-weight:700;color:var(--text400);letter-spacing:.4px;white-space:nowrap;}

  /* ---- BULK BAR ---- */

  /* ---- TABLE ---- */
  .table-outer{flex:1;overflow:auto;margin:0 20px;border:1px solid var(--border2);border-radius:12px;min-height:0;scrollbar-width:thin;scrollbar-color:var(--neutral300) var(--bg50);}
  .table-outer::-webkit-scrollbar{height:11px;width:11px;}
  .table-outer::-webkit-scrollbar-track{background:var(--bg50);}
  .table-outer::-webkit-scrollbar-thumb{background:var(--neutral300);border-radius:6px;border:2px solid var(--bg50);}
  .table-outer::-webkit-scrollbar-thumb:hover{background:var(--text400);}
  table{width:100%;border-collapse:collapse;min-width:1000px;}
  thead th{position:sticky;top:0;background:var(--headerBg);text-align:left;font-size:10.5px;font-weight:700;color:var(--text400);letter-spacing:.3px;padding:11px 14px;border-bottom:1px solid var(--border2);cursor:pointer;user-select:none;white-space:nowrap;z-index:2;}
  thead th.tight, tbody td.tight{padding-left:0;padding-right:0;}
  thead th.tight:first-child, tbody td.tight:first-child{padding-left:10px;}
  thead th:hover{color:var(--text900);}
  thead th .sort-arrow{font-size:12px;margin-left:2px;opacity:.6;}
  tbody td{padding:11px 14px;border-bottom:1px solid var(--rowBorder);font-size:12.5px;vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--bg50);}
  /* Frozen-left columns (drag handle, checkbox, kebab, File Name) stay put
     during horizontal scroll — position:sticky within the single table/tbody,
     so row heights can never drift out of alignment the way a split
     synced-scroll table could. */
  td.frozen-col{position:sticky;z-index:1;background:#fff;}
  tbody tr:hover td.frozen-col{background:var(--bg50);}
  th.frozen-col{position:sticky;}
  .frozen-col-last{box-shadow:2px 0 4px -2px rgba(0,0,0,0.08);}
  .frozen-col-right{box-shadow:-2px 0 4px -2px rgba(0,0,0,0.08);}
  .fname-cell{display:flex;align-items:center;gap:10px;cursor:pointer;}
  .file-badge{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;}
  .fname-cell .ftext .fn{font-weight:600;color:var(--text900);}
  .fname-cell .ftext .fd{font-size:11px;color:var(--text400);margin-top:1px;}
  .file-count-badge{position:absolute;bottom:-4px;right:-4px;background:var(--text900);color:#fff;font-size:9px;font-weight:700;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;padding:0 2px;}
  .uploader-cell{display:flex;align-items:center;gap:8px;}
  .uploader-cell .ua{width:24px;height:24px;border-radius:50%;background:var(--border2);flex-shrink:0;}
  .status-pill{display:inline-block;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:700;white-space:nowrap;}
  .status-pill.valid{background:var(--success-bg);color:var(--success-t);}
  .status-pill.on_file{background:var(--success-bg);color:var(--success-t);}
  .status-pill.soon{background:var(--warning-bg);color:var(--warning-t);}
  .status-pill.expired{background:var(--danger-bg);color:var(--danger-t);}
  .status-pill.na{background:var(--neutral-bg);color:var(--text400);}
  .status-pill.missing{background:#fff;border:1px dashed var(--border);color:var(--text400);}
  .status-pill.awaiting_signature{background:#e8ecff;color:var(--accentBlue);}
  .status-pill.awaiting_upload{background:#eef4fb;color:var(--info);}
  .status-pill.pending_approval{background:var(--warning-bg);color:var(--warning-t);}
  .visible-driver-pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;background:var(--neutral-bg);color:var(--text400);}
  .visible-driver-pill.toggleable{cursor:pointer;}
  .visible-driver-pill.toggleable:hover{filter:brightness(0.95);}
  .visible-driver-pill.on{background:var(--success-bg);color:var(--success-t);}
  .task-status-pill{display:inline-block;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:700;}
  .task-status-pill.open{background:var(--neutral-bg);color:var(--text600);}
  .task-status-pill.in_progress{background:#eef4fb;color:var(--info);}
  .task-status-pill.completed{background:var(--success-bg);color:var(--success-t);}
  .tpf-view-icon{color:var(--info);cursor:pointer;display:flex;align-items:center;padding:2px;border-radius:6px;}
  .tpf-view-icon:hover{background:#eef4fb;}
  .file-type-icon.empty-slot{background:#fff;border:1.5px dashed var(--border);}
  .upload-slot-btn{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:700;font-size:11.5px;cursor:pointer;}
  .upload-slot-btn:hover{text-decoration:underline;}
  .row-actions{color:var(--text400);cursor:pointer;padding:4px;border-radius:6px;}
  .editable-field{cursor:pointer;border-bottom:1px dashed var(--border);padding-bottom:1px;}
  .editable-field:hover{color:var(--info);border-color:var(--info);}
  .select-field-pill{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--border);border-radius:20px;padding:3px 10px 3px 12px;font-size:12px;background:#fff;}
  .select-field-flyout button{display:flex;align-items:center;}
  .select-field-flyout button.active-opt{background:var(--bg50);font-weight:700;color:var(--text900);}
  .option-chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;min-height:24px;}
  .option-chip{display:flex;align-items:center;gap:6px;background:var(--bg50);border:1px solid var(--border2);border-radius:20px;padding:5px 6px 5px 8px;font-size:12px;color:var(--text900);}
  .opt-color-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;cursor:pointer;border:1px solid rgba(0,0,0,0.08);}
  .select-field-pill .opt-color-dot{cursor:default;}
  .option-chip .chip-remove{display:flex;color:var(--text400);cursor:pointer;border-radius:50%;}
  .option-chip .chip-remove:hover{color:var(--danger);}
  .no-options-hint{font-size:12px;color:var(--text400);font-style:italic;}
  .readonly-pill{display:inline-block;background:var(--bg50);border:1px solid var(--border2);border-radius:8px;padding:9px 12px;font-size:13px;color:var(--text600);}
  .template-row{border:1px solid var(--border2);border-radius:10px;padding:10px 14px;margin-bottom:8px;}
  .template-row.unfiled-tpl{border-style:dashed;background:var(--headerBg);}
  .template-header-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}

// ---- Floating popup positioning rule (flyouts, dropdowns, color pickers) ----
// Never let a popup extend past the viewport edge — that hides its own items
// behind the fold, making them impossible to click. Measure it invisibly
// first, then flip above the anchor if there isn't room below (same principle
// as the established kebab-menu portal positioning), and clamp horizontally.
function positionFlyout(menu, anchor){
  menu.style.position = 'fixed';
  menu.style.visibility = 'hidden';
  document.body.appendChild(menu);
  const anchorRect = anchor.getBoundingClientRect();
  const menuRect = menu.getBoundingClientRect();
  let top = anchorRect.bottom + 6;
  let left = anchorRect.left;
  if(left + menuRect.width > window.innerWidth - 8) left = window.innerWidth - menuRect.width - 8;
  if(left < 8) left = 8;
  if(top + menuRect.height > window.innerHeight - 8){
    top = anchorRect.top - menuRect.height - 6; // flip above the anchor
  }
  if(top < 8) top = 8; // if it doesn't fit above either, pin to the top rather than off-screen
  menu.style.top = top + 'px';
  menu.style.left = left + 'px';
  menu.style.visibility = 'visible';
}

  }
}
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}

}

// Shared status logic — used everywhere a document's attachments or
// expiration date change, so "uploaded, no expiration to track" always reads
// as a clear positive state ("On File") rather than a blank dash.
function computeStatus(doc){
  if(doc.attachments.length === 0) return 'missing';
  if(doc.exp){
    const days = (new Date(doc.exp) - new Date('2026-09-06')) / 86400000;
    return days < 0 ? 'expired' : (days <= 30 ? 'soon' : 'valid');
  }
  return 'on_file';
}

// Opens a preview inline, in a large lightbox over the current page — not a

function openPreviewLightbox(url, name){
  document.querySelectorAll('.preview-lightbox-scrim').forEach(n=>n.remove());
  const scrim = document.createElement('div');
  scrim.className = 'preview-lightbox-scrim';
  scrim.onclick = (e)=>{ if(e.target===scrim) scrim.remove(); };
  const box = document.createElement('div');
  box.className = 'preview-lightbox';
  const header = el(`<div class="preview-lightbox-header"><span class="preview-lightbox-title">${name}</span><span class="modal-close" style="position:static;">${iconHTML('close',16)}</span></div>`);
  header.querySelector('.modal-close').onclick = ()=> scrim.remove();
  box.appendChild(header);
  const frame = document.createElement('iframe');
  frame.className = 'preview-lightbox-frame';
  frame.src = url;
  box.appendChild(frame);
  scrim.appendChild(box);
  document.body.appendChild(scrim);
  document.addEventListener('keydown', function onEsc(e){ if(e.key==='Escape'){ scrim.remove(); document.removeEventListener('keydown', onEsc); } });
}

function showToast(msg){

function attachTooltip(target, textFn){
  let tip=null;
  target.addEventListener('mouseenter', ()=>{
    const text = typeof textFn==='function' ? textFn() : textFn;
    tip = document.createElement('div'); tip.className='rail-tooltip'; tip.textContent=text;
    document.body.appendChild(tip);

    tip.style.left = (r.right+10)+'px'; tip.style.top = (r.top+r.height/2)+'px';
  });
  target.addEventListener('mouseleave', ()=>{ if(tip){ tip.remove(); tip=null; } });
}
const TYPE_COLOR = {PDF:'var(--doc-pdf)', DOC:'var(--doc-doc)', XLS:'var(--doc-xls)', JPG:'var(--doc-jpg)'};
const TYPE_ICON = {PDF:'picture_as_pdf', DOC:'description', XLS:'table_chart', JPG:'image'};
// Maps a real filename to one of our 4 display buckets — the extension list
// per bucket covers the common real-world variants (JPEG/PNG/etc. all read
// as images), not just one exact spelling per type.
function detectFileType(filename){
  const ext = (filename.split('.').pop() || '').toUpperCase();
  if(['JPG','JPEG','PNG','GIF','WEBP','HEIC','HEIF','BMP','TIFF'].includes(ext)) return 'JPG';
  if(['XLS','XLSX','CSV','ODS'].includes(ext)) return 'XLS';
  if(['DOC','DOCX','RTF','TXT','ODT'].includes(ext)) return 'DOC';
  return 'PDF'; // PDF and anything unrecognized default to the PDF bucket
}
// A document's icon reflects what's actually inside its envelope:
// - one attachment → that type's icon/color
// - multiple attachments, same type (e.g. CDL front+back, both JPG) → that
//   type's icon/color, with a small count badge
// - multiple attachments, mixed types (e.g. a PDF form + a JPG photo) → a
//   neutral "stack" icon, since no single type color would be accurate
function fileIcon(doc, size){
  const s = size||24;
  if(doc.attachments.length === 0){
    // A template-created placeholder with nothing uploaded yet — a dashed,
    // neutral "empty slot" look, distinct from any real file's solid color.
    return `<div class="file-type-icon empty-slot" style="width:${s}px;height:${s}px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">${iconHTML('upload_file', Math.round(s*0.55), 'color:var(--text400);')}</div>`;
  }
  const types = docTypes(doc);
  const mixed = types.length > 1;
  const bg = mixed ? 'var(--neutral300)' : TYPE_COLOR[types[0]];
  const icon = mixed ? 'perm_media' : TYPE_ICON[types[0]];
  const badge = doc.attachments.length>1 ? `<span class="file-count-badge">${doc.attachments.length}</span>` : '';
  return `<div class="file-type-icon" style="position:relative;background:${bg};width:${s}px;height:${s}px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;">${iconHTML(icon, Math.round(s*0.55))}${badge}</div>`;
}
function statusLabel(s){ return {valid:'Valid', soon:'Expiring Soon', expired:'Expired', na:'—', missing:'Not Uploaded', awaiting_signature:'Awaiting Signature', awaiting_upload:'Awaiting Upload', pending_approval:'Pending Approval', on_file:'On File'}[s]; }
function folderName(id){ if(id==='unfiled') return 'Unfiled'; const f = FOLDERS.find(f=>f.id===id); return f ? f.name : 'Unfiled'; }
function docTypes(doc){ return [...new Set(doc.attachments.map(a=>a.type))]; }
function formatLabel(doc){
  if(doc.attachments.length === 0) return '—';
  const types = docTypes(doc);
  if(types.length>1) return 'Mixed';
  return types[0] + (doc.attachments.length>1 ? ` ×${doc.attachments.length}` : '');
}
function sizeLabel(doc){
  if(doc.attachments.length === 0) return '—';
  return doc.attachments.length>1 ? `${doc.attachments.length} files` : doc.attachments[0].size;
}

// Cancels an outstanding request (awaiting_upload/awaiting_signature) —
// reverts to whatever the document's status would be with no request in
// flight at all, clearing the request's own state (channel/link/signStatus).
function cancelRequest(doc){
  doc.deliveryChannel = null;
  doc.deliveryLink = null;
  doc.signStatus = null;
  doc.status = computeStatus(doc);
  logActivity(doc, 'Cancelled the outstanding request');
  showToast(`Request for "${doc.name}" cancelled`);
}
function approveDoc(doc){
  doc.status = computeStatus(doc);
  doc.approvedBy = 'Jon Doe';
  logActivity(doc, 'Approved the signed document');
  showToast(`"${doc.name}" approved`);
  render();
}
// ---- Reject a signed document: it must go back to exactly the state it was
// in before signing — same request, same channel, same link if one was
// generated — not back to a blank slot. The driver only has to try again,
// nobody has to re-initiate the request. The rejection reason is guaranteed
// to reach the driver either way: an in-app notification when they have the
// mobile app, or an email to the address on file when the request was a
// plain link (which has no built-in notification channel of its own).
function rejectSignedDoc(doc, reason){
  doc.attachments = [];
  doc.uploader = null; doc.uploadDate = null;
  if(doc.requiresSign){ doc.signStatus = 'sent'; doc.status = 'awaiting_signature'; }
  else { doc.status = 'awaiting_upload'; }
  // deliveryChannel and deliveryLink are left untouched on purpose.
  logActivity(doc, `Rejected the ${doc.requiresSign?'signed':'uploaded'} document${reason?` — "${reason}"`:''}`);
  if(doc.deliveryChannel === 'mobile_app'){
    logActivity(doc, `Sent the rejection reason to Maksim Gerasimov's mobile app`);
    showToast(`"${doc.name}" rejected — Maksim was notified in the app to try again`);
  } else {
    logActivity(doc, `Emailed the rejection reason and link to ${DRIVER_EMAIL}`);
    showToast(`"${doc.name}" rejected — reason and link emailed to ${DRIVER_EMAIL}`);
  }
}

function modalRejectSigned(doc, onDone){
  const m = modalShell(`<h2>${iconHTML('cancel',20,'color:var(--danger);vertical-align:middle;margin-right:6px;')}Reject "${doc.name}"?</h2>
    <p class="mdesc">${doc.deliveryChannel==='mobile_app'
      ? `The driver will need to ${doc.requiresSign?'fill and sign it':'upload it'} again. They'll see the reason as a notification in their app.`
      : `The driver will need to ${doc.requiresSign?'fill and sign it':'upload it'} again. Since this was sent as a link, the reason (and the same link) will be emailed to <b>${DRIVER_EMAIL}</b>.`}</p>
    <div class="field"><label>Reason</label><textarea id="rejectReason" placeholder="e.g. Signature is missing on page 2"></textarea></div>`);
  const modal = m.querySelector('.modal');
  const actions = el('<div class="actions"></div>');
  const cancelBtn = el('<button class="btn">Cancel</button>');
  cancelBtn.onclick = closeModal;
  const rejectBtn = el('<button class="btn danger">Reject & Send Back</button>');
  rejectBtn.onclick = ()=>{
    const reason = modal.querySelector('#rejectReason').value.trim();
    rejectSignedDoc(doc, reason);
    closeModal();
    if(onDone) onDone();
  };
  actions.appendChild(cancelBtn); actions.appendChild(rejectBtn);
  modal.appendChild(actions);
  return m;
}

function emptySlotActions(f){
  if(f.status === 'pending_approval'){
    return `<span class="upload-slot-btn" data-role="approve" data-id="${f.id}" style="color:var(--accent-dark, var(--accent));">${iconHTML('check_circle',13)}Approve</span> <span style="color:var(--border);">·</span> <span class="upload-slot-btn" data-role="reject" data-id="${f.id}" style="color:var(--danger);">${iconHTML('cancel',13)}Reject</span>`;
  }
  const via = f.deliveryChannel === 'mobile_app' ? "Sent to driver's app" : (f.deliveryChannel==='link' ? 'Link sent' : '');
  const copyLinkBtn = f.deliveryChannel==='link' ? `<span class="upload-slot-btn" data-role="copylink" data-id="${f.id}" style="color:var(--info);">${iconHTML('content_copy',13)}Copy Link</span> <span style="color:var(--border);">·</span> ` : '';
  // These two checks must come BEFORE the "already has attachments" check —
  // a document that's already on file can still have an active request
  // pending on top of it (e.g. asking for a renewed, re-signed version).
  if(f.signStatus === 'sent'){
    return `${copyLinkBtn}<span class="upload-slot-btn" data-role="simsign" data-id="${f.id}" style="color:var(--accentBlue);">${iconHTML('history_edu',13)}${via} — click to simulate signing</span>`;
  }
  if(f.status === 'awaiting_upload'){
    return `${copyLinkBtn}<span class="upload-slot-btn" data-role="simupload" data-id="${f.id}" style="color:var(--info);">${iconHTML('history_edu',13)}${via} — click to simulate upload</span>`;
  }
  if(f.attachments.length > 0) return `Uploaded ${f.uploadDate}${!state.activeFolder?' · '+folderName(f.folder):''}`;
  const uploadLink = `<span class="upload-slot-btn" data-role="uploadslot" data-id="${f.id}">${iconHTML('upload',13)}Upload</span>`;
  const requestLink = f.requiresSign
    ? ` <span style="color:var(--border);">·</span> <span class="upload-slot-btn" data-role="reqsign" data-id="${f.id}" style="color:var(--accentBlue);">${iconHTML('draw',13)}Request Signature</span>`
    : ` <span style="color:var(--border);">·</span> <span class="upload-slot-btn" data-role="requpload" data-id="${f.id}" style="color:var(--warning-t);">${iconHTML('send',13)}Request driver to upload</span>`;
  return uploadLink + requestLink;
}

  // table's scroll back to the top on every interaction (sort, edit, toggle,
  // select...) — capture the relevant scroll positions first and restore them
  // after rebuild, same principle as the established render() pattern. Both
  // axes matter: the file table scrolls horizontally too (many columns).
  const tableOuterBefore = document.querySelector('.table-outer');
  const prevTableScrollTop = tableOuterBefore?.scrollTop || 0;
  const prevTableScrollLeft = tableOuterBefore?.scrollLeft || 0;
  const prevContentScroll = document.querySelector('.content')?.scrollTop || 0;

  const newTableOuter = document.querySelector('.table-outer');
  if(newTableOuter){ newTableOuter.scrollTop = prevTableScrollTop; newTableOuter.scrollLeft = prevTableScrollLeft; }
  content.scrollTop = prevContentScroll;
  const newLeft = document.querySelector('.cab-left');

}

// state.perPage === 0 is the sentinel for "All" — resolve it to a concrete
// number wherever it's actually used, rather than special-casing math everywhere.
function effectivePerPage(total){
  return state.perPage === 0 ? Math.max(total, 1) : state.perPage;
}

function visibleFiles(){
  let list = files.slice();
  if(state.activeFolder === 'unfiled') list = list.filter(f=>!f.folder);
  else if(state.activeFolder) list = list.filter(f=>f.folder===state.activeFolder);
  if(state.search) list = list.filter(f=>f.name.toLowerCase().includes(state.search.toLowerCase()));
  const flt = state.filters;
  if(flt.fileType.size) list = list.filter(f=> f.attachments.some(a=>flt.fileType.has(a.type)));
  if(flt.status.size) list = list.filter(f=>flt.status.has(f.status));
  if(flt.visibleToDriver.size) list = list.filter(f=> flt.visibleToDriver.has(f.visibleToDriver?'visible':'hidden'));
  if(flt.requiresSign) list = list.filter(f=>f.requiresSign);
  if(flt.taskStatus.size) list = list.filter(f=> f.tasks.length===0 ? flt.taskStatus.has('none') : f.tasks.some(t=>flt.taskStatus.has(t.status)));
  if(flt.uploader.size) list = list.filter(f=>flt.uploader.has(f.uploader));
  if(flt.uploadFrom) list = list.filter(f=> new Date(f.uploadDate) >= new Date(flt.uploadFrom));
  if(flt.uploadTo) list = list.filter(f=> new Date(f.uploadDate) <= new Date(flt.uploadTo));
  if(flt.expFrom || flt.expTo){
    list = list.filter(f=>{
      if(!f.exp) return false;
      const d = new Date(f.exp);
      if(flt.expFrom && d < flt.expFrom) return false;
      if(flt.expTo && d > flt.expTo) return false;
      return true;
    });
  }
  if(flt.expiringOnly) list = list.filter(f=> f.status==='soon' || f.status==='expired');
  list.sort((a,b)=>{
    if(!state.sortKey) return 0;
    const k = state.sortKey;
    // Status is ranked by urgency (Expired worst → N/A last), same principle as the
    // established screening-status sort (Clean→Flagged→Pending) — never plain alphabetical.
    const STATUS_RANK = {expired:3, soon:2, valid:1, na:0};
    let av, bv;
    if(k==='status'){ av=STATUS_RANK[a.status]??0; bv=STATUS_RANK[b.status]??0; }
    else if(k==='uploadDate' || k==='exp'){ av = a[k]?new Date(a[k]):new Date(0); bv = b[k]?new Date(b[k]):new Date(0); }
    else if(k==='type'){ av=docTypes(a)[0]; bv=docTypes(b)[0]; }
    else if(k==='size'){ av=a.attachments.length; bv=b.attachments.length; }
    else if(k.startsWith('custom_')){ av=(a.customFields||{})[k]; bv=(b.customFields||{})[k]; }
    else if(k==='task'){ av=a.tasks.length?a.tasks[0].status:''; bv=b.tasks.length?b.tasks[0].status:''; }
    else { av=a[k]; bv=b[k]; }
    if(av===null||av===undefined) av='';
    if(bv===null||bv===undefined) bv='';
    if(av<bv) return -1*state.sortDir;
    if(av>bv) return 1*state.sortDir;
    return 0;
  });
  return list;
}

function renderFoldersRow(){
  const wrap = el('<div class="folders-wrap"></div>');
  wrap.appendChild(el('<div class="folders-label">FOLDERS</div>'));
  const row = el('<div class="folders-row"></div>');

  // Real folders live in their own inner container (display:contents keeps
  // flex layout intact) so SortableJS can reorder just these among
  // themselves, without Unfiled/Create Folder being draggable into that mix.
  const reorderGroup = document.createElement('div');
  reorderGroup.className = 'folders-reorder-group';
  reorderGroup.style.display = 'contents';
  row.appendChild(reorderGroup);

  FOLDERS.forEach(f=>{
    const count = files.filter(x=>x.folder===f.id).length;
    const card = el(`<div class="folder-card${state.activeFolder===f.id?' selected':''}" data-folder-id="${f.id}">
      <span class="folder-drag-handle">${iconHTML('drag_indicator',16)}</span>
      <div class="ficon" style="background:color-mix(in srgb, ${f.color} 15%, white);">${iconHTML('folder',18,`color:${f.color};`)}</div>
      <div><div class="fname">${f.name}</div><div class="fcount">${count} files</div></div>
      <span class="row-actions folder-kebab">${iconHTML('more_vert',17)}</span>
    </div>`);
    card.addEventListener('click', (e)=>{
      if(e.target.closest('.folder-drag-handle') || e.target.closest('.folder-kebab') || fileDragActive) return;
      state.activeFolder = state.activeFolder===f.id ? null : f.id; state.page=1; state.selected.clear(); render();
    });
    card.querySelector('.folder-kebab').addEventListener('click', (e)=>{
      e.stopPropagation();
      openFolderFlyout(e.currentTarget, f);
    });
    reorderGroup.appendChild(card);
    // Each folder card is also its own drop target for files dragged from the table.
    // onMove fires continuously while a dragged file hovers this card — used purely
    // for the green-border hint, never for opening/selecting the folder.
    safeSortable(card, {
      group: {name:'filesDrag', pull:false, put:true},
      onMove: ()=>{ clearDragOver(); card.classList.add('drag-over'); return false; },
      onAdd: (evt)=>{
        clearDragOver();
        const docId = Number(evt.item.dataset.docId);
        const doc = files.find(x=>x.id===docId);
        if(doc){ doc.folder = f.id; showToast(`Moved "${doc.name}" to ${f.name}`); }
        render();
      }
    });
  });

  safeSortable(reorderGroup, {
    handle: '.folder-drag-handle',
    onEnd: (evt)=>{
      try{
        const [moved] = FOLDERS.splice(evt.oldIndex, 1);
        FOLDERS.splice(evt.newIndex, 0, moved);
        render();
      }catch(err){ console.error('Folder reorder failed:', err); render(); }
    }
  });

  // Unfiled — a folder-like filter for documents that were never sorted into
  // a real folder, so they're never orphaned/impossible to find. Fixed
  // position (not part of the reorderable folder group), but still a valid
  // drop target for "take this out of its folder". Only shown when there's
  // actually something in it — an always-empty card is just noise.
  const unfiledCount = files.filter(x=>!x.folder).length;
  if(unfiledCount > 0){
    const unfiledCard = el(`<div class="folder-card${state.activeFolder==='unfiled'?' selected':''}">
      <div class="ficon" style="background:var(--bg50);">${iconHTML('folder_off',18,'color:var(--text400);')}</div>
      <div><div class="fname">Unfiled</div><div class="fcount">${unfiledCount} files</div></div>
    </div>`);
    unfiledCard.onclick = ()=>{ if(fileDragActive) return; state.activeFolder = state.activeFolder==='unfiled' ? null : 'unfiled'; state.page=1; state.selected.clear(); render(); };
    row.appendChild(unfiledCard);
    safeSortable(unfiledCard, {
      group: {name:'filesDrag', pull:false, put:true},
      onMove: ()=>{ clearDragOver(); unfiledCard.classList.add('drag-over'); return false; },
      onAdd: (evt)=>{
        clearDragOver();
        const docId = Number(evt.item.dataset.docId);
        const doc = files.find(x=>x.id===docId);
        if(doc){ doc.folder = null; showToast(`Moved "${doc.name}" to Unfiled`); }
        render();
      }
    });
  }

  const createCard = el(`<div class="folder-card create">${iconHTML('add',16)}<span class="fname">Create Folder</span></div>`);
  createCard.onclick = ()=> openModal('createFolder');
  row.appendChild(createCard);

  const templateCard = el(`<div class="folder-card create">${iconHTML('fact_check',16)}<span class="fname">Apply Suggestion</span></div>`);
  templateCard.onclick = ()=> openModal('templates');
  row.appendChild(templateCard);

  wrap.appendChild(row);
  return wrap;
}

}

function renderTable(){
  const outer = el('<div class="table-outer"></div>');
  const list = visibleFiles();
  const pageStart = (state.page-1)*effectivePerPage(list.length);
  const pageItems = list.slice(pageStart, pageStart+effectivePerPage(list.length));

  // IMPORTANT: <thead>/<tr>/<td> only parse correctly when assigned via innerHTML
  // on a real table-context element (table/thead/tbody/tr) — never through a
  // generic <div> (the el() helper), which silently drops/mangles table tags.
  // Build the whole table as one HTML string on a <table> element instead.
  const COL_RENDER = {
    uploader: { sortKey:'uploader', label:'Uploader', cell:f=> f.uploader ? `<div class="uploader-cell"><div class="ua"></div>${f.uploader}</div>` : `<span style="color:var(--text400);">—</span>` },
    format:   { sortKey:'type', label:'Format', cell:f=>formatLabel(f) },
    size:     { sortKey:'size', label:'File Size', cell:f=>sizeLabel(f) },
    expiration:{ sortKey:'exp', label:'Expiration', cell:f=>f.exp||'—' },
    status:   { sortKey:'status', label:'Status', cell:f=>`<span class="status-pill ${f.status}">${statusLabel(f.status)}</span>` },
    visibleToDriver: { sortKey:'visibleToDriver', label:'Visible to Driver', cell:f=>`<span class="visible-driver-pill ${f.visibleToDriver?'on':''}">${iconHTML(f.visibleToDriver?'visibility':'visibility_off',13)}${f.visibleToDriver?'Visible':'Hidden'}</span>` },
    task: { sortKey:'task', label:'Task', cell:f=> f.tasks.length===0 ? '<span style="color:var(--text400);">—</span>' : `<span class="task-status-pill ${f.tasks[0].status.toLowerCase().replace(' ','_')}">${f.tasks[0].status}</span>${f.tasks.length>1?` <span style="color:var(--text400);font-size:11px;">+${f.tasks.length-1}</span>`:''}` },
  };
  const visibleCols = columnDefs.filter(c=>c.visible);
  function colRenderFor(col){
    if(!col.custom) return COL_RENDER[col.key];
    return { sortKey: col.key, label: col.label, cell: f=>`<span data-role="editfield" data-id="${f.id}" data-colkey="${col.key}" class="editable-field">${formatFieldDisplay(f,col)}</span>` };
  }
  // Manual drag-to-reorder only makes sense in the unsorted (custom order) view —
  // once a column sort is active, sorting would immediately override any manual
  // order, so the handle is hidden rather than offering an action that "doesn't stick".
  const dragEnabled = state.sortKey === null;

  // Frozen-left columns (drag handle, checkbox, kebab, File Name) stay put
  // during horizontal scroll — sticky, not a second synced-scroll table,
  // since these are single-table rows and sticky can't misalign row heights
  // the way a split table could. Offsets shift when the drag handle column
  // isn't rendered (sorted view), so they're computed here, not hardcoded.
  // Both ends are user-togglable (Manage Columns → Pin first/last column),
  // same mechanism as the Candidates List reference pattern.
  const pinFirst = state.pinFirstColumn;
  const pinLast = state.pinLastColumn && visibleCols.length > 0;
  const dragW = (pinFirst && dragEnabled) ? 18 : 0;
  const cbLeft = dragW;
  const kebabLeft = cbLeft + 26;
  const fnameLeft = kebabLeft + 26;
  const fc = pinFirst ? 'frozen-col' : ''; // applied to the bundled first-column controls only when pinned
  const lastColKey = pinLast ? colRenderFor(visibleCols[visibleCols.length-1]).sortKey : null;

  const headCells = [
    dragEnabled ? `<th class="tight ${fc}" style="width:18px;${pinFirst?`left:0;z-index:3;`:''}"></th>` : '',
    `<th class="tight ${fc}" style="width:26px;${pinFirst?`left:${cbLeft}px;z-index:3;`:''}"><input type="checkbox" id="selAll"/></th>`,
    state.selected.size>0
      ? `<th class="tight ${fc}" style="width:26px;${pinFirst?`left:${kebabLeft}px;z-index:3;`:''}"><span class="row-actions" id="bulkMenuBtn">${iconHTML('more_vert',18)}</span></th>`
      : `<th class="tight ${fc}" style="width:26px;${pinFirst?`left:${kebabLeft}px;z-index:3;`:''}"></th>`,
    state.selected.size>0
      ? `<th class="${fc} ${pinFirst?'frozen-col-last':''}" style="${pinFirst?`left:${fnameLeft}px;z-index:3;`:''}min-width:260px;"><span id="bulkSummary" style="color:var(--text900);font-weight:700;">${state.selected.size} selected</span></th>`
      : `<th class="${fc} ${pinFirst?'frozen-col-last':''}" data-key="name" style="${pinFirst?`left:${fnameLeft}px;z-index:3;`:''}min-width:260px;">File Name${sortIndicator('name')}</th>`,
    ...visibleCols.map(c=>{
      const cr = colRenderFor(c);
      const pinned = pinLast && cr.sortKey===lastColKey;
      return `<th data-key="${cr.sortKey}" class="${pinned?'frozen-col frozen-col-right':''}" style="${pinned?'right:0;z-index:3;':''}">${cr.label}${sortIndicator(cr.sortKey)}</th>`;
    }),
  ].join('');

  let bodyRows = '';
  if(pageItems.length===0){
    bodyRows = `<tr><td colspan="${(dragEnabled?1:0)+3+visibleCols.length}" style="text-align:center;color:var(--text400);padding:40px;">No documents match your search/filters.</td></tr>`;
  } else {
    bodyRows = pageItems.map(f=>{
      const cells = [
        dragEnabled ? `<td class="tight ${fc}" style="${pinFirst?`left:0;`:''}"><span class="drag-handle">${iconHTML('drag_indicator',18)}</span></td>` : '',
        `<td class="tight ${fc}" style="${pinFirst?`left:${cbLeft}px;`:''}"><input type="checkbox" data-role="rowcb" data-id="${f.id}" ${state.selected.has(f.id)?'checked':''}/></td>`,
        `<td class="tight ${fc}" style="${pinFirst?`left:${kebabLeft}px;`:''}"><span class="row-actions" data-role="rowmenu" data-id="${f.id}">${iconHTML('more_vert',18)}</span></td>`,
        `<td class="${fc} ${pinFirst?'frozen-col-last':''}" style="${pinFirst?`left:${fnameLeft}px;`:''}min-width:260px;padding-left:6px;"><div class="fname-cell" data-role="openpanel" data-id="${f.id}">${fileIcon(f,28)}<div class="ftext"><div class="fn">${f.name}${f.attachments.length>1?` <span style="color:var(--text400);font-weight:400;">(${f.attachments.length} files)</span>`:''}</div><div class="fd">${emptySlotActions(f)}</div></div></div></td>`,
        ...visibleCols.map(c=>{
          const cr = colRenderFor(c);
          const pinned = pinLast && cr.sortKey===lastColKey;
          return `<td class="${pinned?'frozen-col frozen-col-right':''}" style="${pinned?`right:0;`:''}">${cr.cell(f)}</td>`;
        }),
      ].join('');
      return `<tr data-doc-id="${f.id}">${cells}</tr>`;
    }).join('');
  }

  const table = document.createElement('table');
  table.innerHTML = `<thead><tr>${headCells}</tr></thead><tbody>${bodyRows}</tbody>`;
  if(state.selected.size > 0) table.classList.add('has-selection');

  table.querySelectorAll('th[data-key]').forEach(th=>{
    th.onclick = ()=>{
      const key = th.dataset.key;
      if(state.sortKey===key) state.sortDir *= -1;
      else { state.sortKey=key; state.sortDir=1; }
      render();
    };
  });
  const selAll = table.querySelector('#selAll');
  const allSelected = pageItems.length>0 && pageItems.every(f=>state.selected.has(f.id));
  const someSelected = pageItems.some(f=>state.selected.has(f.id));
  selAll.checked = allSelected;
  selAll.indeterminate = someSelected && !allSelected;
  selAll.onchange = (e)=>{
    if(e.target.checked) pageItems.forEach(f=>state.selected.add(f.id));
    else pageItems.forEach(f=>state.selected.delete(f.id));
    render();
  };
  const bulkMenuBtn = table.querySelector('#bulkMenuBtn');
  if(bulkMenuBtn){
    bulkMenuBtn.onclick = (e)=>{ e.stopPropagation(); openBulkFlyout(e.currentTarget); };
  }
  table.querySelectorAll('[data-role="rowcb"]').forEach(cb=>{
    cb.onchange = (e)=>{
      const id = Number(cb.dataset.id);
      if(e.target.checked) state.selected.add(id); else state.selected.delete(id);
      render();
    };
  });
  table.querySelectorAll('[data-role="rowmenu"]').forEach(btn=>{
    btn.onclick = (e)=>{
      const id = Number(btn.dataset.id);
      const file = files.find(f=>f.id===id);
      openRowFlyout(e.currentTarget, file);
    };
  });
  table.querySelectorAll('[data-role="editfield"]').forEach(span=>{
    span.onclick = (e)=>{
      const id = Number(span.dataset.id);
      const doc = files.find(f=>f.id===id);
      const col = columnDefs.find(c=>c.key===span.dataset.colkey);
      if(!doc || !col) return;
      if(col.fieldType==='select') openSelectFieldPicker(e.currentTarget, doc, col);
      else editFieldPrompt(doc, col);
    };
  });
  table.querySelectorAll('[data-role="uploadslot"]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const id = Number(btn.dataset.id);
      const doc = files.find(f=>f.id===id);
      if(doc) triggerPcUpload(doc);
    };
  });
  table.querySelectorAll('[data-role="requpload"]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const id = Number(btn.dataset.id);
      const doc = files.find(f=>f.id===id);
      if(doc) openModal('deliveryChoiceUpload', doc);
    };
  });
  table.querySelectorAll('[data-role="reqsign"]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const id = Number(btn.dataset.id);
      const doc = files.find(f=>f.id===id);
      if(doc) openModal('requestSignature', doc);
    };
  });
  table.querySelectorAll('[data-role="simsign"]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const id = Number(btn.dataset.id);
      const doc = files.find(f=>f.id===id);
      if(!doc) return;
      // Demo-only shortcut: real completion arrives once the driver actually
      // signs on their end — this just lets the flow be demonstrated without
      // a live integration. Signing doesn't finalize the document by itself —
      // it lands in Pending Approval until a manager reviews it.
      doc.attachments.push(att('PDF', '210 KB'));
      doc.signStatus = 'signed';
      doc.uploader = 'Maksim Gerasimov (signed)';
      doc.uploadDate = 'Sep 6, 2026';
      doc.status = 'pending_approval';
      logActivity(doc, 'Maksim Gerasimov signed the document (via ' + (doc.deliveryChannel==='mobile_app'?'mobile app':'link') + ')');
      showToast(`"${doc.name}" signed by Maksim Gerasimov — needs your approval`);
      render();
    };
  });
  table.querySelectorAll('[data-role="simupload"]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const id = Number(btn.dataset.id);
      const doc = files.find(f=>f.id===id);
      if(!doc) return;
      // Demo-only shortcut: real completion arrives once the driver actually
      // uploads via the link or the mobile app. A driver's own upload needs
      // office approval too — same as a signature — before it's considered
      // final, so it doesn't skip straight to computeStatus().
      doc.attachments.push(att('PDF', '340 KB'));
      doc.uploader = 'Maksim Gerasimov';
      doc.uploadDate = 'Sep 6, 2026';
      doc.status = 'pending_approval';
      logActivity(doc, 'Maksim Gerasimov uploaded a file (via ' + (doc.deliveryChannel==='mobile_app'?'mobile app':'link') + ') — needs approval');
      showToast(`"${doc.name}" received from Maksim Gerasimov — needs your approval`);
      render();
    };
  });
  table.querySelectorAll('[data-role="copylink"]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const id = Number(btn.dataset.id);
      const doc = files.find(f=>f.id===id);
      if(doc) openModal('linkReady', doc);
    };
  });
  table.querySelectorAll('[data-role="approve"]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const id = Number(btn.dataset.id);
      const doc = files.find(f=>f.id===id);
      if(doc) approveDoc(doc);
    };
  });
  table.querySelectorAll('[data-role="reject"]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const id = Number(btn.dataset.id);
      const doc = files.find(f=>f.id===id);
      if(doc) openModal('rejectSigned', doc);
    };
  });
  table.querySelectorAll('[data-role="openpanel"]').forEach(cell=>{
    cell.onclick = (e)=>{
      const id = Number(cell.dataset.id);
      const doc = files.find(f=>f.id===id);
      if(doc) openDocumentPanel(doc);
    };
  });

  if(dragEnabled){
    const tbody = table.querySelector('tbody');
    safeSortable(tbody, {
      handle: '.drag-handle',
      group: {name:'filesDrag', pull:'clone', put:false},
      // Real DOM removal/reinsertion happens automatically since this isn't
      // 'clone' for same-list drags — SortableJS moves the actual <tr>. For a
      // drop onto a folder card (a different group container), pull:'clone'
      // combined with removing the original after a successful onEnd into a
      // foreign list keeps both interactions working from one instance.
      onStart: ()=>{ fileDragActive = true; },
      onEnd: (evt)=>{
        clearDragOver();
        // Small delay before re-enabling folder-card clicks: the mouseup that
        // ends a forceFallback drag can otherwise be read as the next click.
        setTimeout(()=>{ fileDragActive = false; }, 50);
        try{
          if(evt.to !== tbody) return; // dropped on a folder card — that card's own onAdd already handled the move and re-rendered
          const idsInNewOrder = [...tbody.querySelectorAll('tr[data-doc-id]')].map(tr=>Number(tr.dataset.docId));
          const idSet = new Set(idsInNewOrder);
          const firstIdx = files.findIndex(f=>idSet.has(f.id));
          const remaining = files.filter(f=>!idSet.has(f.id));
          const reorderedVisible = idsInNewOrder.map(id=>files.find(f=>f.id===id)).filter(Boolean);
          files = [...remaining.slice(0,firstIdx), ...reorderedVisible, ...remaining.slice(firstIdx)];
          render();
        }catch(err){ console.error('Row reorder failed:', err); render(); }
      }
    });
  }

  outer.appendChild(table);

  // A mouse's wheel is vertical-only by default — Shift+wheel is the
  // established desktop convention for horizontal scroll, but not every
  // browser maps it automatically. Handling it explicitly guarantees it
  // works everywhere, not just on trackpads (which already send horizontal
  // deltas natively via two-finger swipe).
  outer.addEventListener('wheel', (e)=>{
    if(e.shiftKey && e.deltaY !== 0){
      e.preventDefault();
      outer.scrollLeft += e.deltaY;
    }
  }, { passive:false });

  return outer;
}

// ---- Branded date picker — replaces the native <input type="date"> popup,
// which is an unstyleable OS control and doesn't match the brand at all.
// A lightweight month-grid flyout instead: accent green for the selected
// day, a subtle outline for today, Source Sans typography throughout. ----
function openBrandedCalendar(anchor, currentIso, onSelect){
  document.querySelectorAll('.flyout').forEach(m=>m.remove());
  const today = new Date('2026-09-06');
  let viewDate = currentIso ? new Date(currentIso+'T00:00:00') : new Date(today);
  viewDate.setDate(1);
  const picker = el('<div class="flyout brand-calendar"></div>');

  function render(){
    picker.innerHTML = '';
    const header = el(`<div class="bc-header">
      <span class="bc-nav" data-dir="-1">${iconHTML('chevron_left',18)}</span>
      <span class="bc-month">${viewDate.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</span>
      <span class="bc-nav" data-dir="1">${iconHTML('chevron_right',18)}</span>
    </div>`);
    header.querySelector('[data-dir="-1"]').onclick = ()=>{ viewDate.setMonth(viewDate.getMonth()-1); render(); };
    header.querySelector('[data-dir="1"]').onclick = ()=>{ viewDate.setMonth(viewDate.getMonth()+1); render(); };
    picker.appendChild(header);

    const grid = el('<div class="bc-grid"></div>');
    ['S','M','T','W','T','F','S'].forEach(d=> grid.appendChild(el(`<span class="bc-dow">${d}</span>`)));
    const firstDay = new Date(viewDate);
    const startOffset = firstDay.getDay();
    const daysInMonth = new Date(viewDate.getFullYear(), viewDate.getMonth()+1, 0).getDate();
    for(let i=0;i<startOffset;i++) grid.appendChild(el('<span class="bc-day empty"></span>'));
    for(let d=1; d<=daysInMonth; d++){
      const cellDate = new Date(viewDate.getFullYear(), viewDate.getMonth(), d);
      const iso = isoDate(cellDate);
      const isToday = sameDay(cellDate, today);
      const isSelected = currentIso === iso;
      const cell = el(`<span class="bc-day${isToday?' today':''}${isSelected?' selected':''}">${d}</span>`);
      cell.onclick = ()=>{ picker.remove(); onSelect(iso); };
      grid.appendChild(cell);
    }
    picker.appendChild(grid);

    const footer = el('<div class="bc-footer"></div>');
    const todayBtn = el('<span class="bc-today-link">Today</span>');
    todayBtn.onclick = ()=>{ picker.remove(); onSelect(isoDate(today)); };
    const clearBtn = el('<span class="bc-clear-link">Clear</span>');
    clearBtn.onclick = ()=>{ picker.remove(); onSelect(null); };
    footer.appendChild(todayBtn); footer.appendChild(clearBtn);
    picker.appendChild(footer);
  }
  render();
  positionFlyout(picker, anchor);
  setTimeout(()=>{
    document.addEventListener('click', function h(ev){ if(!picker.contains(ev.target) && ev.target!==anchor){ picker.remove(); document.removeEventListener('click',h); } });
  },0);
}
