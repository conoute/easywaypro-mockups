const PAGE_SIZE_OPTIONS = [10, 20, 50, 100];
function renderPagination(){
  const list = visibleFiles();
  const total = list.length;
  const perPage = effectivePerPage(total);
  const totalPages = Math.max(1, Math.ceil(total/perPage));
  if(state.page>totalPages) state.page = totalPages;
  const start = total===0?0:(state.page-1)*perPage+1;
  const end = Math.min(state.page*perPage, total);

  const bar = el('<div class="pagination-bar"></div>');
  const left = el(`<div class="page-size-group"><span class="psum">Showing ${start}–${end} of ${total}</span></div>`);
  // Show options in order, stopping at (and including) the first one that
  // already covers every row — e.g. 45 files → 10, 20, 50 (stop at 50).
  // 68 files → 10, 20, 50, 100 (stop at 100). "All" only appears as a
  // fallback when even 100 isn't enough to cover everything.
  const availableSizes = [];
  for (const n of PAGE_SIZE_OPTIONS){
    availableSizes.push(n);
    if(n >= total) break;
  }
  if(availableSizes[availableSizes.length-1] < total) availableSizes.push('all');
  if(availableSizes.length > 1){
    const sizeWrap = el(`<label class="page-size-select"><span>Show</span></label>`);
    const select = el('<select id="perPageSelect"></select>');
    availableSizes.forEach(n=> select.appendChild(el(`<option value="${n==='all'?0:n}" ${(n==='all'?0:n)===state.perPage?'selected':''}>${n==='all'?'All':n}</option>`)));
    const validValues = availableSizes.map(n=> n==='all'?0:n);
    if(!validValues.includes(state.perPage)) select.value = validValues[0];
    select.onchange = (e)=>{ state.perPage = Number(e.target.value); state.page = 1; render(); };
    sizeWrap.appendChild(select);
    sizeWrap.appendChild(el('<span>per page</span>'));
    left.appendChild(sizeWrap);
  }
  bar.appendChild(left);

  const nav = el('<div class="pagenav"></div>');
  const prev = el(`<button ${state.page===1?'disabled':''}>${iconHTML('chevron_left',16)}</button>`);
  prev.onclick = ()=>{ state.page--; render(); };
  nav.appendChild(prev);
  for(let i=1;i<=totalPages;i++){
    const b = el(`<button class="${i===state.page?'active':''}">${i}</button>`);
    b.onclick = ()=>{ state.page=i; render(); };
    nav.appendChild(b);
  }
  const next = el(`<button ${state.page===totalPages?'disabled':''}>${iconHTML('chevron_right',16)}</button>`);
  next.onclick = ()=>{ state.page++; render(); };
  nav.appendChild(next);
  bar.appendChild(nav);
  return bar;
}

// ============ MODALS ============
function openModal(type, payload){ state.modal = {type, payload}; render(); }

// A modal opened ON TOP of the current one, outside the render() cycle
// entirely — for cases like editing a file template while mid-way through
// building a Document Template, where a full re-render would wipe out the
// folders/docs draft the user hasn't saved yet.
function openNestedModal(contentNode){
  const scrim = document.createElement('div');
  scrim.className = 'modal-scrim';
  scrim.style.zIndex = 260;
  scrim.appendChild(contentNode);
  document.body.appendChild(scrim);
  scrim.onclick = (e)=>{ if(e.target===scrim) scrim.remove(); };
  return ()=> scrim.remove();
}

// ---- "Open Document" side panel — slides in from the right with a dimmed
// background, the established quick-detail pattern (distinct from a centered
// modal). Lives outside the render() cycle entirely, like openNestedModal,
// so it survives the main app re-rendering underneath it (e.g. after a
// rename triggered from inside the panel). ----
function openDocumentPanel(doc){
  document.querySelectorAll('.side-panel-scrim').forEach(n=>n.remove());
  const scrim = document.createElement('div');
  scrim.className = 'side-panel-scrim';
  const panel = document.createElement('div');
  panel.className = 'side-panel';

  function closePanel(){ scrim.classList.remove('open'); setTimeout(()=> scrim.remove(), 200); }
  scrim.onclick = (e)=>{ if(e.target===scrim) closePanel(); };
  document.addEventListener('keydown', function onEsc(e){ if(e.key==='Escape'){ closePanel(); document.removeEventListener('keydown', onEsc); } });

  let activeTab = 'details';
  let shareConfirming = false;

  function detailRow(label, valueHtml){ return el(`<div class="sp-detail-row"><span class="sp-detail-label">${label}</span><span class="sp-detail-value">${valueHtml}</span></div>`); }

  function attachmentRow(a, i, archived){
    const row = el(`<div class="sp-attachment-row">
      ${fileIcon({attachments:[a]}, 30)}
      <div class="sp-att-text"><div class="sp-att-name">${a.isForm ? (FILE_TEMPLATES.find(t=>t.id===a.fileTemplateId)?.name || 'Form') : (a.originalName || `${doc.name}${doc.attachments.length>1&&!archived?` (${i+1})`:''}.${a.type.toLowerCase()}`)}</div><div class="sp-att-meta">${a.isForm?'Fillable form':a.type} · ${a.size}</div></div>
    </div>`);
    const btnRow = el('<div class="sp-att-actions"></div>');
    if(!archived){
      const viewBtn = el(`<span class="sp-icon-btn" title="View">${iconHTML('visibility',15)}</span>`);
      viewBtn.onclick = ()=>{ openPreviewLightbox(a.objectUrl || simulatedPreviewUrl({...doc, attachments:[a]}), doc.name); };
      btnRow.appendChild(viewBtn);
      if(a.isForm){
        const editBtn = el(`<span class="sp-icon-btn" title="View form">${iconHTML('draw',15)}</span>`);
        editBtn.onclick = ()=>{
          const ft = FILE_TEMPLATES.find(t=>t.id===a.fileTemplateId);
          let closeNested;
          const node = modalFileTemplateEditor(ft, { onSave:()=>closeNested(), onCancel:()=>closeNested() });
          closeNested = openNestedModal(node);
        };
        btnRow.appendChild(editBtn);
      } else {
        const dlBtn = el(`<span class="sp-icon-btn" title="Download">${iconHTML('download',15)}</span>`);
        dlBtn.onclick = ()=>{
          if(a.objectUrl){ const link=document.createElement('a'); link.href=a.objectUrl; link.download=attachmentFileName(doc,a,i); document.body.appendChild(link); link.click(); link.remove(); }
          showToast('Downloading...');
        };
        btnRow.appendChild(dlBtn);
      }
      const archiveBtn = el(`<span class="sp-icon-btn" title="Archive">${iconHTML('archive',15)}</span>`);
      archiveBtn.onclick = ()=>{
        if(doc.status==='pending_approval'){ showToast('Approve or Reject this submission first — archiving it would erase the decision trail'); return; }
        doc.attachments = doc.attachments.filter(x=>x.id!==a.id);
        doc.archivedAttachments.push(a);
        logActivity(doc, `Archived ${a.isForm?'a form':'a file'}`);
        doc.status = computeStatus(doc);
        renderPanel(); render();
      };
      btnRow.appendChild(archiveBtn);
      const delBtn = el(`<span class="sp-icon-btn" title="Delete">${iconHTML('delete',15)}</span>`);
      delBtn.onclick = ()=>{
        if(doc.status==='pending_approval'){ showToast('Approve or Reject this submission first — deleting it would erase the decision trail'); return; }
        doc.attachments = doc.attachments.filter(x=>x.id!==a.id);
        logActivity(doc, `Deleted ${a.isForm?'a form':'a file'}`);
        doc.status = computeStatus(doc);
        renderPanel(); render();
      };
      btnRow.appendChild(delBtn);
    } else {
      const restoreBtn = el(`<span class="sp-icon-btn" title="Restore">${iconHTML('unarchive',15)}</span>`);
      restoreBtn.onclick = ()=>{
        doc.archivedAttachments = doc.archivedAttachments.filter(x=>x.id!==a.id);
        doc.attachments.push(a);
        logActivity(doc, `Restored ${a.isForm?'a form':'a file'} from archive`);
        renderPanel(); render();
      };
      btnRow.appendChild(restoreBtn);
    }
    row.appendChild(btnRow);
    return row;
  }

  function renderDetailsTab(body){
    const detailsSection = el('<div class="sp-section"></div>');
    detailsSection.appendChild(el('<div class="sp-section-title">DETAILS</div>'));
    detailsSection.appendChild(detailRow('Status', `<span class="status-pill ${doc.status}">${statusLabel(doc.status)}</span>`));
    detailsSection.appendChild(detailRow('Uploader', doc.uploader || '—'));
    detailsSection.appendChild(detailRow('Upload Date', doc.uploadDate || '—'));
    const expIso = doc.exp ? isoDate(new Date(doc.exp)) : '';
    const expRow = el(`<div class="sp-detail-row"><span class="sp-detail-label">Expiration</span><span class="sp-exp-input" tabindex="0">${doc.exp || 'Set date'}</span></div>`);
    expRow.querySelector('.sp-exp-input').onclick = (e)=>{
      openBrandedCalendar(e.currentTarget, expIso, (iso)=>{
        doc.exp = iso ? new Date(iso+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : null;
        doc.status = computeStatus(doc);
        logActivity(doc, doc.exp ? `Set expiration to ${doc.exp}` : 'Cleared the expiration date');
        showToast('Expiration updated');
        renderPanel(); render();
      });
    };
    detailsSection.appendChild(expRow);
    const visRow = el(`<div class="sp-detail-row"><span class="sp-detail-label">Visible to Driver</span><span class="visible-driver-pill toggleable ${doc.visibleToDriver?'on':''}">${iconHTML(doc.visibleToDriver?'visibility':'visibility_off',12)}${doc.visibleToDriver?'Visible':'Hidden'}</span></div>`);
    visRow.querySelector('.visible-driver-pill').onclick = ()=>{
      doc.visibleToDriver = !doc.visibleToDriver;
      logActivity(doc, doc.visibleToDriver ? 'Made visible to driver' : 'Hidden from driver');
      showToast(doc.visibleToDriver ? 'Now visible to the driver' : 'Hidden from the driver');
      renderPanel(); render();
    };
    detailsSection.appendChild(visRow);
    body.appendChild(detailsSection);

    // A form stays editable/removable right up until it's actually sent out
    // for signing — once it's in the driver's hands, changing it under them
    // makes no sense, so it drops to preview-only. It opens back up the
    // moment a signed version comes back (pending approval or later),
    // showing what the driver actually filled in rather than the blank
    // starting point.
    if(doc.requiresSign && doc.fileTemplateId){
      const ft = FILE_TEMPLATES.find(t=>t.id===doc.fileTemplateId);
      if(ft){
        const locked = doc.status === 'awaiting_signature';
        const formSection = el('<div class="sp-section"></div>');
        formSection.appendChild(el('<div class="sp-section-title">FORM</div>'));
        const card = el(`<div class="sp-form-card">
          <div><div class="sp-form-name">${iconHTML('draw',15,'color:var(--accentBlue);')}<span>${ft.name}</span></div>
          <div class="sp-form-sub">${locked ? "Sent for signing — preview only until it's back" : (doc.status==='pending_approval' ? 'Signed — showing what the driver filled in' : (doc.status==='missing' ? 'Ready to send' : 'Signed and on file'))}</div></div>
        </div>`);
        const actionsWrap = el('<div class="sp-form-actions"></div>');
        if(locked){
          const viewIcon = el(`<span class="sp-icon-btn" title="Preview">${iconHTML('visibility',15)}</span>`);
          viewIcon.onclick = ()=> openNestedModal(modalFileTemplateEditor(ft, { forceReadOnly: true }));
          actionsWrap.appendChild(viewIcon);
        } else {
          const editIcon = el(`<span class="sp-icon-btn" title="Edit">${iconHTML('edit',15)}</span>`);
          editIcon.onclick = ()=> openNestedModal(modalFileTemplateEditor(ft, { onSave: renderPanel, onCancel: renderPanel }));
          const delIcon = el(`<span class="sp-icon-btn" title="Remove form requirement">${iconHTML('delete',15)}</span>`);
          delIcon.onclick = ()=>{
            doc.requiresSign = false; doc.fileTemplateId = null;
            logActivity(doc, `Removed the required form "${ft.name}"`);
            showToast('Form requirement removed');
            renderPanel(); render();
          };
          actionsWrap.appendChild(editIcon); actionsWrap.appendChild(delIcon);
        }
        card.appendChild(actionsWrap);
        formSection.appendChild(card);
        body.appendChild(formSection);
      }
    }

    const actionsSection = el('<div class="sp-section"></div>');
    actionsSection.appendChild(el('<div class="sp-section-title">ACTIONS</div>'));
    const actionsList = el('<div class="sp-actions-list"></div>');
    // A share link that's past its chosen expiry is treated as already gone —
    // checked live (real clock) whenever this tab renders, not on a timer,
    // since nothing needs to happen while nobody's looking at it.
    if(doc.shareLink && doc.shareLinkExpiresAt && Date.now() > doc.shareLinkExpiresAt){
      doc.shareLink = null; doc.shareLinkExpiresAt = null;
      logActivity(doc, 'Share link expired automatically');
    }
    if(doc.shareLink){
      const expiryText = doc.shareLinkExpiresAt ? `Expires ${formatRelativeExpiry(doc.shareLinkExpiresAt)}` : 'Never expires';
      const shareRow = el(`<div class="sp-share-link-row"><input type="text" readonly value="${doc.shareLink}"/><span class="sp-icon-btn" title="Copy link">${iconHTML('content_copy',15)}</span><span class="sp-icon-btn" title="Revoke — kills this link">${iconHTML('link_off',15)}</span></div>`);
      shareRow.querySelectorAll('.sp-icon-btn')[0].onclick = ()=>{ copyToClipboard(doc.shareLink); showToast('Link copied'); };
      shareRow.querySelectorAll('.sp-icon-btn')[1].onclick = ()=>{
        doc.shareLink = null; doc.shareLinkExpiresAt = null;
        logActivity(doc, 'Revoked the share link');
        showToast('Share link revoked — it no longer works');
        renderPanel();
      };
      actionsList.appendChild(shareRow);
      actionsList.appendChild(el(`<div class="sp-share-expiry">${iconHTML('schedule',12)}${expiryText}</div>`));
    } else if(shareConfirming){
      const warn = el(`<div class="sp-share-warn">
        ${iconHTML('warning',14,'color:var(--danger);')} May contain confidential info — sure you want to share?
        <div class="field" style="margin:8px 0 0;"><label style="font-size:10.5px;">Access expires</label>
          <select id="spShareExpiry">
            ${SHARE_EXPIRY_OPTIONS.map((o,i)=>`<option value="${i}" ${i===2?'selected':''}>${o.label}</option>`).join('')}
          </select>
        </div>
        <div class="sp-share-warn-actions"><button class="btn" id="spShareCancel">Cancel</button><button class="btn danger" id="spShareGo">Generate Link</button></div>
      </div>`);
      warn.querySelector('#spShareCancel').onclick = ()=>{ shareConfirming=false; renderPanel(); };
      warn.querySelector('#spShareGo').onclick = ()=>{
        const opt = SHARE_EXPIRY_OPTIONS[Number(warn.querySelector('#spShareExpiry').value)];
        doc.shareLink = fakeShareLink(doc);
        doc.shareLinkExpiresAt = opt.ms ? Date.now()+opt.ms : null;
        logActivity(doc, `Generated a share link (${opt.label.toLowerCase()})`);
        shareConfirming = false;
        renderPanel();
      };
      actionsList.appendChild(warn);
    } else {
      const shareRow = el(`<div class="sp-action-row">${iconHTML('share',16)}<span>Share...</span></div>`);
      shareRow.onclick = ()=>{ shareConfirming=true; renderPanel(); };
      actionsList.appendChild(shareRow);
    }
    actionsSection.appendChild(actionsList);
    body.appendChild(actionsSection);

    const attSection = el('<div class="sp-section"></div>');
    attSection.appendChild(el(`<div class="sp-section-title">ATTACHMENTS · ${doc.attachments.length}</div>`));
    if(doc.attachments.length===0) attSection.appendChild(el('<div class="no-options-hint">Nothing uploaded yet.</div>'));
    doc.attachments.forEach((a,i)=> attSection.appendChild(attachmentRow(a, i, false)));

    // The action row is a state machine, not a fixed set of buttons: an
    // outstanding request replaces them with a single Cancel; a submission
    // waiting on review replaces them with Approve/Reject; only with nothing
    // in flight do the three starting actions show at all.
    const addRow = el('<div class="sp-add-att-row"></div>');
    if(doc.status === 'awaiting_upload' || doc.status === 'awaiting_signature'){
      const cancelBtn = el(`<button class="btn danger" style="width:100%;justify-content:center;">${iconHTML('cancel',15)}Cancel Request</button>`);
      cancelBtn.onclick = ()=>{ cancelRequest(doc); renderPanel(); render(); };
      addRow.appendChild(cancelBtn);
    } else if(doc.status === 'pending_approval'){
      const rejectBtn = el(`<button class="btn danger">${iconHTML('cancel',15)}Reject</button>`);
      rejectBtn.onclick = ()=> openModal('rejectSigned', { doc, onDone: ()=>{ renderPanel(); render(); } });
      const approveBtn = el(`<button class="btn primary">${iconHTML('check_circle',15)}Approve</button>`);
      approveBtn.onclick = ()=>{ approveDoc(doc); renderPanel(); };
      addRow.appendChild(rejectBtn); addRow.appendChild(approveBtn);
    } else {
      const uploadFileBtn = el(`<button class="btn">${iconHTML('upload_file',15)}Upload File</button>`);
      uploadFileBtn.onclick = ()=> triggerPcUpload(doc, renderPanel);
      const requestUploadBtn = el(`<button class="btn" style="color:var(--warning-t);border-color:var(--warning);">${iconHTML('send',15)}Request Upload</button>`);
      requestUploadBtn.onclick = ()=> openModal('deliveryChoiceUpload', doc);
      const requestSignBtn = el(`<button class="btn" style="color:var(--accentBlue);border-color:var(--accentBlue);">${iconHTML('draw',15)}Request Signature</button>`);
      requestSignBtn.onclick = ()=>{
        if(doc.requiresSign && doc.fileTemplateId){
          openModal('requestSignature', doc);
        } else {
          // No form linked yet — pick or create one first, then go straight
          // into the same Link/Mobile App request used everywhere else.
          openAddFormPicker(doc, ()=> openModal('requestSignature', doc));
        }
      };
      addRow.appendChild(uploadFileBtn); addRow.appendChild(requestUploadBtn); addRow.appendChild(requestSignBtn);
    }
    if(addRow.children.length) attSection.appendChild(addRow);
    body.appendChild(attSection);

    const customKeys = Object.keys(doc.customFields||{});
    if(customKeys.length){
      const cfSection = el('<div class="sp-section"></div>');
      cfSection.appendChild(el('<div class="sp-section-title">CUSTOM FIELDS</div>'));
      customKeys.forEach(k=>{
        const col = columnDefs.find(c=>c.key===k);
        if(col) cfSection.appendChild(detailRow(col.label, formatFieldDisplay(doc, col)));
      });
      body.appendChild(cfSection);
    }
  }

  function renderTasksTab(body){
    const list = el('<div class="sp-tasks-list"></div>');
    if(doc.tasks.length===0) list.appendChild(el('<div class="no-options-hint">No tasks yet.</div>'));
    doc.tasks.forEach(t=>{
      const card = el(`<div class="sp-task-card">
        <div class="sp-task-title">${t.title}</div>
        <div class="sp-task-meta"><span class="task-status-pill ${t.status.toLowerCase().replace(' ','_')}">${t.status}</span><span>${t.assignee} · Due ${t.dueDate}</span></div>
        <div class="sp-task-link">${iconHTML('open_in_new',13)}View Task</div>
      </div>`);
      card.querySelector('.sp-task-link').onclick = ()=> openNestedModal(modalTaskDetail(doc, t));
      list.appendChild(card);
    });
    body.appendChild(list);

    const createBtn = el(`<button class="btn" style="width:100%;margin-top:12px;">${iconHTML('add_task',15)}Create Task</button>`);
    createBtn.onclick = ()=> openNestedModal(modalCreateTask(doc, ()=>{ renderPanel(); render(); }));
    body.appendChild(createBtn);
  }
  function renderCommentsTab(body){
    const feed = el('<div class="sp-comment-feed"></div>');
    if(doc.comments.length===0) feed.appendChild(el('<div class="no-options-hint">No comments yet.</div>'));
    doc.comments.forEach(c=>{
      feed.appendChild(el(`<div class="sp-comment"><div class="sp-comment-head"><b>${c.author}</b><span>${c.date}</span></div><div class="sp-comment-text">${c.text}</div></div>`));
    });
    body.appendChild(feed);
    const inputRow = el('<div class="sp-comment-input-row"></div>');
    const input = el('<textarea placeholder="Write a comment..."></textarea>');
    const postBtn = el(`<button class="btn primary">${iconHTML('send',14)}Post</button>`);
    postBtn.onclick = ()=>{
      const v = input.value.trim();
      if(!v) return;
      doc.comments.push({ author:'Jon Doe', date:'Sep 6, 2026, '+new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}), text:v });
      logActivity(doc, 'Left a comment');
      renderPanel();
    };
    inputRow.appendChild(input); inputRow.appendChild(postBtn);
    body.appendChild(inputRow);
  }

  function renderActivityTab(body){
    const list = el('<div class="sp-activity-list"></div>');
    if(doc.activity.length===0) list.appendChild(el('<div class="no-options-hint">No activity yet.</div>'));
    [...doc.activity].reverse().forEach(a=>{
      list.appendChild(el(`<div class="sp-activity-row"><div class="sp-activity-text"><b>${a.actor}</b> ${a.text}</div><div class="sp-activity-date">${a.date}</div></div>`));
    });
    body.appendChild(list);
  }

  function renderArchiveTab(body){
    const list = el('<div class="sp-section"></div>');
    list.appendChild(el(`<div class="sp-section-title">ARCHIVED · ${doc.archivedAttachments.length}</div>`));
    if(doc.archivedAttachments.length===0) list.appendChild(el('<div class="no-options-hint">Nothing archived.</div>'));
    doc.archivedAttachments.forEach((a,i)=> list.appendChild(attachmentRow(a, i, true)));
    body.appendChild(list);
  }

  let nameDraft = doc.name;
  function renderPanel(){
    panel.innerHTML = '';
    const topRow = el('<div class="sp-top-row"></div>');
    topRow.appendChild(el(fileIcon(doc, 32)));
    const nameWrap = el('<div class="sp-header-text"></div>');
    const nameInput = el(`<input type="text" class="sp-title-input" value="${nameDraft.replace(/"/g,'&quot;')}"/>`);
    nameInput.oninput = (e)=>{ nameDraft = e.target.value; };
    nameWrap.appendChild(nameInput);
    nameWrap.appendChild(el(`<div class="sp-sub">${folderName(doc.folder)}</div>`));
    topRow.appendChild(nameWrap);
    const closeX = el(`<span class="modal-close sp-close-x">${iconHTML('close',16)}</span>`);
    closeX.onclick = closePanel;
    topRow.appendChild(closeX);

    const header = el('<div class="sp-header"></div>');
    header.appendChild(topRow);
    panel.appendChild(header);

    const tabs = el(`<div class="sp-tabs">
      <span class="sp-tab" data-t="details">Details</span>
      <span class="sp-tab" data-t="tasks">Tasks${doc.tasks.length?` (${doc.tasks.length})`:''}</span>
      <span class="sp-tab" data-t="comments">Comments${doc.comments.length?` (${doc.comments.length})`:''}</span>
      <span class="sp-tab" data-t="activity">Activity</span>
      <span class="sp-tab" data-t="archive">Archive${doc.archivedAttachments.length?` (${doc.archivedAttachments.length})`:''}</span>
    </div>`);
    tabs.querySelectorAll('.sp-tab').forEach(t=>{
      if(t.dataset.t===activeTab) t.classList.add('active');
      t.onclick = ()=>{ activeTab = t.dataset.t; renderPanel(); };
    });
    panel.appendChild(tabs);

    const body = el('<div class="sp-body"></div>');
    if(activeTab==='details') renderDetailsTab(body);
    else if(activeTab==='tasks') renderTasksTab(body);
    else if(activeTab==='comments') renderCommentsTab(body);
    else if(activeTab==='activity') renderActivityTab(body);
    else if(activeTab==='archive') renderArchiveTab(body);
    panel.appendChild(body);

    const footer = el('<div class="sp-footer"></div>');
    const busyState = ['awaiting_upload','awaiting_signature','pending_approval'].includes(doc.status);
    function commitNameIfChanged(){
      const val = nameDraft.trim();
      const changed = val && val !== doc.name;
      if(changed){
        logActivity(doc, `Renamed from "${doc.name}" to "${val}"`);
        doc.name = val;
        render();
      }
      return changed;
    }
    if(busyState){
      // With a decision already front and center in the action row above
      // (Cancel Request, or Approve/Reject), a second Save button down here
      // is one button too many — Close alone still commits a name edit if
      // one was made, so nothing typed gets silently lost.
      const closeOnlyBtn = el('<button class="btn" style="width:100%;justify-content:center;">Close</button>');
      closeOnlyBtn.onclick = ()=>{ commitNameIfChanged(); closePanel(); };
      footer.appendChild(closeOnlyBtn);
    } else {
      const closeBtn = el('<button class="btn">Close</button>');
      closeBtn.onclick = closePanel;
      const saveBtn = el(`<button class="btn primary">${iconHTML('check',15)}Save</button>`);
      saveBtn.onclick = ()=>{
        if(commitNameIfChanged()) showToast('Saved');
        closePanel();
      };
      footer.appendChild(closeBtn); footer.appendChild(saveBtn);
    }
    panel.appendChild(footer);
  }
  renderPanel();

  scrim.appendChild(panel);
  document.body.appendChild(scrim);
  requestAnimationFrame(()=> scrim.classList.add('open'));
}

// ---- Add Form: same select-existing-or-create-new mechanism used when
// building a Document Suggestion, reused here so a document can pick up a
// fillable form after the fact, not just at suggestion-creation time. ----
function openAddFormPicker(doc, onDone){
  const wrap = el('<div class="modal-wrap"></div>');
  const modal = el('<div class="modal"></div>');
  wrap.appendChild(modal);
  let closeThis;
  const closeBtn = el(`<button class="modal-close">${iconHTML('close',16)}</button>`);
  closeBtn.onclick = ()=> closeThis();
  wrap.appendChild(closeBtn);
  modal.appendChild(el(`<h2>Add Form</h2><p class="mdesc">Attach a fillable form to this document — treated just like any other attached file (view, edit, archive, delete).</p>
    <div class="field"><label>Form</label></div>`));
  const selectRow = el('<div style="display:flex;gap:8px;align-items:center;"></div>');
  const select = el('<select style="flex:1;"></select>');
  function refresh(){
    select.innerHTML = '';
    // Built-in forms are reference samples only — a real request can only go
    // out with a form the company actually created and owns the content of.
    const custom = FILE_TEMPLATES.filter(ft=>!ft.isBuiltIn);
    if(custom.length===0) select.appendChild(el('<option value="">No custom forms yet — create one</option>'));
    else custom.forEach(ft=> select.appendChild(el(`<option value="${ft.id}">${ft.name}</option>`)));
    select.appendChild(el('<option value="__new__">+ Create new form...</option>'));
  }
  refresh();
  selectRow.appendChild(select);
  const viewBtn = el(`<button type="button" class="btn" style="flex-shrink:0;">${iconHTML('visibility',15)}View</button>`);
  viewBtn.onclick = ()=>{
    const ft = FILE_TEMPLATES.find(t=>t.id===select.value) || null;
    let closeNested;
    const node = modalFileTemplateEditor(ft, { onSave:(f)=>{ closeNested(); refresh(); select.value=f.id; }, onCancel:()=>closeNested() });
    closeNested = openNestedModal(node);
  };
  selectRow.appendChild(viewBtn);
  select.onchange = ()=>{
    if(select.value==='__new__'){
      let closeNested;
      const node = modalFileTemplateEditor(null, { onSave:(f)=>{ closeNested(); refresh(); select.value=f.id; }, onCancel:()=>{ closeNested(); refresh(); } });
      closeNested = openNestedModal(node);
    }
  };
  modal.appendChild(selectRow);
  const actions = el('<div class="actions"></div>');
  const cancelBtn = el('<button class="btn">Cancel</button>');
  cancelBtn.onclick = ()=> closeThis();
  const addBtn = el('<button class="btn primary">Add Form</button>');
  addBtn.onclick = ()=>{
    if(!select.value || select.value==='__new__'){ showToast('Pick or create a form first'); return; }
    const ft = FILE_TEMPLATES.find(t=>t.id===select.value);
    // Adding a form CONFIGURES the requirement — it doesn't fake an already-
    // filled attachment. "Request Signature" only becomes available once
    // requiresSign/fileTemplateId are actually set on the document.
    doc.requiresSign = true;
    doc.fileTemplateId = ft.id;
    logActivity(doc, `Set "${ft.name}" as the required form — ready to request a signature`);
    showToast(`"${ft.name}" set as the required form for "${doc.name}"`);
    closeThis();
    if(onDone) onDone();
  };
  actions.appendChild(cancelBtn); actions.appendChild(addBtn);
  modal.appendChild(actions);
  closeThis = openNestedModal(wrap);
}

function closeModal(){ state.modal=null; render(); }

function renderModal(){
  if(!state.modal) return;
  const {type, payload} = state.modal;
  let node;
  if(type==='upload') node = modalUpload();
  else if(type==='uploadChoice') node = modalUploadChoice();
  else if(type==='customizeRail') node = modalCustomizeRail();
  else if(type==='customizeTabs') node = modalCustomizeTabs();
  else if(type==='bulkDeliveryChoice') node = modalBulkDeliveryChoice(payload);
  else if(type==='bulkReject') node = modalBulkReject(payload);
  else if(type==='bulkCreateTask') node = modalBulkCreateTask(payload);
  else if(type==='createEmptyDoc') node = modalCreateEmptyDoc(payload);
  else if(type==='createFolder') node = modalCreateFolder();
  else if(type==='columns') node = modalColumns();
  else if(type==='filters') node = modalFilters();
  else if(type==='rename') node = modalRename(payload);
  else if(type==='move') node = modalMove([payload]);
  else if(type==='moveBulk') node = modalMove(files.filter(f=>state.selected.has(f.id)));
  else if(type==='delete') node = modalDelete([payload]);
  else if(type==='deleteBulk') node = modalDelete(files.filter(f=>state.selected.has(f.id)));
  else if(type==='renameFolder') node = modalRenameFolder(payload);
  else if(type==='deleteFolder') node = modalDeleteFolder(payload);
  else if(type==='export') node = modalExport();
  else if(type==='addColumn') node = modalAddColumn();
  else if(type==='editColumn') node = modalEditColumn(payload);
  else if(type==='deleteColumn') node = modalDeleteColumn(payload);
  else if(type==='templates') node = modalTemplates();
  else if(type==='createTemplate') node = modalCreateTemplate();
  else if(type==='editTemplate') node = modalCreateTemplate(payload);
  else if(type==='deleteTemplate') node = modalDeleteTemplate(payload);
  else if(type==='requestSignature') node = modalDeliveryChoice(payload, 'sign');
  else if(type==='deliveryChoiceUpload') node = modalDeliveryChoice(payload, 'upload');
  else if(type==='fileTemplateEditor') node = modalFileTemplateEditor(payload.ft, payload.opts);
  else if(type==='linkReady') node = modalLinkReady(payload);
  else if(type==='shareConfirm') node = modalShareConfirm(payload);
  else if(type==='shareLinkReady') node = modalShareLinkReady(payload);
  else if(type==='rejectSigned') node = (payload && payload.doc) ? modalRejectSigned(payload.doc, payload.onDone) : modalRejectSigned(payload);
  if(!node) return;
  const scrim = el('<div class="modal-scrim"></div>');
  scrim.onclick = (e)=>{ if(e.target===scrim) closeModal(); };
  scrim.appendChild(node);
  app.appendChild(scrim);
}

  modal.appendChild(optRow);
  modal.appendChild(filesInput); modal.appendChild(folderInput);

  const soloFileCount = state.uploadQueue.filter(q=>!q.isFolder).length;
  const totalCount = state.uploadQueue.reduce((n,q)=> n + (q.isFolder ? q.count : 1), 0);

  // Only meaningful when 2+ individually-picked files are queued — e.g. the
  // front and back of the same CDL, which should land in the list as ONE
  // document with two attachments rather than two separate rows.
  let combineRow = null;
  if(soloFileCount >= 2){
    combineRow = el(`<label style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text900);cursor:pointer;margin-bottom:14px;">
      <input type="checkbox" id="combineCb" ${state.combineUpload?'checked':''}/>

    </label>`);
    combineRow.querySelector('input').onchange = (e)=>{ state.combineUpload = e.target.checked; };
    modal.appendChild(combineRow);
  } else {
    state.combineUpload = false;
  }

  modal.appendChild(el(`<div class="queue-label">READY TO UPLOAD · ${totalCount} FILE${totalCount!==1?'S':''}</div>`));
  const qlist = el('<div class="queue-list"></div>');
  if(state.uploadQueue.length===0){
    qlist.appendChild(el('<div class="empty-queue">No files selected yet.</div>'));
  }
  state.uploadQueue.forEach((q, idx)=>{
    const row = el(`<div class="queue-row">
      <div class="qicon" style="background:${q.isFolder?'var(--accent)':'var(--info)'};">${iconHTML(q.isFolder?'folder':'description',14)}</div>
      <div class="qtext"><div class="qname">${q.name}</div><div class="qmeta">${q.size}</div></div>
      <span class="qremove">${iconHTML('close',16)}</span>
    </div>`);
    row.querySelector('.qremove').onclick = ()=>{ state.uploadQueue.splice(idx,1); render(); };
    qlist.appendChild(row);
  });
  modal.appendChild(qlist);

  const actions = el('<div class="actions"></div>');
  const cancelBtn = el('<button class="btn">Cancel</button>');
  cancelBtn.onclick = ()=>{ state.uploadQueue=[]; closeModal(); };
  const uploadBtn = el(`<button class="btn primary" ${totalCount===0?'disabled':''}>Upload ${totalCount} file${totalCount!==1?'s':''}</button>`);
  uploadBtn.onclick = ()=>{
    if(totalCount===0) return;
    const dest = destSelect.value || null;
    const soloFiles = state.uploadQueue.filter(q=>!q.isFolder);
    const folderQueueItems = state.uploadQueue.filter(q=>q.isFolder);

    function typeOf(name){ return detectFileType(name); }

    if(state.combineUpload && soloFiles.length>=2){
      const baseName = soloFiles[0].name.replace(/\.[^.]+$/, '');
      files.unshift(genDoc(baseName, soloFiles.map(q=>att(typeOf(q.name), q.size, null, false, null, q.name)), 'Jon Doe', 'Sep 6, 2026', dest));
    } else {
      soloFiles.forEach(q=>{
        const name = q.name.replace(/\.[^.]+$/, '');
        files.unshift(genDoc(name, [att(typeOf(q.name), q.size, null, false, null, q.name)], 'Jon Doe', 'Sep 6, 2026', dest));
      });
    }
    folderQueueItems.forEach(q=>{
      // A picked folder becomes one document per file inside it, all filed
      // into the chosen destination — the folder itself isn't nested (single
      // level only), it's just a fast way to pick many files at once.
      for(let i=0;i<q.count;i++){
        files.unshift(genDoc(`${q.name} — file ${i+1}`, [att('PDF','—')], 'Jon Doe', 'Sep 6, 2026', dest));
      }
    });

    showToast(`${totalCount} file${totalCount!==1?'s':''} uploaded to ${dest?folderName(dest):'Unfiled'}`);
    state.uploadQueue = [];
    state.combineUpload = false;
    closeModal();
  };
  actions.appendChild(cancelBtn); actions.appendChild(uploadBtn);
  modal.appendChild(actions);
  return wrap;
}
function formatBytes(b){
  if(b < 1024) return b+' B';
  if(b < 1024*1024) return (b/1024).toFixed(0)+' KB';
  return (b/(1024*1024)).toFixed(1)+' MB';
}

// ---- Document Templates: apply a named folder+slot layout to pre-create
// empty placeholders (attachments: []) for whatever's required but not yet
// collected. Built-in "FMCSA Standard" ships by default; the user can define
// their own the same way and reuse them going forward. ----
// Per-template doc exclusions — which slots the user unchecked in the preview
// before applying. Persists across modal re-renders (module-level, same
// pattern as expandedTemplateIds), reset isn't necessary: unchecking is a
// deliberate, sticky choice for that template until the user re-checks it.
let templateDocExclusions = new Map(); // tpl.id -> Set of "folderName::docName"
function tplDocKey(folderName, docName){ return folderName+'::'+docName; }
function isTplDocExcluded(tpl, folderName, docName){
  return templateDocExclusions.get(tpl.id)?.has(tplDocKey(folderName, docName)) || false;
}

// True once every document this suggestion would create already exists —
// used to grey out "Apply Now" rather than let the person press it again for
// no effect (with no clear sign anything happened, since 0-created still
// shows a toast that's easy to miss).
function templateFullyApplied(tpl){
  return tpl.folders.every(tf=>{
    if(tf.isUnfiled){
      return tf.docs.every(d=> isTplDocExcluded(tpl, tf.name, d.name) || files.some(x=>!x.folder && x.name.toLowerCase()===d.name.toLowerCase()));
    }
    const folder = FOLDERS.find(f=>f.name.toLowerCase()===tf.name.toLowerCase());
    if(tf.docs.length===0) return !!folder;
    if(!folder) return tf.docs.every(d=> isTplDocExcluded(tpl, tf.name, d.name));
    return tf.docs.every(d=> isTplDocExcluded(tpl, tf.name, d.name) || files.some(x=>x.folder===folder.id && x.name.toLowerCase()===d.name.toLowerCase()));
  });
}
function applyTemplate(tpl){
  let foldersCreated = 0, slotsCreated = 0, skipped = 0;
  tpl.folders.forEach(tf=>{
    if(tf.isUnfiled){
      tf.docs.forEach(d=>{
        if(isTplDocExcluded(tpl, tf.name, d.name)){ skipped++; return; }
        const exists = files.some(x=> !x.folder && x.name.toLowerCase()===d.name.toLowerCase());
        if(!exists){
          files.unshift(genDoc(d.name, [], null, null, null, null, d.requiresSign, d.fileTemplateId));
          slotsCreated++;
        }
      });
      return;
    }
    let folder = FOLDERS.find(f=> f.name.toLowerCase() === tf.name.toLowerCase());
    if(tf.docs.length===0 && !folder){
      // A folder-only block: nothing to skip/create per-document, just make
      // sure the folder itself exists even with no document slots in it yet.
      FOLDERS.push({ id: 'f'+Date.now()+Math.random().toString(36).slice(2,6), name: tf.name, color: tf.color });
      foldersCreated++;
      return;
    }
    tf.docs.forEach(d=>{
      if(isTplDocExcluded(tpl, tf.name, d.name)){ skipped++; return; }
      if(!folder){
        folder = { id: 'f'+Date.now()+Math.random().toString(36).slice(2,6), name: tf.name, color: tf.color };
        FOLDERS.push(folder);
        foldersCreated++;
      }
      const exists = files.some(x=> x.folder===folder.id && x.name.toLowerCase()===d.name.toLowerCase());
      if(!exists){
        // unshift, not push: new slots must land at the top of the (default
        // unsorted, paginated) list — otherwise they're created but buried on
        // a later page, invisible right after the toast says they were added.
        files.unshift(genDoc(d.name, [], null, null, folder.id, null, d.requiresSign, d.fileTemplateId));
        slotsCreated++;
      }
    });
  });
  showToast(`Applied "${tpl.name}" — ${foldersCreated} folder${foldersCreated!==1?'s':''} created, ${slotsCreated} document slot${slotsCreated!==1?'s':''} added${skipped?`, ${skipped} skipped`:''}`);
  if(slotsCreated > 0){
    state.page = 1;
    state.sortKey = null; // natural order, so the just-unshifted slots are what's on top
    state.search = '';
  }
  // Stay on the Suggested Documents modal — applying one suggestion
  // shouldn't force-close the list when there might be others to apply too.
  // Re-render it in place so the "Already Applied" state updates immediately.
  openModal('templates');
}

        </div>`);

          const alreadyHasDoc = tf.isUnfiled
            ? files.some(x=>!x.folder && x.name.toLowerCase()===d.name.toLowerCase())
            : files.some(x=>x.folder && FOLDERS.find(f=>f.id===x.folder)?.name.toLowerCase()===tf.name.toLowerCase() && x.name.toLowerCase()===d.name.toLowerCase());

              openModal('templates');
            };

          docList.appendChild(row2);

    applyBtn.onclick = ()=> applyTemplate(tpl);
    actionsRow.appendChild(autoLabel); actionsRow.appendChild(applyBtn);
    row.appendChild(actionsRow);
    list.appendChild(row);
  });
  modal.appendChild(list);

  const actions = el('<div class="actions"></div>');
  const createBtn = el('<button class="btn">+ Create your own suggestion</button>');
  createBtn.onclick = ()=> openModal('createTemplate');
  const doneBtn = el('<button class="btn primary">Done</button>');
  doneBtn.onclick = closeModal;

// Share links can be time-boxed — short-lived for a one-off urgent look,
// or left permanent when that's genuinely the intent. "7 Days" is the
// default: long enough that the office doesn't have to babysit it, short
// enough that a link handed to the wrong person doesn't stay valid forever.
const SHARE_EXPIRY_OPTIONS = [
  {label:'1 Hour', ms:3600000},
  {label:'24 Hours', ms:86400000},
  {label:'7 Days', ms:604800000},
  {label:'30 Days', ms:2592000000},
  {label:'Always', ms:null},
];
function formatRelativeExpiry(ts){
  const diffMs = ts - Date.now();
  if(diffMs <= 0) return 'shortly';
  const hours = Math.round(diffMs/3600000);
  if(hours < 1) return 'in under an hour';
  if(hours < 24) return `in ${hours} hour${hours!==1?'s':''}`;
  const days = Math.round(hours/24);
  return `in ${days} day${days!==1?'s':''}`;
}

// Direct PC upload — no modal, no driver involved. This is what "Upload"
// always means now; asking the driver to do it themselves is a separate,
// explicit action (see modalDeliveryChoice below).
function triggerPcUpload(doc, onDone){
  const input = document.createElement('input');
  input.type = 'file'; input.multiple = true; input.style.display = 'none';
  document.body.appendChild(input);
  input.onchange = (ev)=>{
    const picked = Array.from(ev.target.files);
    picked.forEach(pf=>{
      const type = detectFileType(pf.name);
      doc.attachments.push(att(type, formatBytes(pf.size), URL.createObjectURL(pf), false, null, pf.name));
    });
    doc.uploader = 'Jon Doe'; doc.uploadDate = 'Sep 6, 2026'; doc.status = computeStatus(doc);
    logActivity(doc, `Uploaded ${picked.length} file${picked.length!==1?'s':''} from computer`);
    showToast(`Uploaded ${picked.length} file${picked.length!==1?'s':''} to "${doc.name}"`);
    input.remove();
    render();
    if(onDone) onDone();
  };
  input.click();
}

// mechanics, applied across every selected document at once instead of one
// modal per document. ----
function modalBulkDeliveryChoice(payload){
  const { docs, mode } = payload;
  const isSign = mode === 'sign';
  const m = modalShell(`<h2>${iconHTML(isSign?'draw':'send',20,'color:var(--info);vertical-align:middle;margin-right:6px;')}${isSign?'Request Signature':'Request Upload from Driver'} (${docs.length})</h2>

  const modal = m.querySelector('.modal');
  const optionsWrap = el('<div class="delivery-options"></div>');
  function sendBulk(channel){
    const link = channel==='link' ? fakeUploadLink({id:'bulk'+Date.now()}) : null;
    docs.forEach(doc=>{
      if(isSign){ doc.signStatus='sent'; doc.status='awaiting_signature'; }
      else { doc.status='awaiting_upload'; }
      doc.deliveryChannel = channel;
      if(link) doc.deliveryLink = link;
      logActivity(doc, `Included in a bulk request sent via ${channel==='mobile_app'?"driver's mobile app":'link'}`);
    });
    showToast(`Requested ${docs.length} document${docs.length!==1?'s':''} from Maksim Gerasimov${channel==='link'?` — link emailed to ${DRIVER_EMAIL}`:''}`);
    closeModal();
  }
  const linkOpt = el(`<button class="delivery-option">
    <div class="do-icon">${iconHTML('link',20)}</div>

  </button>`);
  linkOpt.onclick = ()=> sendBulk('link');
  optionsWrap.appendChild(linkOpt);
  const appOpt = el(`<button class="delivery-option ${DRIVER_HAS_MOBILE_APP?'':'disabled'}">
    <div class="do-icon">${iconHTML('smartphone',20)}</div>
    <div class="do-text"><div class="do-title">Send to driver's mobile app</div><div class="do-sub">${DRIVER_HAS_MOBILE_APP ? 'One push notification covering everything' : "Driver hasn't installed the app yet"}</div></div>
  </button>`);
  if(DRIVER_HAS_MOBILE_APP) appOpt.onclick = ()=> sendBulk('mobile_app');

  const cancelBtn = el('<button class="btn" style="width:100%;margin-top:14px;">Cancel</button>');
  cancelBtn.onclick = closeModal;
  modal.appendChild(cancelBtn);
  return m;
}

function modalFileTemplateEditor(existingFt, opts){
  opts = opts || {};
  const isNew = !existingFt;
  const readOnly = (!isNew && existingFt.isBuiltIn) || !!opts.forceReadOnly; // built-in templates are never editable, anywhere — only the user's own can be changed; a caller can also force read-only (e.g. a form that's currently out for signature)
  const draft = {
    id: isNew ? null : existingFt.id,
    name: isNew ? '' : existingFt.name,
    baseFileName: isNew ? null : existingFt.baseFileName,
    fields: isNew ? [] : existingFt.fields.map(f=>({...f})),
  };

  const wrap = el('<div class="modal-wrap"></div>');
  const modal = el('<div class="modal filetpl-editor-modal"></div>');
  wrap.appendChild(modal);
  const closeBtn = el(`<button class="modal-close">${iconHTML('close',16)}</button>`);
  closeBtn.onclick = ()=>{ if(opts.onCancel) opts.onCancel(); else closeModal(); };
  wrap.appendChild(closeBtn);

  modal.appendChild(el(`<h2>${isNew?'Create File Template':(readOnly?'View File Template':'Edit File Template')}</h2>`));
  modal.appendChild(el(`<p class="mdesc">${readOnly ? "This is a built-in template, so it's view-only here — what the driver will see when this is sent." : 'Place the fields the driver needs to fill in and sign. Drag to reposition, click × to remove.'}</p>`));
  const nameField = el('<div class="field"><label>Template name</label><input type="text" id="ftplEditorName" placeholder="e.g. W-9 Form"/></div>');
  nameField.querySelector('input').value = draft.name;
  if(readOnly) nameField.querySelector('input').disabled = true;
  modal.appendChild(nameField);

  const editorArea = el('<div class="ftpl-editor-area"></div>');
  if(!readOnly){
    const sidebar = el('<div class="ftpl-editor-sidebar"></div>');
    sidebar.appendChild(el('<div class="swatch-section-label">ADD FIELD</div>'));
    Object.entries(FIELD_TYPE_META).forEach(([type, meta])=>{
      const btn = el(`<button type="button" class="ftpl-add-field-btn">${iconHTML(meta.icon,16,`color:${meta.color};`)}${meta.label}</button>`);
      btn.onclick = ()=>{
        const nextY = 24 + draft.fields.length * 56;
        draft.fields.push({ id:'fld'+Math.random().toString(36).slice(2,8), type, label: meta.label, x: 24, y: Math.min(nextY, 430), w: type==='checkbox'?28:300, h: type==='checkbox'?28:40 });
        renderPage();
      };
      sidebar.appendChild(btn);
    });
    sidebar.appendChild(el('<div class="swatch-section-label" style="margin-top:14px;">SIGNER</div>'));
    sidebar.appendChild(el('<div class="ftpl-signer-pill">👤 Driver</div>'));
    editorArea.appendChild(sidebar);
  }

  const page = el('<div class="ftpl-page"></div>');
  // faint decorative lines to sell "this is a document page"
  for(let i=0;i<3;i++) page.appendChild(el(`<div class="ftpl-page-line" style="top:${470+i*14}px;width:${i===2?'40%':'85%'};"></div>`));
  page.appendChild(el(`<div class="ftpl-page-title">${draft.baseFileName || 'Untitled document'}</div>`));

  function renderPage(){
    page.querySelectorAll('.ftpl-field').forEach(n=>n.remove());
    draft.fields.forEach(f=>{
      const meta = FIELD_TYPE_META[f.type];
      const fieldEl = el(`<div class="ftpl-field${readOnly?' readonly':''}" style="left:${f.x}px;top:${f.y}px;width:${f.w}px;height:${f.h}px;border-color:${meta.color};">
        <span class="ftpl-field-label" style="color:${meta.color};">${iconHTML(meta.icon,13)}${f.label}</span>
        ${readOnly?'':`<span class="ftpl-field-remove">${iconHTML('close',13)}</span>`}
      </div>`);
      if(!readOnly){
        fieldEl.querySelector('.ftpl-field-remove').onclick = (e)=>{
          e.stopPropagation();
          draft.fields = draft.fields.filter(x=>x.id!==f.id);
          renderPage();
        };
        // Basic native drag: mousedown starts tracking, mousemove repositions
        // within the page bounds, mouseup commits the field's new x/y.
        fieldEl.addEventListener('mousedown', (e)=>{
          e.preventDefault();
          const pageRect = page.getBoundingClientRect();
          const startX = e.clientX, startY = e.clientY;
          const origX = f.x, origY = f.y;
          function onMove(ev){
            const dx = ev.clientX - startX, dy = ev.clientY - startY;
            f.x = Math.max(0, Math.min(pageRect.width - f.w, origX + dx));
            f.y = Math.max(0, Math.min(pageRect.height - f.h, origY + dy));
            fieldEl.style.left = f.x+'px'; fieldEl.style.top = f.y+'px';
          }
          function onUp(){ document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); }
          document.addEventListener('mousemove', onMove);
          document.addEventListener('mouseup', onUp);
        });
      }
      page.appendChild(fieldEl);
    });
  }
  renderPage();

  editorArea.appendChild(page);
  modal.appendChild(editorArea);

  const actions = el('<div class="actions"></div>');
  if(readOnly){
    const closeBtn2 = el('<button class="btn primary" style="width:100%;">Close</button>');
    closeBtn2.onclick = ()=>{ if(opts.onCancel) opts.onCancel(); else closeModal(); };
    actions.appendChild(closeBtn2);
  } else {
    const cancelBtn = el('<button class="btn">Cancel</button>');
    cancelBtn.onclick = ()=>{ if(opts.onCancel) opts.onCancel(); else closeModal(); };
    const saveBtn = el(`<button class="btn primary">${isNew?'Create Template':'Save Changes'}</button>`);
    saveBtn.onclick = ()=>{
      const name = modal.querySelector('#ftplEditorName').value.trim();
      if(!name){ showToast('Template name is required'); return; }
      if(draft.fields.length===0){ showToast('Add at least one field'); return; }
      let saved;
      if(isNew){
        saved = { id: 'ftpl'+Date.now(), name, baseFileName: null, isBuiltIn: false, fields: draft.fields };
        FILE_TEMPLATES.push(saved);
        showToast(`File template "${name}" created`);
      } else {
        existingFt.name = name;
        existingFt.fields = draft.fields;
        saved = existingFt;
        showToast(`File template "${name}" updated`);
      }
      if(opts.onSave) opts.onSave(saved); else closeModal();
    };
    actions.appendChild(cancelBtn); actions.appendChild(saveBtn);
  }
  modal.appendChild(actions);
  return wrap;
}

function modalCreateTemplate(existingTpl){
  const isEdit = !!existingTpl;
  const startedUnfiled = isEdit && existingTpl.folders[0].isUnfiled;
  const m = modalShell(`<h2>${isEdit ? 'Edit Suggestion' : 'Create Your Own Suggestion'}</h2><p class="mdesc">One suggestion, one folder — name it first, then add the document slots it should contain. ${isEdit ? "Changes here don't affect documents already created from a previous apply — only future applies." : 'Apply it to this driver now, or just save it for later.'}</p>
    <div class="field"><label>Folder name</label><input type="text" id="tplFolderName" placeholder="Existing or new folder name — e.g. DQ File" value="${isEdit && !startedUnfiled ? existingTpl.folders[0].name : ''}" ${startedUnfiled?'disabled':''}/></div>
    <label class="tpl-sign-toggle" style="margin-top:4px;"><input type="checkbox" id="tplUnfiledCheck" ${startedUnfiled?'checked':''}/> No folder — file goes to Unfiled</label>`);
  const modal = m.querySelector('.modal');
  const folderNameInput = modal.querySelector('#tplFolderName');
  const unfiledCheck = modal.querySelector('#tplUnfiledCheck');
  function folderIsNamed(){ return unfiledCheck.checked || folderNameInput.value.trim().length>0; }
  unfiledCheck.onchange = (e)=>{
    folderNameInput.disabled = e.target.checked;
    if(e.target.checked) folderNameInput.value = '';
    updateAddBtnState();
  };

  let docs = isEdit ? existingTpl.folders[0].docs.map(d=>({...d})) : [];
  const chipRow = el('<div class="option-chip-row" style="margin-top:4px;"></div>');
  function renderDocChips(){
    chipRow.innerHTML = '';
    if(docs.length===0) chipRow.appendChild(el('<span class="no-options-hint">No document slots yet — the folder alone can still be saved.</span>'));
    docs.forEach((d,di)=>{
      const chip = el(`<span class="option-chip">${d.requiresSign?iconHTML('draw',12,'color:var(--info);margin-right:2px;'):''}${d.name}<span class="chip-remove">${iconHTML('close',13)}</span></span>`);
      chip.querySelector('.chip-remove').onclick = ()=>{ docs.splice(di,1); renderDocChips(); updateAddBtnState(); };
      chipRow.appendChild(chip);
    });
  }
  renderDocChips();
  modal.appendChild(chipRow);

  // One small "builder" for the document currently being configured —
  // everything about it (name → optional signature requirement → which
  // form) lives together, top to bottom, with "Add" as the very last step.
  const docBuilder = el('<div class="tpl-doc-builder"></div>');
  const docInput = el('<input type="text" placeholder="Document name"/>');
  docBuilder.appendChild(docInput);

  const signRow = el(`<label class="tpl-sign-toggle"><input type="checkbox"/> This document requires the driver to Fill &amp; Sign</label>`);
  docBuilder.appendChild(signRow);
  const signSelectWrap = el('<div class="field" style="display:none;margin-top:6px;"><label>Form</label></div>');
  const selectRow = el('<div style="display:flex;gap:8px;align-items:center;"></div>');
  const signSelect = el('<select style="flex:1;"></select>');
  function refreshFileTemplateOptions(){
    signSelect.innerHTML = '';
    const custom = FILE_TEMPLATES.filter(ft=>!ft.isBuiltIn);
    if(custom.length===0){
      signSelect.appendChild(el('<option value="">No custom forms yet — create one</option>'));
    } else {
      custom.forEach(ft=> signSelect.appendChild(el(`<option value="${ft.id}">${ft.name}</option>`)));
    }
    signSelect.appendChild(el('<option value="__new__">+ Create new form...</option>'));
  }
  refreshFileTemplateOptions();
  selectRow.appendChild(signSelect);
  const viewEditBtn = el(`<button type="button" class="btn" style="flex-shrink:0;">${iconHTML('visibility',15)}View</button>`);
  viewEditBtn.onclick = ()=>{
    const currentFt = FILE_TEMPLATES.find(t=>t.id===signSelect.value) || null;
    let closeNested;
    const editorNode = modalFileTemplateEditor(currentFt, {
      onSave: (savedFt)=>{ closeNested(); refreshFileTemplateOptions(); signSelect.value = savedFt.id; },
      onCancel: ()=> closeNested(),
    });
    closeNested = openNestedModal(editorNode);
  };
  selectRow.appendChild(viewEditBtn);
  signSelect.onchange = ()=>{
    if(signSelect.value === '__new__'){
      let closeNested;
      const editorNode = modalFileTemplateEditor(null, {
        onSave: (savedFt)=>{ closeNested(); refreshFileTemplateOptions(); signSelect.value = savedFt.id; },
        onCancel: ()=>{ closeNested(); refreshFileTemplateOptions(); },
      });
      closeNested = openNestedModal(editorNode);
    }
  };
  signSelectWrap.appendChild(selectRow);
  docBuilder.appendChild(signSelectWrap);
  signRow.querySelector('input').onchange = (e)=>{ signSelectWrap.style.display = e.target.checked ? 'block' : 'none'; };

  function addDoc(){
    if(!folderIsNamed()){ showToast('Name the folder (or check Unfiled) first'); return; }
    if(unfiledCheck.checked && docs.length>=1){ showToast('Unfiled documents are one at a time — remove the current one first'); return; }
    const v = docInput.value.trim();
    if(!v){ showToast('Enter a document name'); return; }
    if(docs.some(d=>d.name===v)){ docInput.value=''; return; }
    const requiresSign = signRow.querySelector('input').checked;
    const fileTemplateId = requiresSign ? (signSelect.value || null) : null;
    if(requiresSign && (!fileTemplateId || fileTemplateId==='__new__')){ showToast('Pick or create a form for this document first'); return; }
    docs.push({ name: v, requiresSign, fileTemplateId });
    docInput.value = '';
    signRow.querySelector('input').checked = false;
    signSelectWrap.style.display = 'none';
    renderDocChips();
    updateAddBtnState();
    docInput.focus();
  }
  docInput.onkeydown = (e)=>{ if(e.key==='Enter' && signSelectWrap.style.display==='none'){ e.preventDefault(); addDoc(); } };
  const addBtn = el(`<button type="button" class="btn tpl-add-doc-btn">${iconHTML('add',15)}Add this document</button>`);
  addBtn.onclick = addDoc;
  docBuilder.appendChild(addBtn);
  modal.appendChild(docBuilder);

  // The whole "add a document" builder only lights up once the folder is
  // actually named (or explicitly marked Unfiled) — adding documents to a
  // folder that doesn't exist yet isn't a real state. Unfiled is capped at
  // exactly one document: with no folder to group them, there's no "one
  // suggestion, several loose files" case worth supporting.
  function updateAddBtnState(){
    const named = folderIsNamed();
    const atUnfiledLimit = unfiledCheck.checked && docs.length>=1;
    const enabled = named && !atUnfiledLimit;
    addBtn.classList.toggle('primary', enabled);
    addBtn.disabled = !enabled;
    docInput.disabled = !enabled;
    signRow.querySelector('input').disabled = !enabled;
  }
  folderNameInput.oninput = updateAddBtnState;
  updateAddBtnState();

  const actions = el('<div class="actions"></div>');
  const cancelBtn = el('<button class="btn">Cancel</button>');
  cancelBtn.onclick = ()=> openModal('templates');
  const saveBtn = el(`<button class="btn primary">${isEdit?'Save Changes':'Save Suggestion'}</button>`);
  saveBtn.onclick = ()=>{
    if(!folderIsNamed()){ showToast('Name the folder (or check Unfiled) first'); return; }
    const trimmed = folderNameInput.value.trim();
    // A named folder can be saved on its own (just reserves the folder) —
    // but an Unfiled suggestion with zero documents would do nothing at all
    // when applied, so that combination isn't allowed.
    if(unfiledCheck.checked && docs.length===0){ showToast('Add at least one document slot'); return; }
    const newFolder = unfiledCheck.checked
      ? { name: 'Unfiled', isUnfiled: true, color: 'var(--text400)', docs: docs.map(d=>({...d})) }
      : { name: trimmed, color: 'var(--info)', docs: docs.map(d=>({...d})) };
    if(isEdit){
      existingTpl.name = newFolder.name;
      existingTpl.folders = [newFolder];
      showToast(`Suggestion "${newFolder.name}" updated`);
    } else {
      TEMPLATES.push({ id: 'tpl'+Date.now(), name: newFolder.name, isBuiltIn:false, folders: [newFolder] });
      showToast(`Suggestion "${newFolder.name}" saved`);
    }
    openModal('templates');
  };
  actions.appendChild(cancelBtn); actions.appendChild(saveBtn);
  modal.appendChild(actions);
  return m;
}

function modalDeleteFolder(folder){
  const count = files.filter(f=>f.folder===folder.id).length;
  const m = modalShell(`<h2>${iconHTML('warning',20,'color:var(--danger);vertical-align:middle;margin-right:6px;')}Delete "${folder.name}"?</h2>
    <p class="mdesc">${count>0 ? `This folder contains ${count} file${count!==1?'s':''}. Choose what happens to them.` : 'This folder is empty. This action is irreversible.'}</p>`);
  const modal = m.querySelector('.modal');

  if(count>0){
    const choiceWrap = el('<div class="delete-folder-choice"></div>');
    const keepOpt = el(`<label class="radio-row">
      <input type="radio" name="folderDeleteMode" value="keep" checked/>
      <span class="radio-text"><span class="rtitle">Keep the files</span><span class="rsub">Move all ${count} file${count!==1?'s':''} to Unfiled</span></span>
    </label>`);
    const deleteOpt = el(`<label class="radio-row">
      <input type="radio" name="folderDeleteMode" value="delete"/>
      <span class="radio-text"><span class="rtitle" style="color:var(--danger);">Delete the files too</span><span class="rsub">Permanently deletes ${count} file${count!==1?'s':''} — cannot be undone</span></span>
    </label>`);
    choiceWrap.appendChild(keepOpt); choiceWrap.appendChild(deleteOpt);
    modal.appendChild(choiceWrap);
  }

  const actions = el('<div class="actions"></div>');
  const cancelBtn = el('<button class="btn">Cancel</button>');
  cancelBtn.onclick = closeModal;
  const delBtn = el(`<button class="btn danger">Delete Folder</button>`);
  delBtn.onclick = ()=>{
    const mode = count>0 ? modal.querySelector('input[name="folderDeleteMode"]:checked').value : 'keep';
    if(mode === 'delete'){
      files = files.filter(f=>f.folder!==folder.id);
    } else {
      files.forEach(f=>{ if(f.folder===folder.id) f.folder = null; });
    }
    const idx = FOLDERS.findIndex(x=>x.id===folder.id);
    if(idx>-1) FOLDERS.splice(idx,1);
    if(state.activeFolder===folder.id) state.activeFolder = null;
    showToast(mode==='delete'
      ? `Folder "${folder.name}" and ${count} file${count!==1?'s':''} deleted`
      : `Folder "${folder.name}" deleted${count>0?` — ${count} files moved to Unfiled`:''}`);
    closeModal();
  };
  // Update the confirm button's label live as the choice changes, so the
  // destructive path is never one click away from looking like the safe one.
  if(count>0){
    modal.querySelectorAll('input[name="folderDeleteMode"]').forEach(r=>{
      r.onchange = ()=>{ delBtn.textContent = r.value==='delete' ? `Delete Folder & ${count} Files` : 'Delete Folder'; };
    });
  }
  actions.appendChild(cancelBtn); actions.appendChild(delBtn);
  modal.appendChild(actions);
  return m;
}

function sanitizeName(s){ return s.replace(/[\\/:*?"<>|]/g, '-').trim(); }

// ---- Export (list metadata vs. the actual files, mirrored as a real folder
//      structure inside a downloadable ZIP — a multi-attachment document like
//      "CDL" becomes its own subfolder holding each attachment) ----
function modalExport(){
  if(!state.exportFolders){
    state.exportFolders = new Set([...FOLDERS.map(f=>f.id), 'unfiled']);
  }
  const wrap = modalShell('');
  const modal = wrap.querySelector('.modal');
  modal.appendChild(el('<h2>Export</h2>'));
  modal.appendChild(el('<p class="mdesc">Export a spreadsheet of the file list, or download the actual documents.</p>'));

  const modeRow = el('<div class="export-mode-row"></div>');
  const listCard = el(`<button class="export-mode-card${state.exportMode==='list'?' active':''}">${iconHTML('table_chart',20)}<span>Export list</span><span class="emc-sub">Spreadsheet of names, dates, status...</span></button>`);
  const filesCard = el(`<button class="export-mode-card${state.exportMode==='files'?' active':''}">${iconHTML('folder_zip',20)}<span>Export files</span><span class="emc-sub">Download the actual documents (.zip)</span></button>`);
  listCard.onclick = ()=>{ state.exportMode='list'; openModal('export'); };
  filesCard.onclick = ()=>{ state.exportMode='files'; openModal('export'); };
  modeRow.appendChild(listCard); modeRow.appendChild(filesCard);
  modal.appendChild(modeRow);

  if(state.exportMode === 'list'){
    modal.appendChild(el('<div class="swatch-section-label" style="margin-top:16px;">FORMAT</div>'));
    const fmtRow = el('<div class="export-format-row"></div>');
    [['csv','CSV'],['xlsx','Excel'],['pdf','PDF']].forEach(([val,label])=>{
      const b = el(`<button class="btn${state.exportListFormat===val?' primary':''}">${label}</button>`);
      b.onclick = ()=>{ state.exportListFormat = val; openModal('export'); };
      fmtRow.appendChild(b);
    });
    modal.appendChild(fmtRow);

    const actions = el('<div class="actions"></div>');
    const cancelBtn = el('<button class="btn">Cancel</button>');
    cancelBtn.onclick = closeModal;
    const goBtn = el(`<button class="btn primary">Export ${state.exportListFormat.toUpperCase()}</button>`);
    goBtn.onclick = ()=> exportList(state.exportListFormat);
    actions.appendChild(cancelBtn); actions.appendChild(goBtn);
    modal.appendChild(actions);
  } else {
    const allOptions = [...FOLDERS.map(f=>({id:f.id, name:f.name})), {id:'unfiled', name:'Unfiled'}];

    modal.appendChild(el('<div class="swatch-section-label" style="margin-top:16px;">FOLDERS TO INCLUDE</div>'));
    const selRow = el('<div class="select-all-row"></div>');
    const selAllLink = el('<a>Select all</a>');
    selAllLink.onclick = ()=>{ allOptions.forEach(o=>state.exportFolders.add(o.id)); openModal('export'); };
    const deselAllLink = el('<a>Deselect all</a>');
    deselAllLink.onclick = ()=>{ state.exportFolders.clear(); openModal('export'); };
    selRow.appendChild(selAllLink); selRow.appendChild(deselAllLink);
    modal.appendChild(selRow);

    const list = el('<div id="exportFolderList"></div>');
    allOptions.forEach(o=>{
      const count = files.filter(d=> (o.id==='unfiled' ? !d.folder : d.folder===o.id)).length;
      const row = el(`<label class="colpanel-row">
        <input type="checkbox" ${state.exportFolders.has(o.id)?'checked':''}/>
        <span class="name">${o.name}</span>
        <span style="color:var(--text400);font-size:11.5px;">${count} file${count!==1?'s':''}</span>
      </label>`);
      row.querySelector('input').onchange = (e)=>{
        if(e.target.checked) state.exportFolders.add(o.id); else state.exportFolders.delete(o.id);
        openModal('export');
      };
      list.appendChild(row);
    });
    modal.appendChild(list);

    const totalFiles = [...state.exportFolders].reduce((n,fid)=>{
      const docs = files.filter(d=> (fid==='unfiled' ? !d.folder : d.folder===fid));
      return n + docs.reduce((m,d)=>m+d.attachments.length,0);
    }, 0);

    const actions = el('<div class="actions"></div>');
    const cancelBtn = el('<button class="btn">Cancel</button>');
    cancelBtn.onclick = closeModal;
    const zipBtn = el(`<button class="btn primary" ${totalFiles===0?'disabled':''}>${iconHTML('download',16)}Download ZIP (${totalFiles})</button>`);
    zipBtn.onclick = ()=> exportFilesZip();
    actions.appendChild(cancelBtn); actions.appendChild(zipBtn);
    modal.appendChild(actions);
  }
  return wrap;
}

function exportList(format, list){
  list = list || files;
  const customCols = columnDefs.filter(c=>c.custom && c.visible);
  const headers = ['Name','Folder','Uploader','Upload Date','Format','Attachments','Expiration','Status', ...customCols.map(c=>c.label)];
  const rows = list.map(d=>[
    d.name, folderName(d.folder), d.uploader||'—', d.uploadDate||'—', formatLabel(d), d.attachments.length, d.exp||'—', statusLabel(d.status),
    ...customCols.map(c=> c.fieldType==='checkbox' ? (getFieldValue(d,c.key) ? 'Checked' : 'Not checked') : (getFieldValue(d,c.key) || '—'))
  ]);

  if(format === 'csv'){
    const csv = [headers, ...rows].map(r=> r.map(v=> `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    downloadBlob(new Blob([csv], {type:'text/csv'}), 'Maksim_Gerasimov_Documents.csv');
    showToast(`Exported ${rows.length} rows as CSV`);
    closeModal();
  } else if(format === 'xlsx'){
    if(typeof XLSX === 'undefined'){ showToast('Excel library still loading — try again in a second'); return; }
    const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
    ws['!cols'] = headers.map(()=>({wch:20}));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Documents');
    XLSX.writeFile(wb, 'Maksim_Gerasimov_Documents.xlsx');
    showToast(`Exported ${rows.length} rows to Excel`);
    closeModal();
  } else if(format === 'pdf'){
    if(typeof window.jspdf === 'undefined'){ showToast('PDF library still loading — try again in a second'); return; }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation:'landscape' });
    doc.setFontSize(14);
    doc.setTextColor(51,55,97);
    doc.text('Documents — Maksim Gerasimov', 14, 15);
    doc.autoTable({
      head:[headers], body:rows, startY:20, styles:{fontSize:8, cellPadding:2},
      headStyles:{fillColor:[51,55,97], textColor:255},
      alternateRowStyles:{fillColor:[250,250,252]},
    });
    doc.save('Maksim_Gerasimov_Documents.pdf');
    showToast(`Exported ${rows.length} rows to PDF`);
    closeModal();
  }
}

// The envelope's name is just the folder/label — an individual attachment
// keeps its own real filename when it has one (an actual upload); only the
// simulated/seed attachments without a stored name fall back to deriving
// one from the document.
function attachmentFileName(doc, a, i){
  if(a.originalName) return a.originalName;
  return `${sanitizeName(doc.name)}${doc.attachments.length>1?` (${i+1})`:''}.${a.type.toLowerCase()}`;
}
async function exportSelectedZip(docs){
  if(typeof JSZip === 'undefined'){ showToast('ZIP library unavailable right now — please try again.'); return; }
  const zip = new JSZip();
  let fileCount = 0;
  docs.forEach(doc=>{
    if(doc.attachments.length === 1){
      const a = doc.attachments[0];
      zip.file(attachmentFileName(doc,a,0), `Simulated content for "${doc.name}" (${a.type}, ${a.size}) — uploaded by ${doc.uploader} on ${doc.uploadDate}.`);
      fileCount++;
    } else if(doc.attachments.length > 1){
      const docZip = zip.folder(sanitizeName(doc.name));
      doc.attachments.forEach((a,i)=>{
        docZip.file(attachmentFileName(doc,a,i), `Simulated content — part ${i+1} of "${doc.name}" (${a.type}, ${a.size}).`);
        fileCount++;
      });
    }
  });
  if(fileCount===0){ showToast('None of the selected documents have files to download'); return; }
  const blob = await zip.generateAsync({type:'blob'});
  downloadBlob(blob, `Maksim_Gerasimov_Selected_Documents.zip`);
  showToast(`Downloaded ${fileCount} file${fileCount!==1?'s':''} from ${docs.length} document${docs.length!==1?'s':''}`);
}
async function exportFilesZip(){
  if(typeof JSZip === 'undefined'){ showToast('ZIP library unavailable right now — please try again.'); return; }
  const zip = new JSZip();
  let fileCount = 0;
  [...state.exportFolders].forEach(fid=>{
    const folderLabel = fid==='unfiled' ? 'Unfiled' : folderName(fid);
    const folderZip = zip.folder(sanitizeName(folderLabel));
    const docs = files.filter(d=> (fid==='unfiled' ? !d.folder : d.folder===fid));
    docs.forEach(doc=>{
      if(doc.attachments.length === 1){
        const a = doc.attachments[0];
        folderZip.file(attachmentFileName(doc,a,0), `Simulated content for "${doc.name}" (${a.type}, ${a.size}) — uploaded by ${doc.uploader} on ${doc.uploadDate}.`);
        fileCount++;
      } else {
        // A multi-attachment envelope (e.g. "CDL" with front + back) becomes
        // its own subfolder, one file per attachment — exactly how it's
        // grouped in the app.
        const docZip = folderZip.folder(sanitizeName(doc.name));
        doc.attachments.forEach((a,i)=>{
          docZip.file(attachmentFileName(doc,a,i), `Simulated content — part ${i+1} of "${doc.name}" (${a.type}, ${a.size}).`);
          fileCount++;
        });
      }
    });
  });
  const blob = await zip.generateAsync({type:'blob'});
  downloadBlob(blob, 'Maksim_Gerasimov_Documents.zip');
  showToast(`Downloaded ${fileCount} files across ${state.exportFolders.size} folder${state.exportFolders.size!==1?'s':''}`);
  closeModal();
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
}

function modalAddColumn(){
  const m = modalShell(`<h2>Add Custom Column</h2><p class="mdesc">Visible to everyone with access to this driver's Documents.</p>
    <div class="field"><label>Column name</label><input type="text" id="colName" placeholder="e.g. Reviewed By"/></div>
    <div class="field"><label>Field type</label>
      <select id="colType">
        <option value="text">Text</option>
        <option value="number">Number</option>
        <option value="date">Date</option>
        <option value="select">Single select</option>
        <option value="checkbox">Checkbox</option>
      </select>
    </div>`);
  const modal = m.querySelector('.modal');

  // Options builder: type one option, press Enter (or click Add) to turn it
  // into a chip. Far more intuitive than a single comma-separated text field,
  // and each option can be removed individually. Each option also gets its
  // own color (small dot, click to pick) — same presets+custom picker used
  // for folders, so status-like select columns can be color-coded the same
  // way the rest of the app already is.
  const optionsWrap = el(`<div class="field" id="optionsWrap" style="display:none;"><label>Options</label></div>`);
  const chipRow = el('<div class="option-chip-row"></div>');
  let pendingOptions = []; // {name, color}
  function renderChips(){
    chipRow.innerHTML = '';
    if(pendingOptions.length===0){
      chipRow.appendChild(el('<span class="no-options-hint">No options yet — add at least one below.</span>'));
    }
    pendingOptions.forEach((opt,i)=>{
      const chip = el(`<span class="option-chip"><span class="opt-color-dot" style="background:${resolveColor(opt.color)};" title="Change color"></span>${opt.name}<span class="chip-remove">${iconHTML('close',13)}</span></span>`);
      chip.querySelector('.opt-color-dot').onclick = (e)=>{ e.stopPropagation(); openOptionColorPicker(e.currentTarget, opt, renderChips); };
      chip.querySelector('.chip-remove').onclick = ()=>{ pendingOptions.splice(i,1); renderChips(); };
      chipRow.appendChild(chip);
    });
  }
  renderChips();
  optionsWrap.appendChild(chipRow);
  const addOptRow = el('<div class="add-option-row"></div>');
  const optInput = el('<input type="text" placeholder="Type an option, press Enter"/>');
  const addOptBtn = el('<button type="button" class="btn">Add</button>');
  function addPendingOption(){
    const v = optInput.value.trim();
    if(v && !pendingOptions.some(o=>o.name===v)){
      const color = FOLDER_COLORS[pendingOptions.length % FOLDER_COLORS.length].value;
      pendingOptions.push({name:v, color});
      renderChips();
    }
    optInput.value = ''; optInput.focus();
  }
  optInput.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); addPendingOption(); } };
  addOptBtn.onclick = addPendingOption;
  addOptRow.appendChild(optInput); addOptRow.appendChild(addOptBtn);
  optionsWrap.appendChild(addOptRow);
  modal.appendChild(optionsWrap);

  modal.querySelector('#colType').onchange = (e)=>{
    optionsWrap.style.display = e.target.value==='select' ? 'block' : 'none';
  };

  const actions = el('<div class="actions"></div>');
  const cancelBtn = el('<button class="btn">Cancel</button>');
  cancelBtn.onclick = ()=> openModal('columns');
  const addBtn = el('<button class="btn primary">Add Column</button>');
  addBtn.onclick = ()=>{
    const name = modal.querySelector('#colName').value.trim();
    if(!name){ showToast('Column name is required'); return; }
    const fieldType = modal.querySelector('#colType').value;
    if(fieldType==='select' && pendingOptions.length===0){ showToast('Add at least one option'); return; }
    const key = 'custom_' + name.toLowerCase().replace(/[^a-z0-9]+/g,'_');
    columnDefs.push({key, label:name, visible:true, custom:true, fieldType, options:[...pendingOptions]});
    files.forEach(d=>{ d.customFields = d.customFields||{}; d.customFields[key] = fieldType==='checkbox' ? false : ''; });
    showToast(`Custom column "${name}" added`);
    openModal('columns');
  };
  actions.appendChild(cancelBtn); actions.appendChild(addBtn);
  modal.appendChild(actions);
  return m;
}

const FIELD_TYPE_LABEL = {text:'Text', number:'Number', date:'Date', select:'Single select', checkbox:'Checkbox'};

        const chip = el(`<span class="option-chip"><span class="opt-color-dot" style="background:${resolveColor(opt.color)};" title="Change color"></span>${opt.name}<span class="chip-remove">${iconHTML('close',13)}</span></span>`);

      if(v && !pendingOptions.some(o=>o.name===v)){
        const color = FOLDER_COLORS[pendingOptions.length % FOLDER_COLORS.length].value;
        pendingOptions.push({name:v, color});
        renderChips();
      }

    }
