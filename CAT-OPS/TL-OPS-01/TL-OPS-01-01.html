.switch{width:36px;height:20px;border-radius:10px;background:var(--border2);position:relative;cursor:pointer;flex-shrink:0;transition:background .15s;}
.switch.on{background:var(--accent);}
.switch .knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;}
.switch.on .knob{left:18px;}

.modal.filter-panel{width:460px;}
.modal.filter-panel.customize-mode{border:1.5px dashed var(--accent);}
.filter-header{display:flex;align-items:center;gap:8px;margin-bottom:14px;padding-right:40px;}
.filter-header h2{flex:1;margin:0;font-size:17px;}
.filter-section-label{font-size:10.5px;font-weight:700;color:var(--text400);letter-spacing:.3px;margin:14px 0 8px;}
.filter-divider{height:1px;background:var(--border2);margin:10px 0;}

.filter-field{margin-bottom:12px;}
.filter-field label{display:block;font-size:11px;font-weight:600;color:var(--text600);margin-bottom:6px;}
.filter-field-row{display:flex;align-items:center;gap:8px;margin-bottom:2px;user-select:none;position:relative;}
.filter-field-row .drag-handle{color:var(--text400);cursor:grab;flex-shrink:0;}
.filter-field-row .filter-field{flex:1;margin-bottom:0;}

.filter-input-box{border:1px solid var(--border);border-radius:8px;padding:9px 12px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-size:13px;color:var(--text900);background:#fff;}
.filter-input-box .ph{color:var(--neutral300);}
.filter-checklist{border:1px solid var(--border2);border-top:none;border-radius:0 0 8px 8px;padding:8px;margin-top:-1px;max-height:220px;overflow-y:auto;}
.filter-checklist label{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text900);padding:5px 4px;cursor:pointer;}

.filter-toggle-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;}
.filter-toggle-row label{font-size:12.5px;color:var(--text900);}

.filter-range{display:flex;align-items:center;gap:8px;}
.filter-range input{border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12.5px;font-family:inherit;width:100%;}
.preset-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.preset-chip{border:1px solid var(--border);background:#fff;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--text900);cursor:pointer;font-family:inherit;}
.preset-chip:hover{background:var(--bg50);}
.preset-chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}

<style>
/* ==== Foundations: tokens (07 §1) + shell/table/panel/modal rules extracted verbatim from ENT-DRV-CAB-01 (DOC) ==== */
:root{
  --accent:#48C876; --info:#56a8dd; --warning:#FFAD20; --danger:#E82C3F; --purple:#7852F7; --accentBlue:#2E5BFF;
  --rail:#2e2a5c; --text900:#333761; --text600:#666989; --text400:#9a9ab0; --neutral300:#b3b4c4; --neutral200:#d0d0da;
  --border:#e5e6eb; --border2:#eeeef2; --rowBorder:#f0f0f4; --headerBg:#fafafc;
  --bg50:#f5f5f7; --white:#fff;
  --success-bg:#eafcf1; --success-t:#1e8e5a;
  --warning-bg:#fff5e6; --warning-t:#a85e00;
  --danger-bg:#fdecec; --danger-t:#c22b2b;
  --neutral-bg:#f0f0f4; --neutral-t:#666989;
  --accent-dark:#1e8e5a; --info-bg:#eef4fb; --purple-bg:#efeafe; --selected-bg:#f4fdf7;
}
.sortable-ghost{opacity:.3 !important;outline:1.5px dashed var(--border);outline-offset:-1px;border-radius:6px;}
.sortable-ghost > *{visibility:hidden;}
.sortable-fallback, .sortable-drag{opacity:.85 !important;box-shadow:0 12px 28px rgba(0,0,0,.22),0 2px 6px rgba(0,0,0,.12) !important;border-radius:8px;background:#fff !important;}
*{box-sizing:border-box;}
.material-symbols-outlined{font-family:'Material Symbols Outlined'; font-variation-settings:'FILL' 0; font-weight:normal; font-style:normal; line-height:1; display:inline-block; white-space:nowrap; word-wrap:normal; -webkit-font-feature-settings:'liga'; font-feature-settings:'liga'; -webkit-font-smoothing:antialiased;}
.material-symbols-outlined.icon-filled{font-variation-settings:'FILL' 1;}
body{margin:0;font-family:'Source Sans 3',sans-serif;color:var(--text900);background:#f4f4f7;font-size:13px;overflow-x:hidden;display:flex;justify-content:center;}
.app{display:flex;width:1320px;height:1040px;overflow:hidden;transform-origin:top left;}
.rail{width:64px;flex-shrink:0;background:var(--rail);display:flex;flex-direction:column;margin:16px 0 16px 16px;border-radius:16px;overflow:hidden;transition:width .22s ease;}
.rail.expanded{width:220px;}
.rail-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:6px 10px;}
.rail-scroll::-webkit-scrollbar{width:0;display:none;}
.rail-top{flex-shrink:0;display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:16px 10px 0;}
.rail-tune{flex-shrink:0;display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:0 10px 14px;}
.rail .logo{width:36px;height:36px;border-radius:50%;background:#fff;color:var(--rail);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin:0 auto;overflow:hidden;}
.rail-powered-by{display:flex;align-items:center;gap:8px;justify-content:center;padding-top:10px;opacity:.7;}
.rail.expanded .rail-powered-by{justify-content:flex-start;padding-left:8px;opacity:1;}
.easyway-wordmark{opacity:0;width:0;overflow:hidden;white-space:nowrap;font-size:14px;font-weight:700;color:#fff;letter-spacing:-.2px;transition:opacity .1s ease;}
.rail.expanded .easyway-wordmark{opacity:1;width:auto;transition:opacity .25s ease .12s;}
.rail .icon-slot{width:36px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:0;flex-shrink:0;color:#bdbcd9;cursor:pointer;margin:0 auto;padding:0;transition:width .22s ease,padding .22s ease,justify-content .22s ease,gap .22s ease;}
.rail.expanded .icon-slot{gap:10px;width:100%;justify-content:flex-start;padding:0 8px;margin:0;}
.icon-label{opacity:0;width:0;overflow:hidden;white-space:nowrap;font-size:12.5px;font-weight:600;transition:opacity .12s ease;}
.rail.expanded .icon-label{opacity:1;width:auto;transition:opacity .2s ease .1s;}
.rail-tooltip{position:fixed;transform:translateY(-50%);background:#1a1830;color:#fff;font-size:11.5px;font-weight:600;padding:6px 10px;border-radius:6px;white-space:nowrap;z-index:300;box-shadow:0 6px 16px rgba(0,0,0,.25);pointer-events:none;}
.rail .icon-slot.active{background:#3d3970;color:#fff;}
.rail .icon-slot:hover{background:#3d3970;color:#fff;}
.rail .rail-divider{width:36px;height:1px;background:#4a4680;margin:4px auto;transition:width .22s ease;}
.rail.expanded .rail-divider{width:100%;}
.rail-section-label{font-size:8px;font-weight:700;color:#8482ac;letter-spacing:.5px;text-align:center;padding:2px 0 4px;width:100%;}
.rail.expanded .rail-section-label{text-align:left;padding-left:8px;}
.rail-collapse-toggle{width:36px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#8482ac;cursor:pointer;margin:0 auto;transition:width .22s ease,padding .22s ease,justify-content .22s ease,gap .22s ease;}
.rail.expanded .rail-collapse-toggle{width:100%;justify-content:flex-start;padding:0 8px;margin:0;gap:10px;}
.rail-collapse-toggle:hover{background:rgba(255,255,255,.08);color:#fff;}
.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{flex-shrink:0;background:#fff;margin:16px 16px 0;border-radius:16px 16px 0 0;}
.topbar-row1{display:flex;align-items:center;gap:16px;padding:16px 24px;}
.topbar-search{background:var(--bg50);border-radius:8px;height:38px;display:flex;align-items:center;gap:8px;padding:0 12px;width:320px;flex-shrink:0;}
.topbar-search input{border:none;background:none;outline:none;font-size:13px;color:var(--text900);font-family:inherit;width:100%;}
.topbar-quickview{background:var(--warning);border-radius:8px;height:36px;width:36px;padding:0;display:flex;align-items:center;justify-content:center;gap:7px;color:#fff;font-size:12px;font-weight:700;flex-shrink:0;cursor:pointer;overflow:hidden;white-space:nowrap;transition:width .22s ease,padding .22s ease,justify-content .22s ease;}
.topbar-quickview:hover{width:118px;padding:0 12px;justify-content:flex-start;}
.topbar-quickview .qv-label{opacity:0;width:0;overflow:hidden;transition:opacity .12s ease;}
.topbar-quickview:hover .qv-label{opacity:1;width:auto;transition:opacity .2s ease .1s;}
.topbar-user{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.topbar-user .name{font-weight:700;font-size:13px;color:var(--text900);}
.topbar-user .role{font-size:11px;color:var(--text400);}
.topbar-row2{display:flex;align-items:center;gap:6px;padding:10px 24px;border-top:1px solid var(--border2);font-size:12.5px;color:var(--text400);}
.topbar-row2 .current{font-weight:600;color:var(--text900);}
.avatar-sm{width:36px;height:36px;border-radius:50%;background:var(--border2);flex-shrink:0;}
.topbar-chat{position:relative;cursor:pointer;display:flex;align-items:center;}
.content{flex:1;overflow-y:auto;padding:20px 24px 24px;display:flex;flex-direction:column;gap:0;min-height:0;background:#fff;margin:0 16px 16px;border-radius:0 0 16px 16px;}
.tabs-bar{display:flex;align-items:center;gap:6px;padding:0 20px;border-bottom:1px solid var(--border2);flex-shrink:0;}
.tabs-scroll{display:flex;gap:26px;overflow-x:auto;scrollbar-width:none;}
.tabs-scroll::-webkit-scrollbar{display:none;}
.tab-arrow{color:var(--text400);cursor:pointer;flex-shrink:0;padding:8px 2px;}
.tab{display:flex;align-items:center;gap:6px;cursor:pointer;padding:14px 0 10px;flex-shrink:0;border-bottom:3px solid transparent;}
.tab .label{font-weight:700;font-size:14.5px;color:var(--text400);white-space:nowrap;}
.tab.active .label{color:var(--text900);}
.tab.active{border-bottom-color:var(--text900);}
.tab .count{background:var(--border2);color:var(--text400);font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px;}
.tab.active .count{background:#f2f1f8;color:var(--text900);}
.tab-tune{margin-left:auto;flex-shrink:0;color:var(--text400);cursor:pointer;padding:8px;}
.doc-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;overflow-x:auto;padding:14px 20px;flex-shrink:0;}
.doc-toolbar::-webkit-scrollbar{height:6px;}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;padding:9px 12px;width:260px;flex-shrink:0;}
.search input{border:none;outline:none;font-size:12.5px;width:100%;font-family:inherit;color:var(--text900);}
.search-clear-btn{display:flex;color:var(--text400);cursor:pointer;border-radius:50%;flex-shrink:0;}
.btn{border:1px solid var(--border);background:#fff;border-radius:8px;padding:8px 14px;font-size:12.5px;font-weight:600;color:var(--text900);cursor:pointer;font-family:inherit;flex-shrink:0;display:flex;align-items:center;gap:6px;}
.btn:hover{background:var(--bg50);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.primary:hover{filter:brightness(0.95);}
.btn.dark{background:var(--text900);border-color:var(--text900);color:#fff;}
.btn.dark:hover{background:#292c50;}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff;}
.badge-count{background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:9px;margin-left:2px;}
.table-outer{flex:1;overflow:auto;margin:0 20px;border:1px solid var(--border2);border-radius:12px;min-height:0;scrollbar-width:thin;scrollbar-color:var(--neutral300) var(--bg50);}
.table-outer::-webkit-scrollbar{height:11px;width:11px;}
.table-outer::-webkit-scrollbar-track{background:var(--bg50);}
.table-outer::-webkit-scrollbar-thumb{background:var(--neutral300);border-radius:6px;border:2px solid var(--bg50);}
.table-outer::-webkit-scrollbar-thumb:hover{background:var(--text400);}
table{width:100%;border-collapse:collapse;min-width:1000px;}
thead th{position:sticky;top:0;background:var(--headerBg);text-align:left;font-size:10.5px;font-weight:700;color:var(--text400);letter-spacing:.3px;padding:11px 14px;border-bottom:1px solid var(--border2);cursor:pointer;user-select:none;white-space:nowrap;z-index:2;}
thead th.tight, tbody td.tight{padding-left:0;padding-right:0;}
thead th.tight:first-child, tbody td.tight:first-child{padding-left:10px;}
thead th:hover{color:var(--text900);}
thead th .sort-arrow{font-size:12px;margin-left:2px;opacity:.6;}
tbody td{padding:11px 14px;border-bottom:1px solid var(--rowBorder);font-size:12.5px;vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--bg50);}
tbody tr:hover td.frozen-col{background:var(--bg50);}
.frozen-col-last{box-shadow:2px 0 4px -2px rgba(0,0,0,0.08);}
.frozen-col-right{box-shadow:-2px 0 4px -2px rgba(0,0,0,0.08);}
.status-pill{display:inline-block;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:700;white-space:nowrap;}
.status-pill.valid{background:var(--success-bg);color:var(--success-t);}
.status-pill.on_file{background:var(--success-bg);color:var(--success-t);}
.status-pill.soon{background:var(--warning-bg);color:var(--warning-t);}
.status-pill.expired{background:var(--danger-bg);color:var(--danger-t);}
.status-pill.na{background:var(--neutral-bg);color:var(--text400);}
.status-pill.missing{background:#fff;border:1px dashed var(--border);color:var(--text400);}
.status-pill.awaiting_signature{background:#e8ecff;color:var(--accentBlue);}
.status-pill.awaiting_upload{background:#eef4fb;color:var(--info);}
.status-pill.pending_approval{background:var(--warning-bg);color:var(--warning-t);}
.row-actions{color:var(--text400);cursor:pointer;padding:4px;border-radius:6px;}
.option-chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;min-height:24px;}
.option-chip{display:flex;align-items:center;gap:6px;background:var(--bg50);border:1px solid var(--border2);border-radius:20px;padding:5px 6px 5px 8px;font-size:12px;color:var(--text900);}
.option-chip .chip-remove{display:flex;color:var(--text400);cursor:pointer;border-radius:50%;}
.option-chip .chip-remove:hover{color:var(--danger);}
.no-options-hint{font-size:12px;color:var(--text400);font-style:italic;}
.side-panel-scrim{position:fixed;inset:0;background:rgba(46,42,92,0);z-index:150;transition:background .2s ease;pointer-events:none;}
.side-panel-scrim.open{background:rgba(46,42,92,.4);pointer-events:auto;}
.side-panel{position:fixed;top:0;right:0;bottom:0;width:560px;max-width:92vw;background:#fff;box-shadow:-8px 0 30px rgba(0,0,0,.15);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s ease;}
.side-panel-scrim.open .side-panel{transform:translateX(0);}
.sp-header{display:flex;flex-direction:column;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border2);flex-shrink:0;}
.sp-top-row{display:flex;align-items:center;gap:12px;}
.sp-header-text{flex:1;min-width:0;}
.sp-title-input{width:100%;border:1px solid transparent;background:none;font-size:15px;font-weight:700;color:var(--text900);font-family:inherit;padding:3px 6px;margin:-3px -6px;border-radius:6px;}
.sp-title-input:hover{background:var(--bg50);}
.sp-title-input:focus{outline:none;border-color:var(--info);background:#fff;}
.sp-sub{font-size:11.5px;color:var(--text400);margin-top:2px;padding-left:6px;}
.sp-close-x{flex-shrink:0;position:static;}
.sp-body{flex:1;overflow-y:auto;padding:4px 20px 20px;}
.sp-section{margin-top:18px;}
.sp-section-title{font-size:10.5px;font-weight:700;color:var(--text400);letter-spacing:.3px;margin-bottom:8px;}
.sp-detail-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:12.5px;}
.sp-approval-banner{background:var(--warning-bg);border-radius:10px;padding:12px;margin-bottom:16px;}
.sp-approval-text{font-size:12.5px;color:var(--text900);line-height:1.4;display:flex;gap:8px;align-items:flex-start;}
.sp-approval-actions{display:flex;gap:8px;margin-top:10px;}
.sp-approval-actions .btn{flex:1;justify-content:center;}
.sp-reject-box{margin-top:10px;}
.sp-reject-box textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:9px 10px;font-size:12px;font-family:inherit;min-height:56px;resize:vertical;}
.sp-detail-label{color:var(--text400);}
.sp-detail-value{color:var(--text900);font-weight:600;text-align:right;}
.sp-exp-input{display:inline-block;border:1px solid transparent;background:none;font-size:12.5px;font-weight:600;color:var(--text900);font-family:inherit;text-align:right;border-radius:6px;padding:3px 6px;cursor:pointer;}
.sp-exp-input:hover{background:var(--bg50);}
.sp-exp-input:focus{outline:none;border-color:var(--info);background:#fff;}
.branded-select{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:1px solid var(--border);border-radius:8px;padding:9px 10px;font-size:13px;font-family:inherit;color:var(--text900);background:#fff;cursor:pointer;text-align:left;}
.branded-select:hover{border-color:var(--text400);}
.branded-select .bs-current{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.branded-select-menu{padding:6px;min-width:180px;max-height:280px;overflow-y:auto;}
.bs-option{display:flex;align-items:center;gap:8px;width:100%;border:none;background:none;text-align:left;padding:8px 10px;border-radius:7px;font-size:13px;color:var(--text900);cursor:pointer;font-family:inherit;}
.bs-option:hover{background:var(--bg50);}
.bs-option.active{color:var(--accent-dark, var(--accent));font-weight:700;}
.bs-option.active svg, .bs-option.active .material-symbols-outlined{color:var(--accent);}
.bs-option.emphasis{color:var(--info);font-weight:700;border-top:1px solid var(--border2);margin-top:4px;padding-top:10px;}
.sp-attachment-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--rowBorder);}
.sp-attachment-row:last-child{border-bottom:none;}
.sp-att-text{flex:1;min-width:0;}
.sp-att-name{font-size:12.5px;font-weight:600;color:var(--text900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sp-att-meta{font-size:11px;color:var(--text400);margin-top:1px;}
.sp-att-actions{display:flex;gap:2px;flex-shrink:0;}
.sp-icon-btn{color:var(--text400);cursor:pointer;padding:6px;border-radius:6px;display:flex;}
.sp-icon-btn:hover{background:var(--bg50);color:var(--text900);}
.sp-footer{display:flex;gap:10px;padding:16px 20px;border-top:1px solid var(--border2);flex-shrink:0;}
.sp-footer .btn{flex:1;justify-content:center;}
.sp-share-area{flex-shrink:0;}
.sp-actions-list{display:flex;flex-direction:column;gap:2px;}
.sp-action-row{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--text900);cursor:pointer;}
.sp-action-row:hover{background:var(--bg50);}
.sp-action-row .material-symbols-outlined{color:var(--text400);}
.sp-task-card{background:var(--headerBg);border-radius:10px;padding:12px;}
.sp-tasks-list{display:flex;flex-direction:column;gap:10px;}
.sp-form-card{background:var(--headerBg);border-radius:10px;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.sp-form-name{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--text900);}
.sp-form-sub{font-size:11px;color:var(--text400);margin-top:3px;}
.sp-form-actions{display:flex;gap:2px;flex-shrink:0;}
.sp-task-title{font-size:12.5px;font-weight:700;color:var(--text900);margin-bottom:6px;}
.sp-task-meta{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text400);}

.route-list{display:flex;flex-direction:column;}
.route-stop{display:flex;gap:12px;padding:8px 0;position:relative;}
.route-stop .rs-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;margin-top:4px;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--border);}
.rs-dot.pickup{background:var(--info);}
.rs-dot.delivery{background:var(--accent);}
.rs-dot.done{background:var(--text400);}
.route-stop:not(:last-child):before{content:'';position:absolute;left:5px;top:22px;bottom:-8px;width:2px;background:var(--border2);}
.rs-body{flex:1;min-width:0;}
.rs-title{font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px;}
.rs-meta{font-size:12px;color:var(--text600);margin-top:2px;}
.rs-times{display:flex;gap:14px;margin-top:4px;font-size:11.5px;color:var(--text400);flex-wrap:wrap;}
.rs-times b{color:var(--text900);font-weight:600;}
.rs-times .late{color:var(--danger-t);}
.rs-actions{display:flex;gap:12px;margin-top:6px;}
.ent-card{border:1px solid var(--border2);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;}
.ent-card-head{display:flex;align-items:center;gap:10px;}
.ent-card-head .ent-avatar{width:36px;height:36px;font-size:13px;}
.ent-card-name{font-weight:600;font-size:13px;}
.ent-card-sub{font-size:12px;color:var(--text400);}
.ent-card .link-btn{margin-left:auto;}
.fin-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;}
.fin-total{display:flex;justify-content:space-between;border-top:1px solid var(--border2);margin-top:8px;padding-top:8px;font-weight:700;font-size:13px;}
.msg-feed{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
.msg{max-width:82%;padding:8px 12px;border-radius:12px;font-size:12.5px;line-height:1.4;}
.msg.driver{background:var(--bg50);align-self:flex-start;border-bottom-left-radius:4px;}
.msg.dispatcher{background:var(--success-bg);align-self:flex-end;border-bottom-right-radius:4px;}
.msg .msg-meta{font-size:11px;color:var(--text400);margin-top:3px;}
.msg.system{align-self:center;background:none;color:var(--text400);font-size:11px;}
.ai-line{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--purple);font-weight:600;margin-top:6px;}
.doc-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--rowBorder);}
.doc-row:last-child{border-bottom:none;}
.doc-row .dr-name{flex:1;font-size:12.5px;font-weight:600;}
.doc-row .dr-meta{font-size:11.5px;color:var(--text400);}

/* Assign modal — candidate list */
.modal.wide{max-width:600px;}
.cand{border:1px solid var(--border2);border-radius:10px;padding:11px 12px;margin-bottom:8px;cursor:pointer;}
.cand:hover{border-color:var(--text400);}
.cand.selected{border-color:var(--accent);background:var(--selected-bg);}
.cand.best{border-color:var(--purple);}
.cand.best.selected{background:var(--purple-bg);}
.cand-head{display:flex;align-items:center;gap:10px;}
.cand-name{font-weight:600;font-size:13px;}
.cand-sub{font-size:12px;color:var(--text400);}
.cand-rank{margin-left:auto;font-size:11px;font-weight:600;color:var(--text400);white-space:nowrap;}
.cand-facts{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin-top:8px;font-size:12px;color:var(--text600);}
.cand-facts .ok{color:var(--success-t);}
.cand-facts .bad{color:var(--danger-t);}
.cand-facts .warn{color:var(--warning-t);}
.cand-facts span{display:flex;align-items:center;gap:5px;}
.choice-row{display:flex;gap:10px;}
.choice{flex:1;border:1.5px solid var(--border2);border-radius:10px;padding:10px;cursor:pointer;font-size:12.5px;font-weight:600;text-align:center;}
.choice.active{border-color:var(--accent);background:var(--selected-bg);}
.modal .field .hint{font-size:11px;color:var(--text400);margin-top:4px;}
.modal .field input[type=number],.modal .field input[type=datetime-local]{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13px;font-family:inherit;color:var(--text900);background:#fff;}
.modal .field.inline{display:flex;gap:10px;} .modal .field.inline > div{flex:1;}

/* Add Load (TL-OPS-01-02 patterns) */
.method-cards{display:flex;gap:12px;}
.method-card{flex:1;border:1.5px solid var(--border2);border-radius:12px;padding:16px;cursor:pointer;position:relative;transition:border-color .15s, box-shadow .15s;}
.method-card:hover{border-color:var(--accent);box-shadow:0 6px 18px rgba(72,200,118,.12);}
.method-card .rec-badge{position:absolute;top:12px;right:12px;font-size:9.5px;font-weight:700;background:rgba(72,200,118,.14);color:var(--accent-dark);padding:3px 8px;border-radius:8px;letter-spacing:.02em;}
.method-card .mi{width:40px;height:40px;border-radius:11px;background:var(--bg50);display:flex;align-items:center;justify-content:center;margin-bottom:12px;color:var(--text900);}
.method-card h4{margin:0 0 6px;font-size:14px;font-weight:600;}
.method-card p{margin:0;font-size:12px;color:var(--text400);line-height:1.5;}
.stop-card{border:1px solid var(--border2);border-radius:10px;padding:10px 12px;margin-bottom:8px;position:relative;}
.stop-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.stop-kind{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:12px;}
.stop-kind.pickup{background:rgba(86,168,221,.14);color:var(--info);}
.stop-kind.delivery{background:rgba(72,200,118,.14);color:var(--accent-dark);}
.stop-card input{width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12.5px;font-family:inherit;color:var(--text900);margin-bottom:6px;}
.stop-card .stop-row{display:flex;gap:8px;}

/* Omnisearch flyout */
.omni-flyout{width:420px;padding:8px;}
.omni-group{font-size:10.5px;font-weight:700;color:var(--text400);letter-spacing:.3px;padding:8px 8px 4px;}
.omni-row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--text900);}
.omni-row:hover{background:var(--bg50);}
.omni-row .sub{color:var(--text400);font-size:12px;margin-left:auto;white-space:nowrap;}
.topbar-search .search-clear-btn{display:flex;color:var(--text400);cursor:pointer;}
.topbar-chat .unread{position:absolute;top:-2px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid #fff;}

/* Notifications (load alerts) */
.notif-row-sub{font-size:12px;color:var(--text400);margin-top:2px;}
.notif-mini-btn.assign{color:var(--accent-dark);}
.notif-mini-btn.snooze{color:var(--text400);}

/* Filter panel spacing — page-level override, proposed for _shared (04 Decision Log) */
.modal.filter-panel .filter-field{margin-bottom:16px;}
.modal.filter-panel .filter-field-row{margin-bottom:12px;}
.modal.filter-panel .filter-section-label{margin-top:18px;}
.modal.filter-panel .filter-field input[type=number]{width:100%;border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:12.5px;font-family:inherit;}
.modal.filter-panel .filter-toggle-row{padding:8px 0;}
.modal.filter-panel .pinned-divider{height:1px;background:var(--border2);margin:4px 0 8px;}

/* Empty state (TL-OPS-01-02 verbatim + action link) */
.empty-state{text-align:center;padding:60px 20px;color:var(--text400);}
.empty-state .material-symbols-outlined{font-size:44px;color:var(--border2);margin-bottom:10px;}
.empty-state p{font-size:13px;margin:4px 0;}
.empty-state .link-btn{margin-top:12px;font-size:13px;}

/* Frozen columns (07 §9) */
td.frozen-left,th.frozen-left{position:sticky;left:0;background:#fff;z-index:1;}
th.frozen-left{background:var(--headerBg);z-index:3;}
.frozen-left-last{box-shadow:2px 0 4px -2px rgba(0,0,0,0.08);}
td.frozen-right,th.frozen-right{position:sticky;right:0;background:#fff;z-index:1;}
th.frozen-right{background:var(--headerBg);z-index:3;}
.frozen-right-first{box-shadow:-2px 0 4px -2px rgba(0,0,0,0.08);}
tbody tr:hover td.frozen-left, tbody tr:hover td.frozen-right{background:var(--bg50);}

/* Custom column inline edit (FLEET pattern) */
.pd-edit-input{border:1px solid var(--info);border-radius:6px;padding:4px 8px;font-size:12.5px;font-family:inherit;width:100%;color:var(--text900);}
.editable-field{border-bottom:1px dashed var(--border);cursor:text;color:var(--text600);min-height:16px;display:inline-block;min-width:40px;}
.col-icon-btn{color:var(--text400);cursor:pointer;display:flex;padding:4px;border-radius:6px;margin-left:2px;}
.pin-toggle-row{display:flex;gap:18px;flex-wrap:wrap;padding:2px 4px 12px;}
.pin-toggle{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--accent-dark);cursor:pointer;}
.pin-toggle input{accent-color:var(--accent);cursor:pointer;}
.swatch-section-label{font-size:10px;font-weight:700;color:var(--text400);letter-spacing:.3px;margin:4px 0 8px;}
.more-filters-link{display:flex;align-items:center;gap:6px;color:var(--accent);font-weight:600;font-size:12.5px;cursor:pointer;margin:10px 0;}
.toast .dot.warning{background:var(--warning);}
.toast .dot.danger{background:var(--danger);}
.toast .dot.ai{background:var(--purple);}

/* ==== PLANNER (Gantt dispatch board) ==== */
.plan-toolbar{display:flex;align-items:center;gap:8px;padding:12px 20px;flex-shrink:0;flex-wrap:nowrap;}
.plan-toolbar .date-label{font-size:13px;font-weight:600;color:var(--text900);min-width:180px;text-align:center;}
.plan-toolbar .search{width:170px;}
.plan-toolbar .seg button{padding:0 11px;}
.plan-legend{display:flex;gap:12px;align-items:center;font-size:11.5px;color:var(--text600);margin-left:6px;flex-shrink:0;}
.plan-legend span{display:flex;align-items:center;gap:5px;}
.plan-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;}
.plan-legend i.dh{border:1px dashed var(--text400);background:none;border-radius:2px;height:8px;}
.gantt-wrap{flex:1;min-height:0;display:flex;flex-direction:column;margin:0 20px;border:1px solid var(--border2);border-radius:12px;overflow:hidden;background:#fff;}
.gantt-scroll{flex:1;min-height:0;overflow:auto;position:relative;scrollbar-width:thin;scrollbar-color:var(--neutral300) var(--bg50);}
.gantt-scroll::-webkit-scrollbar{height:10px;width:10px;} .gantt-scroll::-webkit-scrollbar-track{background:#fff;} .gantt-scroll::-webkit-scrollbar-thumb{background:var(--neutral200);border-radius:6px;border:2px solid #fff;}
.gantt-inner{position:relative;display:grid;grid-template-columns:240px 1fr;}
.gantt-corner{position:sticky;top:0;left:0;z-index:6;background:#fff;border-bottom:1px solid var(--border);border-right:1px solid var(--border2);padding:8px 14px;font-size:10.5px;font-weight:700;color:var(--text400);letter-spacing:.3px;display:flex;align-items:flex-end;}
.gantt-head{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--border);height:52px;}
/* clean day column: big number + small day, like the reference */
.gantt-head .gh-day{position:absolute;top:0;height:52px;border-left:1px solid var(--border2);padding:7px 0 0 10px;}
.gantt-head .gh-day.weekend{background:var(--bg50);}
.gantt-head .gh-day.today{background:var(--info-bg);}
.gantt-head .gh-day .ghd-n{font-size:17px;font-weight:700;color:var(--text900);line-height:1;}
.gantt-head .gh-day.today .ghd-n{color:var(--info);}
.gantt-head .gh-day .ghd-d{display:block;font-size:10.5px;font-weight:600;color:var(--text400);margin-top:2px;text-transform:uppercase;letter-spacing:.3px;}
.gantt-head .gh-hour{position:absolute;top:34px;font-size:10px;color:var(--neutral300);transform:translateX(-50%);}
/* week column header */
.gantt-head .gh-week{position:absolute;top:0;height:52px;border-left:1px solid var(--border2);padding:8px 0 0 12px;}
.gantt-head .gh-week.now{background:var(--info-bg);}
.gantt-head .gh-week .ghw-n{font-size:16px;font-weight:700;color:var(--text900);}
.gantt-head .gh-week.now .ghw-n{color:var(--info);}
.gantt-head .gh-week .ghw-d{display:block;font-size:11px;font-weight:600;color:var(--text400);margin-top:2px;}
.gantt-side{position:sticky;left:0;z-index:4;background:#fff;border-right:1px solid var(--border2);border-bottom:1px solid var(--rowBorder);padding:5px 12px;display:flex;flex-direction:column;justify-content:center;gap:2px;cursor:pointer;overflow:hidden;}
.gantt-side:hover{background:var(--bg50);}
.gantt-side .gs-top{display:flex;align-items:center;gap:8px;min-width:0;}
.gantt-side .gs-name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;}
.gantt-side .gs-meta{font-size:11.5px;color:var(--text400);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gantt-side .hos-cell{gap:2px;} .gantt-side .hos-row{font-size:11px;} .gantt-side .hos-row b{min-width:42px;font-size:11.5px;}
.gantt-group-side{position:sticky;left:0;z-index:4;background:var(--headerBg);border-right:1px solid var(--border2);border-bottom:1px solid var(--border2);padding:6px 12px;font-size:10.5px;font-weight:700;color:var(--text600);letter-spacing:.3px;display:flex;align-items:center;gap:6px;cursor:pointer;}
.gantt-group-side .cnt{color:var(--text400);font-weight:600;}
.gantt-group-row{background:var(--headerBg);border-bottom:1px solid var(--border2);}
.gantt-row{position:relative;border-bottom:1px solid var(--rowBorder);background-image:linear-gradient(to right,var(--border2) 1px,transparent 1px);transition:background-color .1s;}
.gantt-row.drop-ok{background-color:var(--selected-bg);} .gantt-row.drop-bad{background-color:var(--danger-bg);}
.g-daybg{position:absolute;top:0;bottom:0;background:var(--bg50);opacity:.45;pointer-events:none;}
.g-now{position:absolute;top:0;bottom:0;width:2px;background:var(--danger);z-index:3;pointer-events:none;}
.g-now-label{position:absolute;top:3px;transform:translateX(-50%);background:var(--danger);color:#fff;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px;z-index:6;white-space:nowrap;pointer-events:none;}
/* lighter bar: soft fill + a left status stripe carrying the color, dark readable text */
.g-bar{position:absolute;height:34px;border-radius:8px;display:flex;align-items:center;gap:6px;padding:0 9px 0 12px;font-size:12px;font-weight:600;color:var(--text900);cursor:grab;user-select:none;overflow:hidden;white-space:nowrap;background:#fff;border:1px solid var(--border);box-shadow:0 1px 2px rgba(51,55,97,.06);z-index:2;}
.g-bar:hover{box-shadow:0 6px 16px rgba(51,55,97,.14);z-index:3;border-color:var(--neutral200);}
.g-bar .gb-stripe{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--neutral300);border-radius:8px 0 0 8px;}
.g-bar.scheduled .gb-stripe{background:var(--info);} .g-bar.in_transit .gb-stripe{background:var(--accent);} .g-bar.at_pickup .gb-stripe,.g-bar.at_delivery .gb-stripe{background:var(--warning);} .g-bar.delivered .gb-stripe{background:var(--neutral300);} .g-bar.unassigned{border-style:dashed;} .g-bar.unassigned .gb-stripe{background:var(--text400);}
.g-bar.sev-danger{border-color:#f2b8b8;} .g-bar.sev-danger .gb-stripe{background:var(--danger);} .g-bar.sev-warning .gb-stripe{width:4px;}
.g-bar.delivered{color:var(--text400);background:var(--bg50);}
.g-bar.open{border-color:var(--text900);box-shadow:0 0 0 1px var(--text900);}
.g-bar .gb-label{overflow:hidden;text-overflow:ellipsis;min-width:0;} .g-bar .gb-sub{font-weight:400;color:var(--text400);overflow:hidden;text-overflow:ellipsis;}
.g-bar .gb-stop{position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;} .gb-stop.pickup{background:var(--info);} .gb-stop.delivery{background:var(--accent);}
.g-bar .gb-prog{position:absolute;left:0;top:0;bottom:0;background:rgba(72,200,118,.10);pointer-events:none;}
.g-dh{position:absolute;border-radius:8px;background:repeating-linear-gradient(135deg,#eceded 0 5px,#f7f7f9 5px 10px);border:1px dashed var(--neutral300);display:flex;align-items:center;padding-left:6px;z-index:1;pointer-events:none;overflow:hidden;}
.g-dh .dh-lbl{font-size:9.5px;font-weight:700;color:var(--text400);white-space:nowrap;}
.g-hos{position:absolute;height:15px;border-radius:5px;background:var(--warning-bg);border:1px solid #f3dcb0;font-size:9.5px;font-weight:600;color:var(--warning-t);display:flex;align-items:center;padding:0 6px;white-space:nowrap;overflow:hidden;z-index:1;pointer-events:none;opacity:.9;}
.g-off{position:absolute;height:15px;border-radius:5px;background:var(--bg50);border:1px solid var(--border2);font-size:9.5px;font-weight:600;color:var(--text400);display:flex;align-items:center;padding:0 6px;white-space:nowrap;overflow:hidden;z-index:1;pointer-events:none;}
.g-free{position:absolute;border-left:1px dashed var(--accent);pointer-events:none;z-index:1;} .g-free span{position:absolute;top:48px;left:3px;font-size:10px;font-weight:600;color:var(--accent-dark);white-space:nowrap;background:rgba(255,255,255,.9);padding:0 4px;border-radius:4px;}
.g-preview{position:absolute;height:34px;border-radius:8px;border:1.5px dashed var(--accent);background:var(--selected-bg);z-index:4;pointer-events:none;display:flex;align-items:center;padding:0 10px;font-size:12px;font-weight:600;color:var(--accent-dark);white-space:nowrap;overflow:hidden;}
.g-preview.bad{border-color:var(--danger);background:var(--danger-bg);color:var(--danger-t);}
.drag-ghost{position:fixed;z-index:500;pointer-events:none;opacity:.95;box-shadow:0 14px 34px rgba(0,0,0,.22) !important;border-radius:8px;}
.drag-hint{position:fixed;z-index:501;pointer-events:none;background:#1a1830;color:#fff;font-size:12px;padding:8px 10px;border-radius:8px;max-width:300px;line-height:1.4;box-shadow:0 8px 20px rgba(0,0,0,.25);}
.drag-hint .ok{color:#8fe3b0;} .drag-hint .bad{color:#ff9a9a;} .drag-hint .warn{color:#ffd27a;}
body.dragging, body.dragging *{cursor:grabbing !important;}
.g-bar.moving{z-index:5;box-shadow:0 10px 26px rgba(0,0,0,.2);opacity:.95;cursor:grabbing;}
.g-bar .gb-handle{position:absolute;top:0;bottom:0;width:9px;cursor:ew-resize;opacity:0;transition:opacity .12s;z-index:2;}
.g-bar .gb-handle.l{left:0;} .g-bar .gb-handle.r{right:0;}
.g-bar .gb-handle:before{content:'';position:absolute;top:10px;bottom:10px;width:2px;left:3px;background:var(--text900);border-radius:1px;opacity:.4;}
.g-bar:hover .gb-handle{opacity:1;}
.g-bar .gb-handle:hover{background:rgba(51,55,97,.06);}
body.resizing, body.resizing *{cursor:ew-resize !important;}
.tray{flex-shrink:0;margin:10px 20px 0;border:1px solid var(--border2);border-radius:12px;background:#fff;display:flex;flex-direction:column;max-height:196px;}
.tray-head{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--border2);font-size:10.5px;font-weight:700;color:var(--text600);letter-spacing:.3px;cursor:pointer;}
.tray-head .cnt{color:var(--text400);font-weight:600;} .tray-head .spacer{flex:1;}
.tray-body{display:flex;gap:10px;padding:10px 12px;overflow-x:auto;scrollbar-width:thin;}
.tray.collapsed .tray-body{display:none;}
.tray-card{flex:0 0 250px;border:1px solid var(--border2);border-radius:10px;padding:9px 11px;cursor:grab;user-select:none;background:#fff;position:relative;transition:box-shadow .12s,border-color .12s;}
.tray-card:hover{border-color:var(--text400);box-shadow:0 6px 16px rgba(0,0,0,.1);}
.tray-card.danger{border-left:3px solid var(--danger);} .tray-card.warning{border-left:3px solid var(--warning);}
.tray-card .tc-top{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;}
.tray-card .tc-top .src-pill{margin-left:auto;}
.tray-card .tc-route{font-size:12.5px;color:var(--text900);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tray-card .tc-meta{font-size:11.5px;color:var(--text400);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tray-card .tc-meta b{color:var(--accent-dark);}
.tray-card .ai-line{margin-top:5px;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tray-drop{flex:0 0 160px;border:1.5px dashed var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--text400);text-align:center;padding:10px;}
.tray-drop.active{border-color:var(--danger);color:var(--danger-t);background:var(--danger-bg);}
.drv-pop{width:340px;padding:12px;}
.drv-pop .pp-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;} .drv-pop .pp-name{font-weight:700;font-size:13px;} .drv-pop .pp-sub{font-size:12px;color:var(--text400);}

function apptLabel(a){ if(!a) return ''; if(a.type==='hard') return 'HARD'; if(a.type==='fcfs') return 'FCFS'; return 'WINDOW'; }
function apptText(a){ if(!a) return '—'; if(a.type==='window' && a.end) return fmtDayTime(a.start)+'–'+fmtTime(a.end); if(a.type==='fcfs' && a.end) return fmtDayTime(a.start)+'–'+fmtTime(a.end); return fmtDayTime(a.start); }

/* ============================================================

function haulTypesOf(l){ return (l.oversize && l.oversize.types) ? l.oversize.types : []; }

}
// distance (mi) from a point to the nearest permitted-route waypoint segment (rough: nearest waypoint)
function offRouteMiles(l){
  if(!l.driverId) return null; const drv=DRV[l.driverId]; const wps=[]; (l.permits||[]).forEach(p=>{ if(p.route && p.route.waypoints) wps.push(...p.route.waypoints); });

}
// is NOW inside a permitted travel window? (mock: daylight Mon–Sat unless curfew) — returns {ok, why}
function travelWindowOf(l){
  const active=(l.permits||[]).filter(p=>p.status==='received' && p.travel);
  if(!active.length) return null;
  const dow=NOW.getDay(); const hour=NOW.getHours()+NOW.getMinutes()/60;
  const SUNRISE=6.5, SUNSET=19.5;   // mock daylight window
  let ok=true, why=[];
  active.forEach(p=>{ const t=p.travel;
    if(/Mon–Fri/.test(t.days) && (dow===0||dow===6)){ ok=false; why.push(p.state+': no weekend travel'); }
    else if(/Mon–Sat/.test(t.days) && dow===0){ ok=false; why.push(p.state+': no Sunday travel'); }
    if(hour<SUNRISE || hour>SUNSET){ ok=false; why.push(p.state+': daylight only ('+t.from+' – '+t.to+')'); }
  });

}

/* ============================================================
   EXCEPTION ENGINE — reuses the alert severity model of the profiles
   (danger = needs action now, warning = due soon / at risk).
   Every load is re-evaluated on each render; nothing is cached.
   ============================================================ */
function nextStopOf(l){ return l.stops.find(s=>!s.departed) || null; }
function currentStopOf(l){ return l.stops.find(s=>s.arrived && !s.departed) || null; }

function driverActiveLoads(driverId){ return LOADS.filter(l=>l.driverId===driverId && isActive(l)); }

function deriveLoad(l){
  const drv = l.driverId ? DRV[l.driverId] : null;
  const trk = l.truckId ? TRK[l.truckId] : null;
  const trl = l.trailerId ? TRL[l.trailerId] : null;
  const next = nextStopOf(l);
  const cur = currentStopOf(l);
  const ex = [];
  let distToNext = null, travelMin = null, eta = null, dwellMin = null;

  if(drv && next && !next.arrived){
    distToNext = roadMiles(drv.gps, next);

    eta = new Date(NOW.getTime() + travelMin*60000);
  }

    // 1. no driver

      if(mins < 240) ex.push({sev:'danger', code:'unassigned', title:'No driver · pickup '+(mins<0?'was '+relTime(pu.appt.start):relTime(pu.appt.start)), detail:'Pickup '+pu.city+', '+pu.st+' · '+apptText(pu.appt), action:'assign'});
      else ex.push({sev:'warning', code:'unassigned', title:'Unassigned · pickup '+fmtDayTime(pu.appt.start), detail:pu.city+', '+pu.st+' → '+l.stops[l.stops.length-1].city, action:'assign'});
    }
    // 2. late for a stop (deadline passed, not arrived)
    if(next && !next.arrived){
      const dl = apptDeadline(next.appt);
      if(NOW > dl && l.driverId){
        ex.push({sev:'danger', code:'late', title:'Late for '+next.kind+' · appt was '+relTime(dl), detail:(eta?'ETA '+fmtShort(eta)+' · ':'')+next.city+', '+next.st, action:'open'});
      } else if(eta && l.driverId){
        // 3. appointment risk from ETA
        const buffer = (dl - eta)/60000;
        if(buffer < 0) ex.push({sev:'danger', code:'appt_risk', title:'Will miss '+next.kind+' appt · ETA '+fmtTime(eta)+', appt '+fmtTime(next.appt.start), detail:distToNext+' mi to '+next.city+' · needs '+fmtDur(travelMin), action:'open'});
        else if(buffer < 30) ex.push({sev:'warning', code:'appt_risk', title:'Tight ETA · '+fmtDur(buffer)+' buffer at '+next.kind, detail:distToNext+' mi to '+next.city+' · appt '+fmtTime(next.appt.start), action:'open'});
      }
      // 4. HOS vs remaining trip
      if(drv && travelMin!=null && l.status!=='scheduled'){
        if(drv.hos.drive < travelMin) ex.push({sev:'danger', code:'hos_risk', title:'HOS risk · '+fmtDur(drv.hos.drive)+' drive left, trip needs '+fmtDur(travelMin), detail:'Shift '+fmtDur(drv.hos.shift)+' left · break in '+fmtDur(drv.hos.breakIn), action:'open'});
        else if(drv.hos.shift < travelMin+30) ex.push({sev:'danger', code:'hos_risk', title:'HOS risk · shift ends in '+fmtDur(drv.hos.shift)+', trip needs '+fmtDur(travelMin), detail:'Drive '+fmtDur(drv.hos.drive)+' left', action:'open'});
        else if(drv.hos.drive < travelMin+45) ex.push({sev:'warning', code:'hos_risk', title:'HOS tight · '+fmtDur(drv.hos.drive-travelMin)+' drive margin', detail:'Trip needs '+fmtDur(travelMin), action:'open'});
      }
    }
    // 5. detention
    if(cur && dwellMin > cur.freeMin){
      ex.push({sev:'warning', code:'detention', title:'Detention at '+cur.kind+' · '+fmtDur(dwellMin - cur.freeMin)+' over free time', detail:'Arrived '+fmtTime(cur.arrived)+' · '+cur.name, action:'open'});
    }
    // 6. tracking
    if(drv && l.status!=='scheduled'){
      if(trk && trk.eld==='offline') ex.push({sev:'danger', code:'tracking', title:'ELD offline · last position '+fmtDur(drv.gps.ageMin)+' ago', detail:drv.gps.city+', '+drv.gps.st+' · '+drv.gps.road, action:'open'});
      else if(drv.gps.ageMin > 30) ex.push({sev:'warning', code:'tracking', title:'No GPS update for '+fmtDur(drv.gps.ageMin), detail:'Last: '+drv.gps.city+', '+drv.gps.st+' · '+drv.gps.road, action:'open'});
      if(drv.gps.stoppedMin && !cur && l.status==='in_transit') ex.push({sev:'warning', code:'tracking', title:'Truck stopped '+fmtDur(drv.gps.stoppedMin)+' · no scheduled stop', detail:drv.gps.city+', '+drv.gps.st+' · '+drv.gps.road, action:'open'});
    }
    // 6b. heavy deadhead — margin risk (industry target < 10%)
    if(l.miles.deadhead){ const r=dhPct(l.miles.loaded,l.miles.deadhead); if(r>0.25) ex.push({sev:'warning', code:'deadhead', title:'High deadhead · '+l.miles.deadhead+' mi empty ('+Math.round(r*100)+'%)', detail:'≈ '+money(Math.round(l.miles.deadhead*COST_PER_MILE))+' empty-mile cost · look for a closer driver or a backhaul', action:'open'}); }
    // 6c. permits for special hauls

      const ps=permitSummary(l);
      if(ps && ps.need>0) ex.push({sev:'danger', code:'permit', title:'Permit missing · '+haulTypesOf(l).map(t=>HAUL_TYPES[t]).join(' + ')+' · '+ps.need+' state'+(ps.need>1?'s':''), detail:(l.permits.filter(p=>p.status==='needed'||p.status==='expired').map(p=>p.state).join(', '))+' — order or upload before dispatch', action:'permits'});
      else if(ps && ps.req>0) ex.push({sev:'warning', code:'permit', title:'Permit pending · '+ps.req+' request'+(ps.req>1?'s':'')+' in progress', detail:l.permits.filter(p=>p.status==='requested').map(p=>p.state).join(', ')+' · ready in '+(l.permits.find(p=>p.eta)?l.permits.find(p=>p.eta).eta:'a few hours'), action:'permits'});
      // active permits: check the driver stays on the approved route + inside the travel window
      if(l.driverId && l.status!=='scheduled' && l.status!=='delivered'){
        const off=offRouteMiles(l);
        if(off!=null && off>25) ex.push({sev:'danger', code:'permit_route', title:'Off the permitted route · '+off+' mi from the approved corridor', detail:'Oversize loads must follow the permit route exactly — call the driver', action:'permits'});
        const win=travelWindowOf(l);
        if(win && !win.ok) ex.push({sev:'danger', code:'permit_time', title:'Moving outside the permitted hours', detail:win.why.join(' · '), action:'permits'});
      }
    }
    // 7. documents needed before dispatch
    if(l.docs.rc==='missing') ex.push({sev:'warning', code:'docs', title:'Rate confirmation missing', detail:'Request it from '+l.customer.name, action:'docs'});
    // 8. profile alerts (driver / truck / trailer modules)
    [['Driver',drv],['Truck',trk],['Trailer',trl]].forEach(([lbl,ent])=>{ if(ent) ent.alerts.forEach(a=> ex.push({sev:a.sev, code:'entity_alert', title:lbl+': '+a.text, detail:'From '+a.module+(ent.unit?' · '+ent.unit:''), action:'profile', module:a.module})); });
    if(trk && trk.status==='shop') ex.push({sev:'danger', code:'entity_alert', title:'Truck '+trk.unit+' is in the shop', detail:'From Services', action:'profile'});
    // 9. double booking
    if(drv){
      const others = driverActiveLoads(drv.id).filter(o=>o.id!==l.id);
      others.forEach(o=>{
        const oEnd = apptDeadline(o.stops[o.stops.length-1].appt), lStart = l.stops[0].appt.start;
        const lEnd = apptDeadline(l.stops[l.stops.length-1].appt), oStart = o.stops[0].appt.start;
        if(oStart < lEnd && lStart < oEnd) ex.push({sev:'danger', code:'conflict', title:'Driver also on load '+o.id+' ('+STATUS_LABEL[o.status]+')', detail:o.stops[0].city+' → '+o.stops[o.stops.length-1].city+' · overlapping windows', action:'open'});

  }

  ex.sort((a,b)=> SEV_RANK[b.sev]-SEV_RANK[a.sev]);
  let sev = ex.length ? ex[0].sev : 'success';
  if(!ex.length && l.status==='scheduled' && (l.stops[0].appt.start - NOW)/3600000 > 24) sev = 'info';
  if(!ex.length && !isActive(l)) sev = 'success';
  const top = ex[0] || (sev==='info' ? {sev:'info', code:'none', title:'Not started · pickup '+fmtDayTime(l.stops[0].appt.start), detail:''} : {sev:'success', code:'none', title: l.status==='delivered' ? 'Delivered · ready for billing' : (l.status==='cancelled' ? 'Cancelled' : 'On track'), detail: next && eta ? 'ETA '+fmtShort(eta)+' at '+next.city : ''});

  const dh = l.miles.deadhead, dhRatio = dhPct(l.miles.loaded, dh), dhCost = Math.round(dh*COST_PER_MILE);
  const rpmLoaded = fin.gross/Math.max(1,l.miles.loaded), rpmAllIn = fin.gross/Math.max(1,totalMiles);
  const dhSev = dhRatio>0.20?'danger':(dhRatio>DH_TARGET?'warning':'success');

  return {drv, trk, trl, next, cur, ex, sev, top, distToNext, travelMin, eta, dwellMin, rpm: fin.rpm, gross: fin.gross, fin, totalMiles, dh, dhRatio, dhCost, dhSev, rpmLoaded, rpmAllIn, special, permit, permitSev};
}

/* ============================================================
   SEARCH (punctuation-insensitive, two-tier) + FILTER PIPELINE
   ============================================================ */
function norm(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,''); }
function matches(query, hay){ const q=norm(query); if(!q) return true; const h=norm(hay); if(h.includes(q)) return true; const tokens=query.toLowerCase().split(/\s+/).filter(Boolean).map(norm); return tokens.length>1 && tokens.every(t=>h.includes(t)); }
function loadHaystack(l, d){
  const parts=[l.id, l.customer.name, l.refs.rc, l.refs.po, l.commodity, l.equipment, STATUS_LABEL[l.status], SOURCE_LABEL[l.source], DSP[l.dispatcherId]?.name, d.drv?.name, d.trk?.unit, d.trl?.unit, ...l.stops.map(s=>s.city+' '+s.st+' '+s.name), ...l.tags];
  return parts.join(' ');
}
function inRange(d, from, to){ if(!d) return false; if(from && d < from) return false; if(to){ const t=new Date(to); t.setHours(23,59,59); if(d > t) return false; } return true; }
function presetRange(p){
  const s=new Date(TODAY);
  if(p==='today') return [s, s];
  if(p==='tomorrow'){ const t=new Date(TODAY); t.setDate(t.getDate()+1); return [t,t]; }
  if(p==='next3'){ const t=new Date(TODAY); t.setDate(t.getDate()+2); return [s,t]; }
  if(p==='week'){ const t=new Date(TODAY); t.setDate(t.getDate()+(7-t.getDay())); return [s,t]; }

}
function passesFilters(l, d){
  const f=state.filters;
  if(f.status.size && !f.status.has(l.status)) return false;
  if(f.attention.size && !f.attention.has(d.sev)) return false;
  if(f.dispatcher.size && !f.dispatcher.has(l.dispatcherId)) return false;
  if(f.customer.size && !f.customer.has(l.customer.name)) return false;
  if(f.source.size && !f.source.has(l.source)) return false;
  if(f.equipment.size && !f.equipment.has(l.equipment)) return false;
  if(f.exception.size && !d.ex.some(e=>f.exception.has(e.code))) return false;
  if(f.docs.size && ![...f.docs].some(k=> l.docs[k]==='missing' || l.docs[k]==='awaiting_upload' || (k==='pod' && l.status==='delivered' && l.docs.pod!=='on_file'))) return false;
  if(f.needsOnly && d.sev!=='danger' && d.sev!=='warning') return false;
  if(f.pickupPreset || f.pickupFrom || f.pickupTo){ const [a,b] = f.pickupPreset ? presetRange(f.pickupPreset) : [f.pickupFrom, f.pickupTo]; if(!inRange(l.stops[0].appt.start, a, b)) return false; }
  if(f.deliveryPreset || f.deliveryFrom || f.deliveryTo){ const [a,b] = f.deliveryPreset ? presetRange(f.deliveryPreset) : [f.deliveryFrom, f.deliveryTo]; if(!inRange(l.stops[l.stops.length-1].appt.start, a, b)) return false; }

}
function passesKpi(l, d){
  const k=state.kpi; if(!k) return true;
  if(k==='needs') return d.sev==='danger';
  if(k==='risk') return d.sev==='warning';
  if(k==='unassigned') return l.status==='unassigned';
  if(k==='at_pickup') return l.status==='at_pickup';
  if(k==='in_transit') return l.status==='in_transit';
  if(k==='at_delivery') return l.status==='at_delivery';
  if(k==='docs') return d.ex.some(e=>e.code==='docs' && e.sev!=='info');
  if(k==='dh') return d.dhRatio > DH_TARGET;
  if(k==='permit') return d.special && d.permitSev!=='success';
  if(k==='delivered') return l.status==='delivered';
  if(k==='today_pu') return inRange(l.stops[0].appt.start, TODAY, TODAY) && isActive(l);
  return true;
}
function baseScope(){
  // The workspace shows active loads; delivered loads stay visible for 24 h (POD / billing follow-up), cancelled ones only via the Status filter.
  return LOADS.filter(l=>{
    if(l.status==='cancelled') return state.filters.status.has('cancelled');
    if(l.status==='delivered') return state.kpi==='delivered' || state.filters.status.has('delivered') || state.filters.docs.size>0 || state.viewId==='pod' || (NOW - l.stops[l.stops.length-1].departed) < 24*3600000;
    return true;
  });
}
function buildRows(){
  let rows = baseScope().map(l=>({l, d:deriveLoad(l)}));
  rows = rows.filter(r=> passesKpi(r.l,r.d) && passesFilters(r.l,r.d) && matches(state.search, loadHaystack(r.l,r.d)));
  const key=state.sortKey, dir=state.sortDir;
  const val = (r)=>{
    const l=r.l, d=r.d;
    switch(key){
      case 'attention': return SEV_RANK[d.sev]*1e13 + (d.next ? (1e13 - apptDeadline(d.next.appt).getTime()) : 0);
      case 'load': return Number(l.id);
      case 'status': return STATUS_ORDER.indexOf(l.status);
      case 'customer': return l.customer.name;
      case 'pickup': return l.stops[0].appt.start.getTime();
      case 'delivery': return l.stops[l.stops.length-1].appt.start.getTime();
      case 'driver': return d.drv ? d.drv.name : 'zzz';
      case 'unit': return d.trk ? Number(d.trk.unit) : 99999;
      case 'eta': return d.eta ? d.eta.getTime() : 9e15;
      case 'hos': return d.drv ? d.drv.hos.drive : 9999;
      case 'miles': return d.totalMiles;
      case 'rate': return l.rate;
      case 'docs': return Object.values(l.docs).filter(v=>v==='missing'||v==='awaiting_upload').length;
      case 'updated': return l.updated.getTime();
      case 'dispatcher': return DSP[l.dispatcherId]?.name || '';
      case 'equipment': return l.equipment;
      case 'commodity': return l.commodity;
      case 'weight': return l.weight;
      case 'deadhead': return l.miles.deadhead;
      case 'permit': return (r=>r&&r.special?({danger:0,warning:1,success:2}[r.permitSev]):3)(deriveLoad(l));
      case 'dhpct': return d.dhRatio;
      case 'distToPu': return d.distToNext==null ? 99999 : d.distToNext;
      case 'source': return SOURCE_LABEL[l.source];
      default: return (l.customFields && l.customFields[key]) || '';
    }
  };
  rows.sort((a,b)=>{ const va=val(a), vb=val(b); if(va<vb) return -1*dir; if(va>vb) return 1*dir; return Number(a.l.id)-Number(b.l.id); });
  return rows;
}
function groupKeyOf(r){
  const g=state.groupBy; const l=r.l, d=r.d;

  if(g==='dispatcher') return DSP[l.dispatcherId]?.name || '—';

}

function serializeFilters(){ const f=state.filters; const o={}; Object.keys(f).forEach(k=>{ o[k] = f[k] instanceof Set ? [...f[k]].sort() : (f[k] instanceof Date ? f[k].toISOString() : f[k]); }); o._kpi=state.kpi; o._sort=state.sortKey+':'+state.sortDir; o._group=state.groupBy; return JSON.stringify(o); }

/* ============================================================
   SMART ASSIGNMENT — candidate ranking (design for the future engine, 03 §D)
   ============================================================ */
function rankCandidates(l){
  const pu = l.stops[0];
  const lEnd = apptDeadline(l.stops[l.stops.length-1].appt);
  const need = roadMiles({lat:pu.lat,lng:pu.lng}, l.stops[l.stops.length-1]);  // loaded miles estimate (for HOS check)
  return DRIVERS.filter(dr=>dr.truckId).map(dr=>{
    const trk=TRK[dr.truckId], trl=dr.trailerId?TRL[dr.trailerId]:null;
    const dist=roadMiles(dr.gps, pu); const travel=dist/AVG_MPH*60+20; const eta=new Date(NOW.getTime()+travel*60000);
    const dl=apptDeadline(pu.appt); const onTime = eta <= dl;
    const others=driverActiveLoads(dr.id).filter(o=>o.id!==l.id);
    const busy=others.filter(o=> o.stops[0].appt.start < lEnd && pu.appt.start < apptDeadline(o.stops[o.stops.length-1].appt));
    const equipOK = !trl ? false : (l.equipment==='Dry van' ? trl.type==='Dry van' : trl.type===l.equipment);
    const hosDrive = dr.hos.drive >= travel + Math.min(need/AVG_MPH*60, 120);   // can at least reach pickup + 2h loaded
    const hosShift = dr.hos.shift >= travel + 60;
    const dAlerts = dr.alerts.filter(a=>a.sev==='danger').length + (trk.status==='shop'?1:0) + trk.alerts.filter(a=>a.sev==='danger').length;
    const wAlerts = dr.alerts.filter(a=>a.sev==='warning').length + trk.alerts.filter(a=>a.sev==='warning').length + (trl?trl.alerts.length:0);
    const dhCost=Math.round(dist*COST_PER_MILE);
    const facts=[
      {ok:dist<=100, cls:dist>150?'bad':(dist>100?'warn':'ok'), text:dist+' mi deadhead to pickup · ≈ '+money(dhCost)+' empty · ETA '+fmtShort(eta)},
      {ok:onTime, cls:onTime?'ok':'bad', text: onTime ? 'Arrives '+fmtDur((dl-eta)/60000)+' before deadline' : 'Misses appointment by '+fmtDur((eta-dl)/60000)},
      {ok:hosDrive&&hosShift, cls:(hosDrive&&hosShift)?'ok':'bad', text:fmtDur(dr.hos.drive)+' drive · '+fmtDur(dr.hos.shift)+' shift · '+fmtDur(dr.hos.cycle)+' cycle'},
      {ok:equipOK, cls:equipOK?'ok':'bad', text: trl ? trl.type+' '+trl.unit+(equipOK?' — compatible':' — needs '+l.equipment) : 'No trailer attached'},
      {ok:!busy.length, cls:busy.length?'bad':'ok', text: busy.length ? 'On load '+busy[0].id+' until '+fmtShort(apptDeadline(busy[0].stops[busy[0].stops.length-1].appt)) : (others.length ? 'Free after load '+others[0].id : 'No active load')},
      {ok:!dAlerts, cls:dAlerts?'bad':(wAlerts?'warn':'ok'), text: dAlerts ? dAlerts+' blocking alert'+(dAlerts>1?'s':'') : (wAlerts ? wAlerts+' warning'+(wAlerts>1?'s':'')+' (see profile)' : 'No active alerts')}
    ];
    const score = dist*1.2 + travel + (onTime?0:900) + ((hosDrive&&hosShift)?0:700) + (equipOK?0:800) + busy.length*1000 + dAlerts*1500 + wAlerts*120;
    return {dr, trk, trl, dist, dhCost, eta, facts, score, feasible: onTime && hosDrive && hosShift && equipOK && !busy.length && !dAlerts};
  }).sort((a,b)=>a.score-b.score);
}

   MUTATIONS (with activity log)
   ============================================================ */
function logAct(l, text, by){ l.activity.unshift({text, by:by||CURRENT_USER.name, at:NOW}); l.updated=NOW; }
function assignLoad(l, driverId, note){
  const dr=DRV[driverId]; const wasDriver=l.driverId;
  l.driverId=driverId; l.truckId=dr.truckId; l.trailerId=dr.trailerId;
  if(l.status==='unassigned') l.status='scheduled';
  logAct(l, (wasDriver?'Reassigned to ':'Dispatched to ')+dr.name+' / Truck '+TRK[dr.truckId].unit+(note?' — '+note:''));
  l.messages.push({from:'system', text:'Dispatch sent to '+dr.name+' (app push + SMS). PTI task created for Truck '+TRK[dr.truckId].unit+'.', at:NOW});
}
function unassignLoad(l, reason){
  const dr=DRV[l.driverId];
  logAct(l, 'Unassigned from '+(dr?dr.name:'driver')+' — '+reason);
  l.driverId=null; l.truckId=null; l.trailerId=null; l.status='unassigned';
}
function setStatus(l, status, note){
  const prev=l.status; l.status=status;
  const next=nextStopOf(l);
  if(status==='at_pickup'||status==='at_delivery'){ if(next && !next.arrived) next.arrived=NOW; }
  if(status==='in_transit'){ const cur=currentStopOf(l); if(cur) cur.departed=NOW; }
  if(status==='delivered'){ l.stops.forEach(s=>{ if(!s.arrived) s.arrived=NOW; if(!s.departed) s.departed=NOW; }); if(l.docs.pod==='na') l.docs.pod='awaiting_upload'; }
  logAct(l, 'Status changed '+STATUS_LABEL[prev]+' → '+STATUS_LABEL[status]+(note?' — '+note:''));
}

}
function wireOmnisearch(box){
  const input = box.querySelector('input');
  const clear = el('<span class="search-clear-btn" style="display:none">'+iconHTML('close',16)+'</span>');
  box.appendChild(clear);
  let menu=null;
  function close(){ if(menu){ menu.remove(); menu=null; } }
  function paint(){
    close(); const q=input.value; clear.style.display = q ? 'flex' : 'none';
    if(!q.trim()) return;
    menu = el('<div class="flyout omni-flyout"></div>');
    const groups = omniResults(q);
    if(!groups.length) menu.appendChild(el('<div class="no-options-hint" style="padding:10px 8px;">No results for "'+esc(q)+'"</div>'));
    groups.forEach(g=>{
      menu.appendChild(el('<div class="omni-group">'+g.name+' · '+g.items.length+'</div>'));
      g.items.forEach(it=>{ const row = el('<div class="omni-row">'+iconHTML(it.icon,18,'color:var(--text400);')+'<span>'+esc(it.label)+'</span><span class="sub">'+esc(it.sub)+'</span></div>'); row.onclick=()=>{ close(); input.value=''; clear.style.display='none'; it.go(); }; menu.appendChild(row); });
    });
    positionFlyout(menu, box);
  }
  input.oninput = paint;
  input.onkeydown = (e)=>{ if(e.key==='Enter'){ const g=omniResults(input.value); if(g.length){ const it=g[0].items[0]; close(); input.value=''; clear.style.display='none'; it.go(); } } else if(e.key==='Escape'){ close(); input.blur(); } };
  clear.onclick = ()=>{ input.value=''; clear.style.display='none'; close(); input.focus(); };
  document.addEventListener('click', (ev)=>{ if(menu && !menu.contains(ev.target) && !box.contains(ev.target)) close(); });
}

/* KPI strip — reused .week-summary from TL-OPS-01-02, items are filters */
function renderKpiStrip(){
  const scope = LOADS.filter(l=>l.status!=='cancelled').map(l=>({l, d:deriveLoad(l)}));
  const act = scope.filter(r=>isActive(r.l));
  const n = (fn)=>scope.filter(fn).length;
  const items = [
    {key:null, label:'ACTIVE LOADS', value:act.length},
    {key:'needs', label:'NEEDS ACTION', value:n(r=>isActive(r.l)&&r.d.sev==='danger'), cls:'danger'},
    {key:'risk', label:'AT RISK', value:n(r=>isActive(r.l)&&r.d.sev==='warning'), cls:'warn'},
    {key:'unassigned', label:'UNASSIGNED', value:n(r=>r.l.status==='unassigned'), cls:'warn'},
    {key:'today_pu', label:'PICKUPS TODAY', value:n(r=>isActive(r.l)&&inRange(r.l.stops[0].appt.start,TODAY,TODAY))},
    {key:'at_pickup', label:'AT PICKUP', value:n(r=>r.l.status==='at_pickup')},
    {key:'in_transit', label:'IN TRANSIT', value:n(r=>r.l.status==='in_transit')},
    {key:'at_delivery', label:'AT DELIVERY', value:n(r=>r.l.status==='at_delivery')},
    {key:'docs', label:'MISSING DOCS', value:n(r=>r.d.ex.some(e=>e.code==='docs'&&e.sev!=='info')), cls:'warn'},
    {key:'delivered', label:'DELIVERED 24H', value:n(r=>r.l.status==='delivered')},
    {key:'permit', label:'PERMITS', value:scope.filter(r=>r.d.special).length, cls:scope.some(r=>r.d.special&&r.d.permitSev==='danger')?'danger':(scope.some(r=>r.d.special&&r.d.permitSev==='warning')?'warn':'')},
    {key:'dh', label:'DEADHEAD', value:(()=>{ const L=act.reduce((s,r)=>s+r.l.miles.loaded,0), H=act.reduce((s,r)=>s+r.l.miles.deadhead,0); return (L+H)? Math.round(H/(L+H)*100)+'%':'0%'; })(), cls:(()=>{ const L=act.reduce((s,r)=>s+r.l.miles.loaded,0), H=act.reduce((s,r)=>s+r.l.miles.deadhead,0); const r=(L+H)?H/(L+H):0; return r>0.20?'danger':(r>0.10?'warn':''); })()},
    {key:null, label:'GROSS ON BOARD', value:money(act.reduce((s,r)=>s+r.d.gross,0))}
  ];
  const strip = el('<div class="week-summary"></div>');
  items.forEach(it=>{
    const zero = it.value===0;
    const node = el('<div class="ws-item'+(it.key?' clickable':'')+(it.key&&state.kpi===it.key?' active':'')+'"><span class="ws-label">'+it.label+'</span><span class="ws-value '+(it.cls&&!zero?it.cls:'')+'">'+it.value+'</span></div>');
    if(it.key) node.onclick=()=>{ state.kpi = state.kpi===it.key ? null : it.key; state.page=1; render(); };
    strip.appendChild(node);
  });
  return strip;
}

/* ============================================================
   TABLE — one <table>, sticky header, frozen Load # (left) + actions (right)
   ============================================================ */
function sevDotHtml(sev){ return '<span class="sev-dot '+sev+'"></span>'; }
function hosBar(label, val, max){ const pct=Math.max(0,Math.min(100,val/max*100)); const cls = val<60?'danger':(val<180?'warn':''); return '<div class="hos-row"><span class="hos-lbl">'+label+'</span><b>'+fmtDur(val)+'</b><span class="hos-bar"><i class="'+cls+'" style="width:'+pct+'%"></i></span></div>'; }
function stopCellHtml(s, l, d){
  const done = !!s.departed; const here = s.arrived && !s.departed;
  const isNext = d.next===s && !s.arrived;
  const dl=apptDeadline(s.appt); const late = isNext && NOW>dl && isActive(l);
  const tag = done ? '<span class="appt-tag done">DONE</span>' : (here ? '<span class="appt-tag done">ON SITE</span>' : '<span class="appt-tag '+(s.appt.type==='hard'?'hard':'')+'">'+apptLabel(s.appt)+'</span>');
  return '<div class="cell-primary">'+esc(s.city)+', '+s.st+'</div><div class="cell-meta stop-line"><b style="'+(late?'color:var(--danger-t)':'')+'">'+(done?'Left '+fmtShort(s.departed):(here?'Arrived '+fmtShort(s.arrived):apptText(s.appt)))+'</b>'+tag+'</div>';
}
function cellHtml(col, l, d){
  const c = col.key;
  if(c==='load'){
    const prio = l.priority==='hot' ? '<span class="prio" title="Hot load">'+iconHTML('local_fire_department',15)+'</span>' : (l.priority==='high' ? '<span class="prio high" title="High priority">'+iconHTML('priority_high',15)+'</span>' : '');
    return '<div class="load-cell"><div style="min-width:0"><div class="load-num" data-act="open">'+l.id+'</div><div class="cell-meta">'+(l.source!=='internal'?'<span class="src-pill '+l.source+'">'+SOURCE_LABEL[l.source]+'</span> ':'')+esc(l.refs.po||l.refs.rc||'')+'</div></div>'+prio+'</div>';
  }
  if(c==='attention'){
    const more = d.ex.length>1 ? '<span class="att-more">+'+(d.ex.length-1)+' more</span>' : '';
    return '<div class="att-cell" data-act="attention">'+sevDotHtml(d.sev)+'<div class="att-body"><div class="att-title '+d.sev+'">'+esc(d.top.title)+'</div><div class="cell-meta">'+esc(d.top.detail)+(more?' '+more:'')+'</div></div></div>';
  }
  if(c==='status') return '<span class="status-pill '+l.status+' clickable" data-act="status">'+STATUS_LABEL[l.status]+'</span>';
  if(c==='customer') return '<div class="cell-primary">'+esc(l.customer.name)+'</div><div class="cell-meta">'+(l.customer.mc||'Shipper')+' · '+esc(l.refs.rc||l.refs.po)+'</div>';
  if(c==='pickup') return stopCellHtml(l.stops[0], l, d);
  if(c==='delivery'){ const last=l.stops[l.stops.length-1]; const extra = l.stops.length>2 ? ' <span class="appt-tag">+'+(l.stops.length-2)+' STOP'+(l.stops.length>3?'S':'')+'</span>' : ''; return stopCellHtml(last, l, d).replace('</div><div class="cell-meta', extra+'</div><div class="cell-meta'); }
  if(c==='driver'){
    if(!d.drv) return '<div class="drv-cell"><span class="empty-slot">No driver</span><button class="link-btn" data-act="assign">'+iconHTML('person_add',14)+'Assign</button></div>';
    return '<div class="drv-cell"><span class="ent-avatar">'+initials(d.drv.name)+'</span><div style="min-width:0"><div class="cell-primary ent-link" data-act="driver">'+esc(d.drv.name)+'</div><div class="cell-meta">'+dutyLabel(d.drv.duty)+' · '+esc(DSP[l.dispatcherId].name)+'</div></div></div>';
  }
  if(c==='unit'){ if(!d.trk) return '<span class="empty-slot">—</span>'; return '<div class="cell-primary ent-link" data-act="truck">'+iconHTML('local_shipping',14,'color:var(--text400);margin-right:3px;')+d.trk.unit+'</div><div class="cell-meta">'+(d.trl?iconHTML('rv_hookup',13,'color:var(--text400);margin-right:3px;')+d.trl.unit+' · '+d.trl.type:'No trailer')+'</div>'; }
  if(c==='position'){
    if(!d.drv) return '<span class="empty-slot">—</span>';
    const g=d.drv.gps; const dotCls = d.trk&&d.trk.eld==='offline' ? 'off' : (g.ageMin>30 ? 'stale' : (g.speed===0 ? 'idle' : ''));
    return '<div class="cell-primary"><span class="live-dot '+dotCls+'"></span>'+esc(g.city)+', '+g.st+'</div><div class="cell-meta">'+esc(g.road)+' · '+(g.speed?g.speed+' mph':'stopped')+' · '+(g.ageMin<60? g.ageMin+' min':fmtDur(g.ageMin))+' ago</div>';
  }
  if(c==='eta'){
    if(!d.next || !isActive(l)) return '<span class="empty-slot">—</span>';
    if(d.cur) return '<div class="cell-primary">At '+d.cur.kind+'</div><div class="cell-meta">'+fmtDur(d.dwellMin)+' on site</div>';
    if(!d.eta) return '<div class="cell-primary" style="color:var(--text400)">Needs driver</div><div class="cell-meta">'+apptText(d.next.appt)+'</div>';
    const dl=apptDeadline(d.next.appt); const buf=(dl-d.eta)/60000;
    return '<div class="cell-primary" style="'+(buf<0?'color:var(--danger-t)':(buf<30?'color:var(--warning-t)':''))+'">'+fmtShort(d.eta)+'</div><div class="cell-meta">'+d.distToNext+' mi to '+d.next.kind+' · '+(buf<0?fmtDur(-buf)+' late':fmtDur(buf)+' buffer')+'</div>';
  }

function toggleSelect(id, idx, shift, pageRows){

function attachAlertTooltip(target, exFn){
  let tip=null;
  target.addEventListener('mouseenter', ()=>{
    if(document.body.classList.contains('dragging')||document.body.classList.contains('resizing')) return;
    const ex = exFn(); if(!ex.length) return;
    tip = el('<div class="alert-tip">'+ex.map(e=>'<div class="tip-row">'+sevDotHtml(e.sev)+'<div><div>'+esc(e.title)+'</div>'+(e.detail?'<div class="tip-sub">'+esc(e.detail)+'</div>':'')+'</div></div>').join('')+'</div>');
    document.body.appendChild(tip); tip.style.zoom=currentAppScale;
    const z=currentAppScale||1; const r=target.getBoundingClientRect(); const w=tip.getBoundingClientRect().width/z;
    let left=r.left/z; if(left + w > window.innerWidth/z-8) left=window.innerWidth/z-w-8;
    tip.style.left=left+'px'; tip.style.top=(r.bottom/z+6)+'px';
  });

}

function positionFlyout(menu, anchor){
  // Viewport px in, zoomed-space px out: the flyout lives inside #app (inherits the zoom), so every
  // fixed offset it receives is multiplied by currentAppScale by the browser. Measure in viewport px
  // (getBoundingClientRect), clamp in viewport px, then divide before writing top/left.
  menu.style.position='fixed'; menu.style.visibility='hidden';
  app.appendChild(menu);
  const z = currentAppScale || 1;
  const anchorRect = anchor.getBoundingClientRect(); const menuRect = menu.getBoundingClientRect();
  let top = anchorRect.bottom + 6; let left = anchorRect.left;
  if(left + menuRect.width > window.innerWidth - 8) left = window.innerWidth - menuRect.width - 8;
  if(left < 8) left = 8;
  if(top + menuRect.height > window.innerHeight - 8) top = anchorRect.top - menuRect.height - 6;
  if(top < 8) top = 8;
  menu.style.top = (top/z)+'px'; menu.style.left = (left/z)+'px'; menu.style.visibility='visible';
}
function createBrandedSelect(options, currentValue, onChange){
  const el_ = el('<button type="button" class="branded-select"></button>');
  let value = (currentValue && options.some(o=>o.value===currentValue)) ? currentValue : (options[0]?.value ?? '');
  function currentLabel(){ const o = options.find(o=>o.value===value); return o ? o.label : (options[0]?.placeholder || 'Select...'); }
  function paint(){ el_.innerHTML = '<span class="bs-current">'+esc(currentLabel())+'</span>'+iconHTML('expand_more',16); }
  paint();
  el_.onclick = (e)=>{
    e.preventDefault(); e.stopPropagation();
    document.querySelectorAll('.flyout').forEach(m=>m.remove());
    const menu = el('<div class="flyout branded-select-menu"></div>');
    options.forEach(opt=>{
      const active = opt.value === value;
      const item = el('<button type="button" class="bs-option'+(active?' active':'')+(opt.emphasis?' emphasis':'')+'">'+(active?iconHTML('check',15):'<span class="bs-check-spacer" style="width:15px;display:inline-block"></span>')+'<span>'+esc(opt.label)+'</span></button>');
      item.onclick = ()=>{ value = opt.value; paint(); menu.remove(); if(onChange) onChange(value); };
      menu.appendChild(item);
    });
    menu.style.width = Math.max(180, el_.getBoundingClientRect().width) + 'px';
    positionFlyout(menu, el_);
    setTimeout(()=>{ document.addEventListener('click', function h(ev){ if(!menu.contains(ev.target) && ev.target!==el_){ menu.remove(); document.removeEventListener('click',h); } }); },0);
  };
  Object.defineProperty(el_, 'value', { get: ()=>value, set: (v)=>{ value=v; paint(); } });
  return el_;
}

function renderPagination(total){
  const perPage = state.perPage || total || 1;
  const totalPages = Math.max(1, Math.ceil(total/perPage));
  if(state.page>totalPages) state.page = totalPages;
  const start = total===0?0:(state.page-1)*perPage+1;
  const end = Math.min(state.page*perPage, total);
  const bar = el('<div class="pagination-bar"></div>');
  const left = el('<div class="page-size-group"><span class="psum">Showing '+start+'–'+end+' of '+total+'</span></div>');
  const sizeWrap = el('<label class="page-size-select"><span>Show</span></label>');
  const select = el('<select id="perPageSelect"></select>');
  PAGE_SIZE_OPTIONS.forEach(n=> select.appendChild(el('<option value="'+n+'" '+(n===state.perPage?'selected':'')+'>'+n+'</option>')));
  select.onchange = (e)=>{ state.perPage = Number(e.target.value); state.page = 1; render(); };
  sizeWrap.appendChild(select); sizeWrap.appendChild(el('<span>per page</span>')); left.appendChild(sizeWrap);
  bar.appendChild(left);
  const nav = el('<div class="pagenav"></div>');
  const prev = el('<button '+(state.page===1?'disabled':'')+'>'+iconHTML('chevron_left',16)+'</button>'); prev.onclick = ()=>{ state.page--; render(); }; nav.appendChild(prev);
  for(let i=1;i<=totalPages;i++){ const b = el('<button class="'+(i===state.page?'active':'')+'">'+i+'</button>'); b.onclick = ()=>{ state.page=i; render(); }; nav.appendChild(b); }
  const next = el('<button '+(state.page===totalPages?'disabled':'')+'>'+iconHTML('chevron_right',16)+'</button>'); next.onclick = ()=>{ state.page++; render(); }; nav.appendChild(next);
  bar.appendChild(nav);
  return bar;
}
