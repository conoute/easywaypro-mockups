}

/* ============================================================
   LOAD SIDE PANEL (DOC skeleton: scrim + panel on body, .zoom-sync, local tab + paint())
   ============================================================ */
function openLoadPanel(l, tab){
  document.querySelectorAll('.side-panel-scrim').forEach(n=>n.remove());
  document.querySelectorAll('.flyout').forEach(n=>n.remove());
  const scrim = document.createElement('div'); scrim.className='side-panel-scrim';
  const panel = document.createElement('div'); panel.className='side-panel zoom-sync';
  let activeTab = tab || 'overview';
  state.openLoadId = l.id; state.cursor = l.id;
  document.querySelectorAll('tr[data-id]').forEach(tr=>tr.classList.toggle('open', tr.dataset.id===l.id));
  function closePanel(){ scrim.classList.remove('open'); setTimeout(()=>scrim.remove(),200); openPanelRefresh=null; state.openLoadId=null; document.querySelectorAll('tr[data-id]').forEach(tr=>tr.classList.remove('open')); }
  scrim.onclick = (e)=>{ if(e.target===scrim) closePanel(); };
  document.addEventListener('keydown', function onEsc(e){ if(e.key==='Escape' && !state.modal){ closePanel(); document.removeEventListener('keydown', onEsc); } });

  function detailRow(label, valueHtml){ return '<div class="sp-detail-row"><span class="sp-detail-label">'+label+'</span><span class="sp-detail-value">'+valueHtml+'</span></div>'; }
  function banner(e){
    const act = e.action==='assign' ? '<button class="link-btn" data-a="assign">Assign</button>' : (e.action==='docs' ? '<button class="link-btn" data-a="docs">Documents</button>' : (e.action==='profile' ? '<button class="link-btn" data-a="profile">Open '+esc(e.module||'profile')+'</button>' : (e.action==='permits' ? '<button class="link-btn" data-a="permits">Permits</button>' : '')));
    return '<div class="sp-banner '+e.sev+'">'+iconHTML(e.sev==='danger'?'error':(e.sev==='warning'?'warning':'info'),18)+'<div><b>'+esc(e.title)+'</b>'+(e.detail?'<div style="font-weight:400">'+esc(e.detail)+'</div>':'')+'</div>'+act+'</div>';
  }
  function stopBlock(s, i, d){
    const done=!!s.departed, here=s.arrived&&!s.departed, isNext=d.next===s&&!s.arrived;
    const dl=apptDeadline(s.appt); const late = isNext && NOW>dl && isActive(l);
    let times = '<span>Appt <b>'+esc(apptText(s.appt))+'</b> <span class="appt-tag '+(s.appt.type==='hard'?'hard':'')+'">'+apptLabel(s.appt)+'</span></span>';
    if(isNext && d.eta) times += '<span'+(late||(dl-d.eta)<0?' class="late"':'')+'>ETA <b>'+fmtShort(d.eta)+'</b> · '+d.distToNext+' mi</span>';
    if(s.arrived) times += '<span>Arrived <b>'+fmtShort(s.arrived)+'</b></span>';
    if(s.departed) times += '<span>Departed <b>'+fmtShort(s.departed)+'</b></span>';
    if(here) times += '<span'+(d.dwellMin>s.freeMin?' class="late"':'')+'>On site <b>'+fmtDur(d.dwellMin)+'</b>'+(d.dwellMin>s.freeMin?' · detention '+fmtDur(d.dwellMin-s.freeMin):' · '+fmtDur(s.freeMin-d.dwellMin)+' free time left')+'</span>';
    const actions = isActive(l) ? '<div class="rs-actions">'+(!s.arrived&&l.driverId?'<button class="link-btn" data-a="arrive" data-i="'+i+'">Mark arrived</button>':'')+(here?'<button class="link-btn" data-a="depart" data-i="'+i+'">Mark departed</button>':'')+'<button class="link-btn" data-a="appt" data-i="'+i+'">Update appointment</button>'+(s.contact?'<button class="link-btn" data-a="call" data-i="'+i+'">'+iconHTML('call',13)+'Call '+esc(s.contact.split('·')[0].trim())+'</button>':'')+'</div>' : '';
    return '<div class="route-stop"><span class="rs-dot '+(done?'done':s.kind)+'"></span><div class="rs-body"><div class="rs-title">'+(s.kind==='pickup'?'Pickup':'Delivery')+' '+(i+1)+' · '+esc(s.name)+(here?'<span class="appt-tag done">ON SITE</span>':(done?'<span class="appt-tag done">DONE</span>':''))+'</div><div class="rs-meta">'+esc(s.addr)+', '+esc(s.city)+', '+s.st+(s.contact?' · '+esc(s.contact):'')+'</div>'+(s.notes?'<div class="rs-meta" style="color:var(--text400)">'+iconHTML('sticky_note_2',13)+' '+esc(s.notes)+'</div>':'')+'<div class="rs-times">'+times+'</div>'+actions+'</div></div>';
  }
  function hosFull(dr){ return '<div class="hos-cell" style="gap:5px">'+hosBar('D',dr.hos.drive,660)+hosBar('S',dr.hos.shift,840)+hosBar('C',dr.hos.cycle,4200)+'<div class="cell-meta">Break required in '+fmtDur(dr.hos.breakIn)+' · '+dutyLabel(dr.duty)+' · ELD '+(TRK[dr.truckId].eld==='online'?'online':'<span style="color:var(--danger-t)">offline</span>')+'</div></div>'; }

  function paint(){
    const d = deriveLoad(l);
    panel.innerHTML='';
    const dsp = DSP[l.dispatcherId];
    const header = el('<div class="sp-header"><div class="sp-head-row">'+sevDotHtml(d.sev)+'<div class="sp-header-text"><div class="sp-title">Load '+l.id+' <span class="status-pill '+l.status+'" style="margin-left:6px">'+STATUS_LABEL[l.status]+'</span>'+(l.priority!=='normal'?' <span class="prio'+(l.priority==='high'?' high':'')+'">'+iconHTML(l.priority==='hot'?'local_fire_department':'priority_high',15)+'</span>':'')+(l.source!=='internal'?' <span class="src-pill '+l.source+'">'+SOURCE_LABEL[l.source]+'</span>':'')+'</div><div class="sp-sub">'+esc(l.customer.name)+(l.customer.mc?' · '+l.customer.mc:'')+' · '+esc(l.refs.rc||l.refs.po)+' · Dispatcher '+esc(dsp.name)+'</div></div><span class="row-actions" data-a="menu">'+iconHTML('more_vert',18)+'</span><span class="row-actions" data-a="close">'+iconHTML('close',18)+'</span></div><div class="sp-kv"><div><div class="k">GROSS</div><div class="v" style="color:var(--accent-dark)">'+money(d.gross)+' <span style="color:var(--text400);font-weight:400">$'+d.rpm.toFixed(2)+'/mi'+(d.fin.inGross?' · line haul '+money(l.rate):'')+'</span></div></div><div><div class="k">ROUTE</div><div class="v">'+esc(l.stops[0].city)+', '+l.stops[0].st+' → '+esc(l.stops[l.stops.length-1].city)+', '+l.stops[l.stops.length-1].st+(l.stops.length>2?' · '+l.stops.length+' stops':'')+'</div></div><div><div class="k">EQUIPMENT</div><div class="v">'+esc(l.equipment)+(l.temp?' '+l.temp:'')+' · '+l.weight.toLocaleString('en-US')+' lb</div></div></div></div>');
    header.querySelector('[data-a="close"]').onclick=closePanel;
    header.querySelector('[data-a="menu"]').onclick=(e)=>{ e.stopPropagation(); openRowFlyout(e.currentTarget, l); };
    panel.appendChild(header);
    const tabs = [['overview','Overview'],['stops','Stops'],['financial','Financial']].concat(d.special?[['permits','Permits']]:[]).concat([['documents','Documents'],['messages','Messages'],['activity','Activity']]);
    const tabsBar = el('<div class="sp-tabs"></div>');
    tabs.forEach(([k,lbl])=>{ const badge = k==='messages' && l.messages.some(m=>m.from==='driver'&&(NOW-m.at)<3600000) ? ' ●' : (k==='documents' && Object.values(l.docs).some(v=>v==='missing'||v==='awaiting_upload') ? ' !' : (k==='permits' && d.permitSev==='danger' ? ' !' : (k==='permits' && d.permitSev==='warning' ? ' •' : ''))); const t=el('<div class="sp-tab'+(activeTab===k?' active':'')+'">'+lbl+badge+'</div>'); t.onclick=()=>{ activeTab=k; paint(); }; tabsBar.appendChild(t); });
    panel.appendChild(tabsBar);
    const body = el('<div class="sp-body"></div>');
    if(activeTab==='overview'){
      let h='';
      if(d.special){ const psev=d.permitSev; const label=haulTypesOf(l).map(t=>HAUL_TYPES[t]).join(' + '); h += '<div class="sp-banner '+(psev==='success'?'success':(psev==='warning'?'warning':'danger'))+'">'+iconHTML('straighten',18)+'<div><b>'+label+' load'+(psev==='success'?' · permits active, on route':(psev==='warning'?' · permits pending':' · permit / route issue'))+'</b><div style="font-weight:400">'+(d.permit?esc(d.permit.label):'')+'</div></div><button class="link-btn" data-a="permits">Open permits</button></div>'; }
      const shown = d.ex.length ? d.ex : [{sev:d.sev, title:d.top.title, detail:d.top.detail}];
      h += shown.filter(e=>e.code!=='permit'&&e.code!=='permit_route'&&e.code!=='permit_time').slice(0,4).map(banner).join('');
      h += '<div class="sp-section"><div class="sp-section-title">ROUTE</div><div class="route-list">'+l.stops.map((s,i)=>stopBlock(s,i,d)).join('')+'</div></div>';
      h += '<div class="sp-section"><div class="sp-section-title">DRIVER · TRUCK · TRAILER</div>';
      if(d.drv){
        const g=d.drv.gps;
        h += '<div class="ent-card"><div class="ent-card-head"><span class="ent-avatar">'+initials(d.drv.name)+'</span><div><div class="ent-card-name">'+esc(d.drv.name)+'</div><div class="ent-card-sub">'+d.drv.type+' · '+esc(d.drv.phone)+' · Truck '+d.trk.unit+' · '+(d.trl?d.trl.type+' '+d.trl.unit:'no trailer')+'</div></div><button class="link-btn" data-a="profile">Open profile</button></div>'+detailRow('Position','<span class="live-dot '+(d.trk.eld==='offline'?'off':(g.ageMin>30?'stale':(g.speed?'':'idle')))+'"></span>'+esc(g.city)+', '+g.st+' · '+esc(g.road)+' · '+(g.speed?g.speed+' mph':'stopped')+' · '+(g.ageMin<60?g.ageMin+' min':fmtDur(g.ageMin))+' ago')+(d.next&&d.eta?detailRow('Next stop', esc(d.next.city)+', '+d.next.st+' · '+d.distToNext+' mi · ETA '+fmtShort(d.eta)):'')+'<div style="margin-top:4px"><div class="sp-section-title" style="margin-bottom:6px">HOS · from ELD (Samsara), '+g.ageMin+' min ago</div>'+hosFull(d.drv)+'</div>'+(d.drv.alerts.length||d.trk.alerts.length||(d.trl&&d.trl.alerts.length)?'<div class="cell-meta" style="white-space:normal">'+[...d.drv.alerts.map(a=>'Driver: '+a.text),...d.trk.alerts.map(a=>'Truck: '+a.text),...(d.trl?d.trl.alerts.map(a=>'Trailer: '+a.text):[])].map(esc).join(' · ')+'</div>':'')+'<div class="rs-actions"><button class="link-btn" data-a="msg">'+iconHTML('sms',13)+'Message driver</button><button class="link-btn" data-a="call">'+iconHTML('call',13)+'Call</button><button class="link-btn" data-a="reassign">'+iconHTML('swap_horiz',13)+'Reassign</button><button class="link-btn" data-a="unassign" style="color:var(--danger)">'+iconHTML('person_remove',13)+'Unassign</button></div></div>';
      } else {
        h += '<div class="ent-card" style="border-style:dashed"><div class="ent-card-head"><span class="ent-avatar" style="background:var(--bg50);color:var(--text400)">?</span><div><div class="ent-card-name" style="color:var(--text400)">No driver assigned</div><div class="ent-card-sub">Pickup '+esc(apptText(l.stops[0].appt))+' · '+esc(l.equipment)+' required</div></div><button class="link-btn" data-a="assign">'+iconHTML('person_add',13)+'Assign driver</button></div>';
        const best = rankCandidates(l)[0];
        if(best) h += '<div class="ai-line">'+iconHTML('auto_awesome',15)+'Best match: '+esc(best.dr.name)+' / Truck '+best.trk.unit+' — '+best.dist+' mi away, ETA '+fmtShort(best.eta)+(best.feasible?'':' (has conflicts)')+'</div>';
        h += '</div>';
      }
      h += '</div>';
      const fin = d.fin;
      h += '<div class="sp-section"><div class="sp-section-title" style="display:flex;align-items:center">FINANCIAL<span style="flex:1"></span><button class="link-btn" data-a="fin">Open financial</button></div><div class="fin-grid">'+detailRow('Line haul', money(l.rate))+detailRow('Loaded miles', l.miles.loaded.toLocaleString('en-US')+' mi')+detailRow('Accessorials in gross', fin.inGross?'+'+money(fin.inGross):'—')+detailRow('Deadhead', l.miles.deadhead+' mi')+detailRow('Pass-through', fin.pass?money(fin.pass):'—')+detailRow('Driver addons', fin.addons?'<span style="color:var(--purple)">'+money(fin.addons)+'</span>':'—')+'</div><div class="fin-total"><span>Gross'+'</span><span style="color:var(--accent-dark)">'+money(fin.gross)+' · $'+fin.rpm.toFixed(2)+'/mi</span></div></div>';
      body.innerHTML=h;
      body.querySelectorAll('[data-a="assign"],[data-a="reassign"]').forEach(b=>b.onclick=()=>openModal('assign',{loadId:l.id}));
      body.querySelectorAll('[data-a="unassign"]').forEach(b=>b.onclick=()=>openModal('unassign',{loadId:l.id}));
      body.querySelectorAll('[data-a="docs"]').forEach(b=>b.onclick=()=>{ activeTab='documents'; paint(); });
      body.querySelectorAll('[data-a="fin"]').forEach(b=>b.onclick=()=>{ activeTab='financial'; paint(); });
      body.querySelectorAll('[data-a="permits"]').forEach(b=>b.onclick=()=>{ activeTab='permits'; paint(); });
      body.querySelectorAll('[data-a="profile"]').forEach(b=>b.onclick=()=>openProfile('driver', d.drv||{name:''}));
      body.querySelectorAll('[data-a="msg"]').forEach(b=>b.onclick=()=>{ activeTab='messages'; paint(); });
      body.querySelectorAll('[data-a="call"]').forEach(b=>b.onclick=()=>showToast('Calling '+(d.drv?d.drv.name+' · '+d.drv.phone:'contact')+'…'));
      body.querySelectorAll('[data-a="arrive"]').forEach(b=>b.onclick=()=>{ const s=l.stops[Number(b.dataset.i)]; s.arrived=NOW; l.status = s.kind==='pickup'?'at_pickup':'at_delivery'; logAct(l,'Marked arrived at '+s.name); showToast('Arrived at '+s.city); render(); });
      body.querySelectorAll('[data-a="depart"]').forEach(b=>b.onclick=()=>{ const s=l.stops[Number(b.dataset.i)]; s.departed=NOW; const last=l.stops[l.stops.length-1]===s; l.status = last?'delivered':'in_transit'; if(last && l.docs.pod==='na') l.docs.pod='awaiting_upload'; logAct(l,'Marked departed from '+s.name+(last?' — delivered':'')); showToast(last?'Load '+l.id+' delivered — POD requested from driver':'Departed '+s.city); render(); });
      body.querySelectorAll('[data-a="appt"]').forEach(b=>b.onclick=()=>openModal('appointment',{loadId:l.id, stopIdx:Number(b.dataset.i)}));
    } else if(activeTab==='stops'){
      body.innerHTML = '<div class="sp-section"><div class="sp-section-title">'+l.stops.length+' STOPS · '+l.miles.loaded.toLocaleString('en-US')+' LOADED MI</div><div class="route-list">'+l.stops.map((s,i)=>stopBlock(s,i,d)).join('')+'</div></div><div class="sp-section"><button class="link-btn" data-a="addstop">'+iconHTML('add',14)+'Add stop</button></div>';
      body.querySelectorAll('[data-a="arrive"]').forEach(b=>b.onclick=()=>{ const s=l.stops[Number(b.dataset.i)]; s.arrived=NOW; l.status = s.kind==='pickup'?'at_pickup':'at_delivery'; logAct(l,'Marked arrived at '+s.name); render(); });
      body.querySelectorAll('[data-a="depart"]').forEach(b=>b.onclick=()=>{ const s=l.stops[Number(b.dataset.i)]; s.departed=NOW; const last=l.stops[l.stops.length-1]===s; l.status = last?'delivered':'in_transit'; if(last && l.docs.pod==='na') l.docs.pod='awaiting_upload'; logAct(l,'Marked departed from '+s.name); render(); });
      body.querySelectorAll('[data-a="appt"]').forEach(b=>b.onclick=()=>openModal('appointment',{loadId:l.id, stopIdx:Number(b.dataset.i)}));
      body.querySelectorAll('[data-a="call"]').forEach(b=>b.onclick=()=>showToast('Calling stop contact…'));
      body.querySelector('[data-a="addstop"]').onclick=()=>showToast('Add stop uses the same stop form as Add Load');
    } else if(activeTab==='documents'){
      const docs=[['rc','Rate confirmation','Required before dispatch'],['bol','Bill of lading','Uploaded at pickup'],['pod','Proof of delivery','Required for billing'],['lumper','Lumper receipt','If applicable'],['detention','Detention proof','Timestamps + BOL notes']];
      const lbl={on_file:'On file', missing:'Missing', awaiting_upload:'Awaiting upload', pending_approval:'Pending approval', na:'Not yet due'};
      body.innerHTML = '<div class="sp-section"><div class="sp-section-title">LOAD DOCUMENTS</div>'+docs.map(([k,name,hint])=>'<div class="doc-row">'+iconHTML(l.docs[k]==='on_file'?'task':'description',20,'color:'+(l.docs[k]==='on_file'?'var(--accent)':'var(--text400)'))+'<div style="flex:1"><div class="dr-name">'+name+'</div><div class="dr-meta">'+hint+'</div></div><span class="status-pill '+(l.docs[k]==='on_file'?'valid':(l.docs[k]==='missing'?'missing':(l.docs[k]==='na'?'na':l.docs[k])))+'">'+lbl[l.docs[k]]+'</span>'+(l.docs[k]==='on_file'?'<span class="row-actions" data-a="view" data-k="'+k+'">'+iconHTML('visibility',16)+'</span>':'<button class="link-btn" data-a="upload" data-k="'+k+'">Upload</button>'+(l.driverId&&(k==='bol'||k==='pod')?'<button class="link-btn" data-a="request" data-k="'+k+'">Request from driver</button>':''))+'</div>').join('')+'</div><div class="sp-section"><div class="sp-section-title">ACCESSORIALS</div><div class="cell-meta" style="white-space:normal">'+(l.accessorials.length?l.accessorials.map(a=>esc(a.name)+' '+money(a.amount)+(a.receipt?' · receipt':'')).join(' · '):'None on this load')+'</div><div style="margin-top:8px"><button class="link-btn" data-a="fin">'+iconHTML('calculate',14)+'Manage in Financial</button></div></div>';
      body.querySelectorAll('[data-a="fin"]').forEach(b=>b.onclick=()=>{ activeTab='financial'; paint(); });
      body.querySelectorAll('[data-a="permits"]').forEach(b=>b.onclick=()=>{ activeTab='permits'; paint(); });
      body.querySelectorAll('[data-a="upload"]').forEach(b=>b.onclick=()=>{ l.docs[b.dataset.k]='on_file'; logAct(l, docs.find(x=>x[0]===b.dataset.k)[1]+' uploaded'); showToast('Document uploaded'); render(); });
      body.querySelectorAll('[data-a="request"]').forEach(b=>b.onclick=()=>{ l.docs[b.dataset.k]='awaiting_upload'; l.messages.push({from:'dispatcher', text:'Please upload the '+(b.dataset.k==='pod'?'signed POD':'BOL')+' from the app.', at:NOW}); logAct(l,'Requested '+b.dataset.k.toUpperCase()+' from driver'); showToast('Request sent to '+DRV[l.driverId].name); render(); });
      body.querySelectorAll('[data-a="view"]').forEach(b=>b.onclick=()=>showToast('Preview opens in the lightbox'));
    } else if(activeTab==='financial'){
      renderFinancialTab(body, l, d, paint);
    } else if(activeTab==='permits'){
      renderPermitsTab(body, l, d, paint);
    } else if(activeTab==='messages'){
      const dr=d.drv;
      body.innerHTML = '<div class="sp-section"><div class="sp-section-title">'+(dr?'THREAD WITH '+esc(dr.name).toUpperCase()+' · LOAD '+l.id:'NO DRIVER ASSIGNED')+'</div><div class="msg-feed">'+(l.messages.length?l.messages.map(m=>'<div class="msg '+m.from+'">'+esc(m.text)+(m.from!=='system'?'<div class="msg-meta">'+(m.from==='driver'?esc(dr?dr.name:'Driver'):'You')+' · '+fmtShort(m.at)+'</div>':'')+'</div>').join(''):'<div class="no-options-hint">No messages on this load yet.</div>')+'</div>'+(dr?'<div class="sp-comment-input-row"><textarea id="msgInput" placeholder="Message '+esc(dr.name)+' (delivered in the driver app + SMS fallback)"></textarea><div style="display:flex;gap:8px;align-items:center"><button class="link-btn" data-a="tpl">'+iconHTML('bolt',13)+'Send ETA request</button><button class="link-btn" data-a="chat">'+iconHTML('chat',13)+'Open in Chat</button><span style="flex:1"></span><button class="btn primary" data-a="send">Send</button></div></div>':'')+'</div>';
      const send=()=>{ const ta=body.querySelector('#msgInput'); if(!ta||!ta.value.trim()) return; l.messages.push({from:'dispatcher', text:ta.value.trim(), at:NOW}); logAct(l,'Message sent to driver'); paint(); };
      const sb=body.querySelector('[data-a="send"]'); if(sb) sb.onclick=send;
      const tp=body.querySelector('[data-a="tpl"]'); if(tp) tp.onclick=()=>{ l.messages.push({from:'dispatcher', text:'What is your ETA to '+(d.next?d.next.city:'the next stop')+'? Reply in the app.', at:NOW}); paint(); };
      const ch=body.querySelector('[data-a="chat"]'); if(ch) ch.onclick=()=>showToast('Opens this thread in Chat (TL-SUP-01)');
      const ta=body.querySelector('#msgInput'); if(ta) ta.onkeydown=(e)=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); } };
    } else if(activeTab==='activity'){
      body.innerHTML = '<div class="sp-section"><div class="sp-section-title">ACTIVITY LOG</div><div class="sp-activity-list">'+l.activity.map(a=>'<div class="sp-activity-row"><div class="sp-activity-text">'+esc(a.text)+'</div><div class="sp-activity-date">'+esc(a.by)+' · '+fmtDayTime(a.at)+'</div></div>').join('')+'</div></div>';
    }
    panel.appendChild(body);
    const footer = el('<div class="sp-footer"></div>');
    if(isActive(l)){
      const a=el('<button class="btn primary">'+iconHTML(l.driverId?'swap_horiz':'person_add',16)+(l.driverId?'Reassign':'Assign driver')+'</button>'); a.onclick=()=>openModal('assign',{loadId:l.id}); footer.appendChild(a);
      const s=el('<button class="btn">'+iconHTML('flag',16)+'Change status</button>'); s.onclick=()=>openModal('status',{ids:[l.id]}); footer.appendChild(s);
    } else if(l.status==='delivered'){
      const b=el('<button class="btn primary" '+(l.docs.pod!=='on_file'?'disabled':'')+'>'+iconHTML('receipt_long',16)+'Send to Billing</button>'); b.onclick=()=>{ showToast('Load '+l.id+' sent to Billing (TL-FIN-01)'); }; footer.appendChild(b);
      const r=el('<button class="btn">'+iconHTML('description',16)+'Documents</button>'); r.onclick=()=>{ activeTab='documents'; paint(); }; footer.appendChild(r);
    }
    panel.appendChild(footer);
  }
  openPanelRefresh = ()=>{ if(!loadById(l.id)) return; paint(); };
  paint();
  scrim.appendChild(panel); document.body.appendChild(scrim); panel.style.zoom = currentAppScale;
  requestAnimationFrame(()=>scrim.classList.add('open'));
}

/* ============================================================
   MODAL SYSTEM (DOC): state.modal → renderModal() inside render()
   ============================================================ */
function openModal(name, ctx){ state.modal = name; state.modalCtx = ctx||{}; render(); }
function closeModal(){ state.modal = null; state.modalCtx = null; render(); }
function modalShell(innerHtml){
  const wrap = el('<div class="modal-scrim"><div class="modal-wrap"><div class="modal"></div></div></div>');
  const modal = wrap.querySelector('.modal'); modal.innerHTML = innerHtml;
  const close = el('<button class="modal-close" type="button">'+iconHTML('close',16)+'</button>'); close.onclick = closeModal;
  wrap.querySelector('.modal-wrap').appendChild(close);
  wrap.onclick = (e)=>{ if(e.target===wrap) closeModal(); };
  return wrap;
}
function renderModal(){
  document.querySelectorAll('.modal-scrim').forEach(n=>n.remove());
  if(!state.modal) return;

  pickupDate:{label:'Pickup date', type:'presetRange', presetKey:'pickupPreset', fromKey:'pickupFrom', toKey:'pickupTo'},

  docs:{label:'Missing documents', type:'multiselect', options:[['rc','Rate confirmation'],['bol','BOL'],['pod','POD']]},

  minRate:{label:'Minimum rate ($)', type:'number'}
};
let filterFieldOrder = { quick:['status','attention','dispatcher'], more:['customer','equipment','pickupDate','deliveryDate','exception','docs','source','minRate'] };
function filterValueCount(key){
  const f=state.filters; const m=FILTER_FIELD_META[key]; if(!m) return 0;
  if(m.type==='toggle') return f[key]?1:0;
  if(m.type==='presetRange') return (f[m.presetKey]||f[m.fromKey]||f[m.toKey])?1:0;
  if(m.type==='number') return f[key]?1:0;
  return f[key]?f[key].size:0;
}
function clearAllFilters(){ state.filters = defaultFilters(); }
function isoDate(d){ const p=n=>(n<10?'0':'')+n; return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function renderFilterField(container, key, draggable){
  const meta = FILTER_FIELD_META[key]; const f = state.filters;
  const wrap = document.createElement('div'); wrap.className = draggable ? 'filter-field-row' : '';
  if(draggable) wrap.appendChild(el('<span class="drag-handle">'+iconHTML('drag_indicator',16)+'</span>'));
  const field = document.createElement('div'); field.className = 'filter-field';
  if(meta.type === 'toggle'){
    const row = el('<div class="filter-toggle-row"><label>'+meta.label+'</label><div class="switch '+(f[key]?'on':'')+'"><div class="knob"></div></div></div>');
    row.querySelector('.switch').onclick = ()=>{ f[key] = !f[key]; openModal('filters'); };
    field.appendChild(row);
  } else if(meta.type === 'presetRange'){
    field.appendChild(el('<label>'+meta.label+'</label>'));
    const presetRow = el('<div class="preset-row"></div>');
    [['today','Today'],['tomorrow','Tomorrow'],['next3','Next 3 days'],['week','This week']].forEach(([v,lbl])=>{
      const btn = el('<button type="button" class="preset-chip'+(f[meta.presetKey]===v?' active':'')+'">'+lbl+'</button>');
      btn.onclick = ()=>{ f[meta.presetKey] = f[meta.presetKey]===v ? '' : v; f[meta.fromKey]=null; f[meta.toKey]=null; openModal('filters'); };
      presetRow.appendChild(btn);
    });
    field.appendChild(presetRow);
    const row = el('<div class="filter-range"><input type="date" value="'+(f[meta.fromKey]?isoDate(f[meta.fromKey]):'')+'"/><span style="color:var(--text400)">–</span><input type="date" value="'+(f[meta.toKey]?isoDate(f[meta.toKey]):'')+'"/></div>');
    const [fromI, toI] = row.querySelectorAll('input');
    fromI.onchange = (e)=>{ f[meta.presetKey]=''; f[meta.fromKey] = e.target.value ? new Date(e.target.value+'T00:00:00') : null; openModal('filters'); };
    toI.onchange = (e)=>{ f[meta.presetKey]=''; f[meta.toKey] = e.target.value ? new Date(e.target.value+'T00:00:00') : null; openModal('filters'); };
    field.appendChild(row);
  } else if(meta.type === 'number'){
    field.appendChild(el('<label>'+meta.label+'</label>'));
    const inp = el('<input type="number" id="f_'+key+'" placeholder="e.g. 2000" value="'+esc(f[key])+'"/>');
    inp.oninput = (e)=>{ f[key]=e.target.value; };
    inp.onchange = ()=>openModal('filters');
    field.appendChild(inp);
  } else {
    field.appendChild(el('<label>'+meta.label+'</label>'));
    const count = filterValueCount(key);
    const box = el('<div class="filter-input-box"><span class="'+(count?'':'ph')+'">'+(count? count+' selected' : 'All')+'</span>'+iconHTML('expand_more',16,'color:var(--text400)')+'</div>');
    const list = document.createElement('div'); list.className='filter-checklist'; list.style.display = (state._openFilterList===key) ? 'block' : 'none';
    meta.options.forEach(([val,lbl])=>{
      const optLabel = el('<label><input type="checkbox" '+(f[key].has(val)?'checked':'')+'/> '+esc(lbl)+'</label>');
      optLabel.querySelector('input').onchange = (e)=>{ if(e.target.checked) f[key].add(val); else f[key].delete(val); state._openFilterList=key; openModal('filters'); };
      list.appendChild(optLabel);
    });
    box.onclick = ()=>{ const open = list.style.display==='none'; list.style.display = open ? 'block' : 'none'; state._openFilterList = open ? key : null; };
    field.appendChild(box); field.appendChild(list);
  }
  wrap.appendChild(field); container.appendChild(wrap); return wrap;
}
function modalFilters(){
  const customizing = state.filterCustomizeMode;
  const wrap = modalShell(''); const modal = wrap.querySelector('.modal');
  modal.classList.add('filter-panel'); if(customizing) modal.classList.add('customize-mode');

  const clearBtn = el('<button class="btn">Clear all</button>'); clearBtn.onclick = ()=>{ clearAllFilters(); openModal('filters'); };
  const customizeBtn = el('<button class="btn '+(customizing?'primary':'')+'">'+(customizing?'Done':'Customize')+'</button>'); customizeBtn.onclick = ()=>{ state.filterCustomizeMode = !state.filterCustomizeMode; openModal('filters'); };
  header.appendChild(clearBtn); header.appendChild(customizeBtn); modal.appendChild(header);
  const quickWrap = el('<div id="quickWrap"></div>'); const pinnedWrap = el('<div id="pinnedWrap"></div>'); const moreToggleWrap = el('<div id="moreToggleWrap"></div>');
  const moreSection = el('<div id="moreSection" style="display:none;"><div class="filter-divider"></div><div id="moreWrap"></div></div>');

  if(customizing){
    moreSection.style.display = 'block';
    quickWrap.appendChild(el('<div class="filter-section-label">QUICK FILTERS</div>'));
    moreSection.querySelector('.filter-divider').before(el('<div class="filter-section-label" style="margin-top:0">MORE FILTERS</div>'));
    filterFieldOrder.quick.forEach(key=> renderFilterField(quickWrap, key, true));
    filterFieldOrder.more.forEach(key=> renderFilterField(moreWrap, key, true));
    quickWrap.dataset.filterList = 'quick'; moreWrap.dataset.filterList = 'more';
    const onMoved = (evt)=>{ try{ const fromList = evt.from.dataset.filterList, toList = evt.to.dataset.filterList; const [moved] = filterFieldOrder[fromList].splice(evt.oldIndex, 1); filterFieldOrder[toList].splice(evt.newIndex, 0, moved); openModal('filters'); }catch(err){ console.error('Reorder failed:', err); openModal('filters'); } };
    safeSortable(quickWrap, { group:'loadFilterFields', onEnd:onMoved }); safeSortable(moreWrap, { group:'loadFilterFields', onEnd:onMoved });
  } else {
    filterFieldOrder.quick.forEach(key=> renderFilterField(quickWrap, key, false));
    const moreCount = filterFieldOrder.more.reduce((n,k)=>n+filterValueCount(k),0);
    const toggleLink = el('<div class="more-filters-link">'+iconHTML(state.filterMoreExpanded?'remove':'add',14)+' '+(state.filterMoreExpanded?'Fewer filters':'More filters')+(moreCount?' ('+moreCount+' active)':'')+'</div>');

    moreToggleWrap.appendChild(toggleLink);
    if(state.filterMoreExpanded){ moreSection.style.display = 'block'; filterFieldOrder.more.forEach(key=> renderFilterField(moreWrap, key, false)); }
  }
  const n = buildRows().length;
  const applyBtn = el('<button class="btn primary" style="width:100%;margin-top:8px;">Show '+n+' load'+(n!==1?'s':'')+'</button>');
  applyBtn.onclick = ()=>{ state.filterCustomizeMode=false; state.page=1; state._openFilterList=null; closeModal(); };
  modal.appendChild(applyBtn);
  return wrap;
}

/* ============================================================
   PLANNER — Gantt dispatch board (TL-OPS-01-02 tab, same load model)

state.planner = { mode:'days', rangeDays:3, start:new Date(TODAY), pxPerHour:22, weekCount:4, weekStart:1, search:'', dispatcher:'all', trayOpen:true, collapsed:new Set() };
// weekStart: 0=Sun .. 6=Sat (company setting — some carriers run and pay strictly by week)
const LANE_H = 66, HEAD_H = 52, SIDE_W = 240;
function startOfWeek(d, ws){ const r=startOfDay(d); const diff=(r.getDay()-ws+7)%7; r.setDate(r.getDate()-diff); return r; }
function isoWeek(d){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const day=(t.getUTCDay()+6)%7; t.setUTCDate(t.getUTCDate()-day+3); const first=new Date(Date.UTC(t.getUTCFullYear(),0,4)); const fday=(first.getUTCDay()+6)%7; return 1+Math.round(((t-first)/86400000 - 3 + fday)/7); }
const DOW3=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const PLAN_RANGES = [{key:1,label:'Day',px:46},{key:3,label:'3 days',px:23},{key:7,label:'Week',px:10}];
const WEEK_RANGES = [{key:2,label:'2 wks'},{key:4,label:'4 wks'},{key:8,label:'8 wks'}];
function startOfDay(d){ const r=new Date(d); r.setHours(0,0,0,0); return r; }
function planGeo(){
  const p=state.planner;
  if(p.mode==='weeks'){ const start=startOfWeek(p.start, p.weekStart); const days=p.weekCount*7; const colPx=224; return {mode:'weeks', start, end:new Date(start.getTime()+days*86400000), colPx, dayPx:colPx/7, hourPx:colPx/7/24, width:p.weekCount*colPx}; }
  const start=startOfDay(p.start); return {mode:'days', start, end:new Date(start.getTime()+p.rangeDays*86400000), hourPx:p.pxPerHour, width:p.rangeDays*24*p.pxPerHour};
}
function xOf(t, g){ return (t - g.start)/3600000 * g.hourPx; }
function snapMin(min, step){ return Math.round(min/step)*step; }
function loadSpan(l){
  const d = deriveLoad(l); const first=l.stops[0], last=l.stops[l.stops.length-1];
  const start = first.arrived || first.appt.start;
  let end = last.departed || new Date(apptDeadline(last.appt).getTime()+60*60000);
  if(!last.departed && d.eta && d.next===last && d.eta > end) end = new Date(d.eta.getTime()+60*60000);
  if(end <= start) end = new Date(start.getTime()+2*3600000);
  const dhStart = new Date(start.getTime() - (l.miles.deadhead/AVG_MPH)*3600000);
  let progress = 0;
  if(isActive(l) && l.status!=='scheduled'){ progress = Math.max(0, Math.min(1, (NOW - start)/(end - start))); }
  if(l.status==='delivered') progress = 1;
  return {start, end, dhStart, progress, d};
}
function busyUntil(dr){ const ls=driverActiveLoads(dr.id); if(!ls.length) return null; return ls.reduce((m,l)=>{ const s=loadSpan(l); return !m||s.end>m?s.end:m; }, null); }
function assignLanes(items){ // items: {start,end} → lane index
  const lanes=[]; items.sort((a,b)=>a.start-b.start).forEach(it=>{ let i=lanes.findIndex(e=>e<=it.start); if(i<0){ i=lanes.length; lanes.push(it.end); } else lanes[i]=it.end; it.lane=i; }); return Math.max(1, lanes.length);
}
function plannerDrivers(){
  const p=state.planner;
  return DRIVERS.filter(dr=> (p.dispatcher==='all' || dr.dispatcherId===p.dispatcher) && matches(p.search, dr.name+' '+(TRK[dr.truckId]?TRK[dr.truckId].unit:'')+' '+dr.gps.city+' '+DSP[dr.dispatcherId].name+' '+dr.type));
}
function unassignedLoads(){ return LOADS.filter(l=>l.status==='unassigned').map(l=>({l, d:deriveLoad(l)})).sort((a,b)=> a.l.stops[0].appt.start - b.l.stops[0].appt.start); }

function renderPlanToolbar(){
  const p=state.planner; const g=planGeo();
  const bar = el('<div class="plan-toolbar"></div>');
  const stepBack=()=>{ if(p.mode==='weeks'){ p.start=new Date(startOfWeek(p.start,p.weekStart).getTime()-7*86400000); state._planScroll=0; } else { p.start=new Date(p.start.getTime()-86400000); state._planScroll=0; } render(); };
  const stepFwd=()=>{ if(p.mode==='weeks'){ p.start=new Date(startOfWeek(p.start,p.weekStart).getTime()+7*86400000); state._planScroll=0; } else { p.start=new Date(p.start.getTime()+86400000); state._planScroll=0; } render(); };
  const prev=el('<span class="icon-btn" title="Previous">'+iconHTML('chevron_left',18)+'</span>'); prev.onclick=stepBack; bar.appendChild(prev);
  const today=el('<button class="btn">Today</button>'); today.onclick=()=>{ p.start=new Date(TODAY); state._planScroll=null; render(); }; bar.appendChild(today);
  const next=el('<span class="icon-btn" title="Next">'+iconHTML('chevron_right',18)+'</span>'); next.onclick=stepFwd; bar.appendChild(next);
  let label;
  if(p.mode==='weeks'){ const ws=startOfWeek(p.start,p.weekStart); const we=new Date(ws.getTime()+(p.weekCount*7-1)*86400000); label='W'+isoWeek(ws)+' – W'+isoWeek(we)+' · '+fmtDate(ws)+' – '+fmtDate(we); }

  if(p.mode==='days') bar.appendChild(el('<div class="plan-legend"><span><i style="background:var(--info)"></i>Scheduled</span><span><i style="background:var(--accent)"></i>In transit</span><span><i style="background:var(--warning)"></i>At stop</span><span><i class="dh"></i>Deadhead</span></div>'));

function renderGantt(){

    list.forEach(dr=>{

      const lanes = assignLanes(loads); const h = lanes*LANE_H;

      const side = el('<div class="gantt-side" style="height:'+h+'px"><div class="gs-top"><span class="ent-avatar" style="width:24px;height:24px;font-size:9.5px">'+initials(dr.name)+'</span><span class="gs-name">'+esc(dr.name)+'</span>'+sevDotHtml(loads.length?sevRow:'info')+'</div><div class="gs-meta">'+(trk?'Truck '+trk.unit:'No truck')+(trl?' · '+trl.type+' '+trl.unit:'')+' · '+dutyLabel(dr.duty)+' · '+esc(dr.gps.city)+', '+dr.gps.st+'</div><div class="hos-cell">'+hosBar('D',dr.hos.drive,660)+'</div></div>');

        bar.onclick=(e)=>{ if(dragState.moved || e.target.classList.contains('gb-handle')) return; openLoadPanel(l); };

  if(nowX>=0 && nowX<=g.width) inner.appendChild(el('<div class="g-now" style="left:'+(SIDE_W+nowX)+'px;top:'+HEAD_H+'px"></div>'));
  scroll.appendChild(inner); wrap.appendChild(scroll);
  scroll.addEventListener('scroll', ()=>{ state._planScroll=scroll.scrollLeft; state._planScrollTop=scroll.scrollTop; });

function planTooltip(l, s){
  const rows=[{sev:s.d.sev, title:'Load '+l.id+' · '+STATUS_LABEL[l.status]+' · '+esc(l.customer.name), detail:money(l.rate)+' · $'+s.d.rpmAllIn.toFixed(2)+'/mi all-in · '+l.equipment}];

/* ============================================================
   DRAG & DROP — pointer-based (bars and tray cards → driver rows / tray)
   ============================================================ */
let dragState = {active:false, moved:false};
function wireDrag(node, payload){
  node.addEventListener('pointerdown', (e)=>{
    if(e.button!==0) return;
    document.querySelectorAll('.alert-tip').forEach(n=>n.remove());
    dragState = {active:false, moved:false, payload, node, sx:e.clientX, sy:e.clientY, ghost:null, hint:null, preview:null, row:null, shiftMin:0, target:null};
    const onMove=(ev)=>{
      if(!dragState.active){ if(Math.hypot(ev.clientX-dragState.sx, ev.clientY-dragState.sy)<5) return; beginDrag(ev); }

function boardMatch(p){
  // nearest available truck: position = current GPS (or last delivery of the active load), free time = end of the active load
  let best=null;
  DRIVERS.filter(dr=>dr.truckId && TRK[dr.truckId].status!=='shop').forEach(dr=>{
    const trl=dr.trailerId?TRL[dr.trailerId]:null; const equipOK = !!trl && (p.equipment==='Dry van' ? trl.type==='Dry van' : trl.type===p.equipment); if(!equipOK) return;
    const act=driverActiveLoads(dr.id); let pos=dr.gps, free=NOW, after=null;
    if(act.length){ const last=act.reduce((m,l)=>{ const s=loadSpan(l); return !m||s.end>m.s.end?{l,s}:m; }, null); pos=last.l.stops[last.l.stops.length-1]; free=last.s.end; after=last.l.id; }
    const dh=roadMiles(pos, p.origin); const travel=dh/AVG_MPH*60; const canArrive=new Date(Math.max(free.getTime(), NOW.getTime())+travel*60000);
    const feasible = canArrive <= p.pickup && dr.alerts.every(a=>a.sev!=='danger');
    const score = dh + (feasible?0:800);
    if(!best || score<best.score) best={dr, dh, free, after, feasible, canArrive, score};
  });
  return best;
}
function boardRows(){
  const b=state.board;
  let rows = BOARD_POSTS.filter(p=>!b.hidden.has(p.id)).map(p=>({p, m:boardMatch(p), rpm:p.rate/p.miles}));
  rows = rows.filter(r=>{
    if(b.source!=='all' && r.p.source!==b.source) return false;
    if(b.equipment!=='all' && r.p.equipment!==b.equipment) return false;
    if(b.maxDh && (!r.m || r.m.dh>Number(b.maxDh))) return false;
    if(b.minRpm && r.rpm<Number(b.minRpm)) return false;
    return matches(b.search, [r.p.origin.city, r.p.origin.st, r.p.dest.city, r.p.dest.st, r.p.broker.name, r.p.broker.mc, r.p.equipment, SOURCE_LABEL[r.p.source], r.p.notes, r.m?r.m.dr.name:''].join(' '));
  });
  const val=(r)=>{ switch(b.sortKey){ case 'match': return (r.m&&r.m.feasible?0:1e6)+(r.m?r.m.dh:9e5); case 'age': return r.p.ageMin; case 'lane': return r.p.origin.st+r.p.origin.city; case 'pickup': return r.p.pickup.getTime(); case 'equipment': return r.p.equipment; case 'miles': return r.p.miles; case 'rate': return r.p.rate; case 'rpm': return r.rpm; case 'broker': return r.p.broker.name; case 'dh': return r.m?r.m.dh:9e5; default: return 0; } };
  rows.sort((x,y)=>{ const a=val(x), c=val(y); return a<c?-b.sortDir:(a>c?b.sortDir:0); });
  rows.sort((x,y)=>(b.saved.has(y.p.id)?1:0)-(b.saved.has(x.p.id)?1:0));
  return rows;
}

  {id:'u_hazmat', name:'Hazmat surcharge', system:false, calc:'percent', amount:10, billable:true, inGross:true, addon:{mode:'percent', value:25}, note:'Placarded loads', createdBy:'Jon Doe'}
];

let ACC_SEQ = 100;
function accAmount(calc, qty, rate, lineHaul){ if(calc==='percent') return Math.round(lineHaul*rate/100); if(calc==='flat') return Number(rate)||0; return Math.round((Number(qty)||0)*(Number(rate)||0)); }
function accAddon(amount, addon){ if(!addon || addon.mode==='none') return 0; if(addon.mode==='fixed') return Number(addon.value)||0; return Math.round(amount*(Number(addon.value)||0)/100); }
function mkAcc(l, tpl, o){
  const a = Object.assign({id:'a'+(ACC_SEQ++), tplId:tpl.id, name:tpl.name, calc:tpl.calc, unit:tpl.unit||'', qty:1, rate:tpl.amount, billable:tpl.billable, inGross:tpl.inGross, addon:Object.assign({}, tpl.addon), receipt:false, note:'', by:CURRENT_USER.name, at:NOW}, o||{});
  a.amount = accAmount(a.calc, a.qty, a.rate, l.rate); a.addonAmount = accAddon(a.amount, a.addon); return a;
}
function finOf(l, extra){
  const ok = l.accessorials.concat(extra?[extra]:[]);
  const inGross = ok.filter(a=>a.inGross).reduce((s,a)=>s+a.amount,0);
  const pass = ok.filter(a=>!a.inGross && a.billable).reduce((s,a)=>s+a.amount,0);
  const cost = ok.filter(a=>!a.inGross && !a.billable).reduce((s,a)=>s+a.amount,0);
  const invoice = l.rate + ok.filter(a=>a.billable).reduce((s,a)=>s+a.amount,0);
  const addons = ok.reduce((s,a)=>s+(a.addonAmount||0),0);
  const miles = Math.max(1, l.miles.loaded + l.miles.deadhead);
  const gross = l.rate + inGross;
  return {lineHaul:l.rate, inGross, pass, cost, gross, invoice, addons, rpm: gross/miles, miles, count: ok.length};
}
function grossOf(l){ return finOf(l).gross; }
function payPeriodLabel(){ return 'Sep 7 – Sep 13'; }

/* ---------- Financial tab (side panel) ---------- */
function renderFinancialTab(body, l, d, paint){
  const f = finOf(l); const drv = d.drv;
  const row = (k,v,cls)=>'<div class="sp-detail-row"><span class="sp-detail-label">'+k+'</span><span class="sp-detail-value '+(cls||'')+'">'+v+'</span></div>';

  const dh=l.miles.deadhead, tot=l.miles.loaded+dh, dhr=tot?dh/dh*0+dh/tot:0, dhcost=Math.round(dh*(typeof COST_PER_MILE!=='undefined'?COST_PER_MILE:1.9)), dhsev=dhr>0.2?'danger':(dhr>0.1?'warning':'success');
  h += row('Line haul', money(f.lineHaul));
  h += row('Loaded miles', l.miles.loaded.toLocaleString('en-US')+' mi');
  h += row('Deadhead', dh?'<span class="dh-dot '+dhsev+'"></span>'+dh+' mi ('+Math.round(dhr*100)+'%) · '+money(dhcost)+' empty':'0 mi');

  if(dh) h += '<div class="fin-total" style="border-top:none;margin-top:2px;padding-top:2px;font-weight:600"><span style="color:var(--text600)">Rate per loaded mile</span><span style="color:var(--text600)">$'+(f.gross/Math.max(1,l.miles.loaded)).toFixed(2)+'/mi</span></div>';
  h += '<div class="fin-total" style="border-top:none;margin-top:2px;padding-top:2px;font-weight:600"><span>Invoice to '+esc(l.customer.name)+'</span><span>'+money(f.invoice)+'</span></div>';
  h += '<div class="fin-total" style="border-top:none;margin-top:2px;padding-top:2px;font-weight:600"><span>Driver addons → paystub</span><span style="color:var(--purple)">'+money(f.addons)+(drv&&f.addons?' <span class="cell-meta">· '+esc(drv.name.split(' ')[0])+' · '+payPeriodLabel()+'</span>':'')+'</span></div>';
  h += '</div>';
  // detention suggestion from the exception engine
  if(d.cur && d.dwellMin > d.cur.freeMin && !l.accessorials.some(a=>a.tplId==='detention')){
    const hrs = Math.max(1, Math.ceil((d.dwellMin - d.cur.freeMin)/60)); const tpl = ACC_TEMPLATES.find(t=>t.id==='detention');
    h += '<div class="sp-banner warning">'+iconHTML('schedule',18)+'<div><b>Detention accruing at '+d.cur.kind+' · '+fmtDur(d.dwellMin - d.cur.freeMin)+' over free time</b><div style="font-weight:400">Suggested: '+hrs+' h × '+money(tpl.amount)+' = '+money(hrs*tpl.amount)+' · timestamps from ELD geofence</div></div><button class="link-btn" data-a="add-detention" data-h="'+hrs+'">Add detention</button></div>';
  }
  h += '<div class="sp-section"><div class="sp-section-title" style="display:flex;align-items:center;gap:10px">ACCESSORIALS · '+l.accessorials.length+'<span style="flex:1"></span><button class="link-btn" data-a="templates">'+iconHTML('tune',13)+'Templates</button><button class="link-btn" data-a="add">'+iconHTML('add',13)+'Add accessorial</button></div>';
  if(!l.accessorials.length) h += '<div class="no-options-hint">No accessorials on this load. Detention, lumper, layover and extra stops are the usual ones — add one to see how it changes the gross.</div>';
  l.accessorials.forEach(a=>{
    const calcTxt = a.calc==='flat' ? 'flat' : (a.calc==='percent' ? a.rate+'% of line haul' : a.qty+' '+(a.unit||'unit')+(a.qty>1?'s':'')+' × '+money(a.rate));
    const addonTxt = a.addon.mode==='none' ? '' : (a.addon.mode==='reimburse' ? 'Reimburse driver '+money(a.addonAmount) : 'Driver addon '+money(a.addonAmount)+(a.addon.mode==='percent'?' ('+a.addon.value+'%)':''));
    h += '<div class="acc-row" data-id="'+a.id+'"><div class="acc-main"><div class="acc-head"><span class="acc-name">'+esc(a.name)+'</span>'+(a.receipt?'<span class="appt-tag done">RECEIPT</span>':'')+'<span class="acc-amt">'+money(a.amount)+'</span></div><div class="cell-meta" style="white-space:normal">'+calcTxt+' · '+esc(a.by)+', '+fmtShort(a.at)+(a.note?' · '+esc(a.note):'')+'</div>'+
      '<div class="acc-flags"><label class="acc-flag"><span class="switch '+(a.inGross?'on':'')+'" data-a="toggle" data-k="inGross"><span class="knob"></span></span>Counts toward gross</label><label class="acc-flag"><span class="switch '+(a.billable?'on':'')+'" data-a="toggle" data-k="billable"><span class="knob"></span></span>Billable to customer</label>'+(addonTxt&&drv?'<span class="acc-payroll">'+iconHTML('payments',13,'color:var(--purple)')+addonTxt+' → '+esc(drv.name.split(' ')[0])+'\'s paystub · '+payPeriodLabel()+'</span>':(addonTxt?'<span class="acc-payroll">'+iconHTML('payments',13,'color:var(--purple)')+addonTxt+' → paystub once a driver is assigned</span>':''))+'</div>'+
      '<div class="rs-actions"><button class="link-btn" data-a="edit">Edit</button><button class="link-btn" data-a="remove" style="color:var(--text400)">Remove</button></div></div></div>';
  });
  h += '</div>';
  body.innerHTML = h;
  body.querySelector('[data-a="add"]').onclick=()=>openModal('addAccessorial',{loadId:l.id});
  body.querySelector('[data-a="templates"]').onclick=()=>openModal('accTemplates',{loadId:l.id});
  const det=body.querySelector('[data-a="add-detention"]'); if(det) det.onclick=()=>openModal('addAccessorial',{loadId:l.id, tplId:'detention', qty:Number(det.dataset.h), note:'Auto-calculated from ELD geofence at '+d.cur.name});
  body.querySelectorAll('.acc-row').forEach(rowEl=>{
    const a=l.accessorials.find(x=>x.id===rowEl.dataset.id);
    rowEl.querySelectorAll('[data-a="toggle"]').forEach(sw=>sw.onclick=()=>{ a[sw.dataset.k]=!a[sw.dataset.k]; logAct(l, a.name+' '+(sw.dataset.k==='inGross'?(a.inGross?'now counts toward gross':'excluded from gross'):(a.billable?'billable to customer':'not billable'))); render(); });
    const on=(k,fn)=>{ const b=rowEl.querySelector('[data-a="'+k+'"]'); if(b) b.onclick=fn; };
    on('edit',()=>openModal('addAccessorial',{loadId:l.id, editId:a.id}));
    on('remove',()=>{ l.accessorials=l.accessorials.filter(x=>x!==a); logAct(l, a.name+' '+money(a.amount)+' removed'); showToast(a.name+' removed — gross now '+money(finOf(l).gross)); render(); });
  });
}

/* ---------- Add / edit accessorial (with live simulation) ---------- */
function modalAddAccessorial(ctx){
  const l=loadById(ctx.loadId); const editing = ctx.editId ? l.accessorials.find(a=>a.id===ctx.editId) : null;
  const tpl = ACC_TEMPLATES.find(t=>t.id===(ctx.tplId || (editing?editing.tplId:'detention'))) || ACC_TEMPLATES[0];
  const dr = ctx.draft || (editing ? {qty:editing.qty, rate:editing.rate, billable:editing.billable, inGross:editing.inGross, addonMode:editing.addon.mode, addonValue:editing.addon.value, receipt:editing.receipt, note:editing.note} : {qty:ctx.qty||1, rate:tpl.amount, billable:tpl.billable, inGross:tpl.inGross, addonMode:tpl.addon.mode, addonValue:tpl.addon.value, receipt:false, note:ctx.note||''});
  const reopen=(patch)=>openModal('addAccessorial', Object.assign({}, ctx, {tplId:tpl.id, draft:Object.assign({}, readDraft(), patch||{})}));
  const m = modalShell('<h2>'+(editing?'Edit':'Add')+' accessorial · load '+l.id+'</h2><p class="mdesc">Pick a template, adjust the amount, decide whether it counts toward the gross and whether the driver gets an addon. The simulation below updates as you type; the charge applies as soon as you add it and is logged with your name.</p>');
  const modal=m.querySelector('.modal'); modal.classList.add('wide');
  if(!editing){
    const chips=el('<div class="preset-row" style="margin-bottom:12px"></div>');
    ACC_TEMPLATES.forEach(t=>{ const c=el('<button type="button" class="preset-chip'+(t.id===tpl.id?' active':'')+'">'+esc(t.name)+(t.system?'':' <span class="cnt" style="opacity:.7">·custom</span>')+'</button>'); c.onclick=()=>openModal('addAccessorial',{loadId:l.id, tplId:t.id}); chips.appendChild(c); });
    const nw=el('<button type="button" class="preset-chip" style="border-style:dashed">+ New template</button>'); nw.onclick=()=>openModal('accTemplateForm',{back:{name:'addAccessorial', ctx:{loadId:l.id}}}); chips.appendChild(nw);
    modal.appendChild(chips);
  }
  const calc = editing ? editing.calc : tpl.calc;
  const amountField = calc==='flat' ? '<div><label>Amount ($)</label><input type="number" id="acRate" value="'+esc(dr.rate)+'"/></div>' : (calc==='percent' ? '<div><label>Percent of line haul</label><input type="number" id="acRate" value="'+esc(dr.rate)+'"/></div>' : '<div><label>'+(calc==='per_hour'?'Hours':'Quantity ('+(tpl.unit||'units')+')')+'</label><input type="number" id="acQty" value="'+esc(dr.qty)+'" step="1" min="1"/></div><div><label>Rate per '+(tpl.unit||'unit')+' ($)</label><input type="number" id="acRate" value="'+esc(dr.rate)+'"/></div>');
  modal.appendChild(el('<div class="field inline"><div><label>Template</label><input type="text" value="'+esc(tpl.name)+' · '+ACC_CALC[calc]+'" disabled/></div>'+amountField+'</div>'));
  modal.appendChild(el('<div class="acc-flags" style="margin:2px 0 12px"><label class="acc-flag"><span class="switch '+(dr.inGross?'on':'')+'" id="acGross"><span class="knob"></span></span>Counts toward gross</label><label class="acc-flag"><span class="switch '+(dr.billable?'on':'')+'" id="acBill"><span class="knob"></span></span>Billable to customer</label><label class="acc-flag"><span class="switch '+(dr.receipt?'on':'')+'" id="acReceipt"><span class="knob"></span></span>Receipt attached</label></div>'));
  modal.appendChild(el('<div class="field inline"><div><label>Driver addon (payroll)</label><select id="acMode">'+Object.entries(ADDON_MODE).map(([k,v])=>'<option value="'+k+'" '+(dr.addonMode===k?'selected':'')+'>'+v+'</option>').join('')+'</select></div><div><label>'+(dr.addonMode==='fixed'?'Addon amount ($)':'Percent of the charge')+'</label><input type="number" id="acAddonVal" value="'+esc(dr.addonValue)+'" '+(dr.addonMode==='none'?'disabled':'')+'/></div></div>'));
  modal.appendChild(el('<div class="field"><label>Note</label><input type="text" id="acNote" placeholder="e.g. 3h 10m at dock 7, BOL stamped 12:40" value="'+esc(dr.note)+'"/></div>'));
  const sim = el('<div class="acc-sim"></div>'); modal.appendChild(sim);
  function readDraft(){ return {qty:modal.querySelector('#acQty')?Number(modal.querySelector('#acQty').value):dr.qty, rate:Number(modal.querySelector('#acRate').value), inGross:modal.querySelector('#acGross').classList.contains('on'), billable:modal.querySelector('#acBill').classList.contains('on'), receipt:modal.querySelector('#acReceipt').classList.contains('on'), addonMode:modal.querySelector('#acMode').value, addonValue:Number(modal.querySelector('#acAddonVal').value), note:modal.querySelector('#acNote').value}; }
  function candidate(){ const x=readDraft(); const base = editing ? Object.assign({}, editing) : mkAcc(l, tpl, {}); Object.assign(base, {qty:x.qty, rate:x.rate, inGross:x.inGross, billable:x.billable, receipt:x.receipt, addon:{mode:x.addonMode, value:x.addonValue}, note:x.note, calc}); base.amount=accAmount(calc, base.qty, base.rate, l.rate); base.addonAmount=accAddon(base.amount, base.addon); return base; }
  function paintSim(){
    const c=candidate(); const before = editing ? finOf(Object.assign({}, l, {accessorials:l.accessorials.filter(a=>a.id!==editing.id)})) : finOf(l); const after = editing ? finOf(Object.assign({}, l, {accessorials:l.accessorials.filter(a=>a.id!==editing.id)}), c) : finOf(l, c);
    const d=(a,b)=> b===a ? '<span class="cell-meta">unchanged</span>' : '<span style="color:'+(b>a?'var(--accent-dark)':'var(--danger-t)')+'">'+(b>a?'+':'−')+money(Math.abs(b-a))+'</span>';

      '<span>Driver addon (payroll)</span><span>'+money(before.addons)+'</span><span><b style="color:var(--purple)">'+money(after.addons)+'</b></span><span>'+d(before.addons, after.addons)+'</span></div>'+
      '<div class="cell-meta" style="margin-top:8px;white-space:normal">'+(c.inGross?'Counts toward gross → raises the load\'s rate per mile and the dispatcher\'s numbers.':'Not in gross → pass-through: '+(c.billable?'billed to the customer at cost, gross unchanged.':'company cost, nothing billed.'))+(c.addonAmount?' Driver: '+(c.addon.mode==='reimburse'?'reimbursed ':'addon ')+money(c.addonAmount)+' on the '+payPeriodLabel()+' paystub (Addons module).':'')+'</div>';
  }
  modal.querySelectorAll('#acGross,#acBill,#acReceipt').forEach(sw=>sw.onclick=()=>{ sw.classList.toggle('on'); paintSim(); });
  modal.querySelectorAll('#acQty,#acRate,#acAddonVal,#acNote').forEach(i=>{ i.oninput=paintSim; });
  modal.querySelector('#acMode').onchange=(e)=>{ const mode=e.target.value; const val = mode==='fixed' ? Math.round(candidate().amount/2) : (mode==='reimburse'?100:(mode==='percent'?50:0)); reopen({addonMode:mode, addonValue:val}); };
  paintSim();
  const actions=el('<div class="actions"></div>');
  const cancel=el('<button class="btn">Cancel</button>'); cancel.onclick=closeModal;
  const add=el('<button class="btn primary">'+(editing?'Save':'Add accessorial')+'</button>');
  add.onclick=()=>{ const c=candidate(); if(!c.amount){ showToast('Enter an amount','warning'); return; } if(editing){ Object.assign(editing, c); logAct(l, editing.name+' updated to '+money(editing.amount)); } else { l.accessorials.push(c); logAct(l, c.name+' '+money(c.amount)+' added'+(c.inGross?' (in gross)':' (pass-through)')+(c.addonAmount?' · driver addon '+money(c.addonAmount)+' → paystub':'')); } showToast(c.name+' '+money(c.amount)+(editing?' saved':' added')+' — gross '+money(finOf(l).gross)); closeModal(); if(openPanelRefresh) openPanelRefresh(); };
  actions.appendChild(cancel); actions.appendChild(add); modal.appendChild(actions);
  return m;
}

  const read=()=>({name:modal.querySelector('#tName').value.trim(), calc:modal.querySelector('#tCalc').value, unit:modal.querySelector('#tUnit')?modal.querySelector('#tUnit').value.trim():'', amount:Number(modal.querySelector('#tAmount').value)||0, inGross:modal.querySelector('#tGross').classList.contains('on'), billable:modal.querySelector('#tBill').classList.contains('on'), addonMode:modal.querySelector('#tMode').value, addonValue:Number(modal.querySelector('#tAddonVal').value)||0, note:modal.querySelector('#tNote').value.trim()});
  modal.querySelectorAll('#tGross,#tBill').forEach(sw=>sw.onclick=()=>sw.classList.toggle('on'));
  modal.querySelector('#tCalc').onchange=()=>openModal('accTemplateForm', Object.assign({}, ctx, {draft:read()}));
  modal.querySelector('#tMode').onchange=()=>openModal('accTemplateForm', Object.assign({}, ctx, {draft:read()}));
  const actions=el('<div class="actions"></div>');
  const cancel=el('<button class="btn">Cancel</button>'); cancel.onclick=()=>ctx.back?openModal(ctx.back.name, ctx.back.ctx):closeModal();
  const save=el('<button class="btn primary">'+(t?'Save':'Create template')+'</button>');
  save.onclick=()=>{ const x=read(); if(!x.name){ showToast('Template name is required','warning'); return; } if(t){ Object.assign(t, {calc:x.calc, unit:x.calc==='per_hour'?'hour':x.unit, amount:x.amount, inGross:x.inGross, billable:x.billable, addon:{mode:x.addonMode, value:x.addonValue}, note:x.note}); if(!t.system) t.name=x.name; showToast('Template "'+t.name+'" saved'); } else { ACC_TEMPLATES.push({id:'u_'+Date.now(), name:x.name, system:false, calc:x.calc, unit:x.calc==='per_hour'?'hour':x.unit, amount:x.amount, inGross:x.inGross, billable:x.billable, addon:{mode:x.addonMode, value:x.addonValue}, note:x.note, createdBy:CURRENT_USER.name}); showToast('Template "'+x.name+'" created'); } ctx.back?openModal(ctx.back.name, ctx.back.ctx):closeModal(); };
  actions.appendChild(cancel); actions.appendChild(save); modal.appendChild(actions);
  return m;
}

/* ============================================================
   PERMITS — side-panel tab + request/upload flows + AI route
   ============================================================ */
function gmapsRouteUrl(l){
  const wps=[]; (l.permits||[]).forEach(p=>{ if(p.route && p.route.waypoints) wps.push(...p.route.waypoints); });
  if(!wps.length){ const s=l.stops[0], d=l.stops[l.stops.length-1]; return 'https://www.google.com/maps/dir/'+s.lat+','+s.lng+'/'+d.lat+','+d.lng; }
  return 'https://www.google.com/maps/dir/'+wps.map(w=>w.lat+','+w.lng).join('/');
}
function renderPermitsTab(body, l, d, paint){
  const types=haulTypesOf(l);
  let h='';
  // dimensions vs legal limits
  if(l.dims){
    const over=(v,lim)=> v>lim ? '<span style="color:var(--danger-t);font-weight:700">'+v+'</span>' : v;
    h += '<div class="sp-section" style="margin-top:0"><div class="sp-section-title">LOAD DIMENSIONS</div><div class="fin-grid">'+
      '<div class="sp-detail-row"><span class="sp-detail-label">Length</span><span class="sp-detail-value">'+over(l.dims.lengthFt,LEGAL.lengthFt)+' ft <span style="color:var(--text400)">/ '+LEGAL.lengthFt+' legal</span></span></div>'+
      '<div class="sp-detail-row"><span class="sp-detail-label">Width</span><span class="sp-detail-value">'+over(l.dims.widthFt,LEGAL.widthFt)+' ft <span style="color:var(--text400)">/ '+LEGAL.widthFt+'</span></span></div>'+
      '<div class="sp-detail-row"><span class="sp-detail-label">Height</span><span class="sp-detail-value">'+over(l.dims.heightFt,LEGAL.heightFt)+' ft <span style="color:var(--text400)">/ '+LEGAL.heightFt+'</span></span></div>'+
      '<div class="sp-detail-row"><span class="sp-detail-label">Weight</span><span class="sp-detail-value">'+over(l.dims.weightLb,LEGAL.weightLb).toLocaleString?over(l.dims.weightLb,LEGAL.weightLb):(l.dims.weightLb>LEGAL.weightLb?'<span style="color:var(--danger-t);font-weight:700">'+l.dims.weightLb.toLocaleString()+'</span>':l.dims.weightLb.toLocaleString())+' lb <span style="color:var(--text400)">/ '+LEGAL.weightLb.toLocaleString()+'</span></span></div>'+
      '</div><div style="margin-top:8px">'+types.map(t=>'<span class="haul-tag" style="margin-right:6px">'+iconHTML('warning',12)+HAUL_TYPES[t]+'</span>').join('')+'</div></div>';
  }
  // per-state permits
  h += '<div class="sp-section"><div class="sp-section-title" style="display:flex;align-items:center">PERMITS · '+l.permits.length+' state'+(l.permits.length>1?'s':'')+'<span style="flex:1"></span><button class="link-btn" data-a="request">'+iconHTML('send',13)+'Order permits</button><button class="link-btn" data-a="upload">'+iconHTML('upload',13)+'Upload</button></div>';
  l.permits.forEach(p=>{
    const cls = p.status==='received'?'success':(p.status==='requested'?'warning':'danger');
    let inner='';
    if(p.status==='received' && p.route){
      inner += '<div class="perm-route"><div class="pr-t">'+iconHTML('auto_awesome',14,'color:var(--purple)')+'AI-read permitted route</div>'+esc(p.route.summary)+(p.route.mustFollow?' <b>· must be followed exactly</b>':'')+'</div>';
      inner += '<div class="perm-win"><span class="k">TRAVEL DAYS</span><span>'+esc(p.travel.days)+'</span><span class="k">HOURS</span><span>'+esc(p.travel.from)+' – '+esc(p.travel.to)+'</span><span class="k">SPEED</span><span>'+p.travel.speedMax+' mph max</span><span class="k">CURFEW</span><span>'+esc(p.travel.curfew)+'</span></div>';
      if(p.restrictions && p.restrictions.length) inner += '<div class="perm-restr"><b style="font-size:11px;color:var(--text400);letter-spacing:.3px">RESTRICTIONS</b><ul style="margin:4px 0 0;padding-left:18px">'+p.restrictions.map(r=>'<li>'+esc(r)+'</li>').join('')+'</ul></div>';
      inner += '<div class="rs-actions" style="margin-top:10px"><button class="link-btn" data-a="map" data-id="'+p.id+'">'+iconHTML('map',13)+'Show route on Google Maps</button><button class="link-btn" data-a="view" data-id="'+p.id+'">'+iconHTML('description',13)+'View permit</button></div>';
    } else if(p.status==='requested'){
      inner += '<div class="cell-meta" style="margin-top:6px">Ordered '+relTime(p.requested)+' · '+(PERMIT_PROVIDERS.find(x=>x.id===p.provider)||{label:'permit service'}).label+' · ready in '+esc(p.eta||'a few hours')+'. The route and travel hours will be read automatically when it arrives.</div><div class="rs-actions" style="margin-top:8px"><button class="link-btn" data-a="simulate" data-id="'+p.id+'">'+iconHTML('check_circle',13)+'Simulate arrival (demo)</button><button class="link-btn" data-a="upload">Upload instead</button></div>';
    } else {
      inner += '<div class="cell-meta" style="margin-top:6px">Not obtained yet — order it through a permit service, or upload the PDF if you already have it.</div><div class="rs-actions" style="margin-top:8px"><button class="link-btn" data-a="request">'+iconHTML('send',13)+'Order permit</button><button class="link-btn" data-a="upload">'+iconHTML('upload',13)+'Upload</button></div>';
    }
    h += '<div class="perm-row"><div class="pr-head"><span class="perm-dot '+cls+'">'+iconHTML(p.status==='received'?'check':(p.status==='requested'?'schedule':'priority_high'),12)+'</span><span class="pr-state">'+p.state+' · '+HAUL_TYPES[p.type]+'</span><span class="perm-pill '+cls+' pr-badge">'+PERMIT_STATUS[p.status]+(p.number?' · '+p.number:'')+'</span></div>'+inner+'</div>';
  });
  h += '</div>';
  // live compliance (only meaningful with a driver + active permits)
  if(l.driverId && d.permit && d.permit.active>0){
    const off=offRouteMiles(l); const win=travelWindowOf(l);
    const routeOk = off==null || off<=25; const timeOk = !win || win.ok;
    h += '<div class="sp-section"><div class="sp-section-title">LIVE COMPLIANCE</div>'+
      '<div class="sp-banner '+(routeOk?'success':'danger')+'">'+iconHTML(routeOk?'check_circle':'wrong_location',18)+'<div><b>'+(routeOk?'On the permitted route':'Off the permitted route · '+off+' mi from the corridor')+'</b><div style="font-weight:400">'+(routeOk?'Driver position matches the approved corridor':'Oversize loads must stay on the permit route — call the driver now')+'</div></div>'+(routeOk?'':'<button class="link-btn" data-a="callroute">Call</button>')+'</div>'+
      '<div class="sp-banner '+(timeOk?'success':'danger')+'">'+iconHTML(timeOk?'schedule':'nights_stay',18)+'<div><b>'+(timeOk?'Within permitted travel hours':'Outside permitted travel hours')+'</b><div style="font-weight:400">'+(timeOk?'Daylight, allowed day':(win?win.why.join(' · '):''))+'</div></div></div></div>';
  }
  body.innerHTML = h;
  const on=(a,fn)=> body.querySelectorAll('[data-a="'+a+'"]').forEach(b=>b.onclick=()=>fn(b));
  on('request', ()=>openModal('permitRequest',{loadId:l.id}));
  on('upload', ()=>openModal('permitUpload',{loadId:l.id}));
  on('map', (b)=>{ window.open(gmapsRouteUrl(l),'_blank'); showToast('Opening the permitted route in Google Maps'); });
  on('view', ()=>showToast('Permit PDF opens in the lightbox'));
  on('callroute', ()=>showToast('Calling '+(d.drv?d.drv.name:'driver')+' — bring the load back to the corridor','danger'));
  on('simulate', (b)=>{ const p=l.permits.find(x=>x.id===b.dataset.id); simulatePermitArrival(l, p); });
}
function simulatePermitArrival(l, p){
  p.status='received'; p.number=p.state+'-OS-'+(9000+Math.floor(Math.random()*999)); p.issued=NOW; p.expires=new Date(NOW.getTime()+5*86400000);
  // AI "reads" a route + windows from the returned permit
  const s0=l.stops[0], s1=l.stops[l.stops.length-1];
  p.route={summary:'Permit-approved corridor '+s0.st+' → '+s1.st+' (state highways, avoids low bridges)', mustFollow:true, waypoints:[{name:s0.city,lat:s0.lat,lng:s0.lng},{name:'Mid-route checkpoint',lat:(s0.lat+s1.lat)/2,lng:(s0.lng+s1.lng)/2},{name:s1.city,lat:s1.lat,lng:s1.lng}]};
  p.travel={days:'Mon–Sat', from:'30 min after sunrise', to:'30 min before sunset', curfew:'No travel Sun or holidays', speedMax:55};
  p.restrictions=['Amber lights + OVERSIZE banners', p.type==='overheight'?'Height pole required · avoid posted low clearances':'Escort per state rule'];
  logAct(l, p.state+' '+HAUL_TYPES[p.type]+' permit received ('+p.number+') — route and travel windows read by AI');
  showToast(p.state+' permit active — AI mapped the route + travel windows', 'ai');
  render(); if(openPanelRefresh) openPanelRefresh();
}
function modalPermitRequest(ctx){
  const l=loadById(ctx.loadId); const pending=l.permits.filter(p=>p.status==='needed'||p.status==='expired'||p.status==='rejected');
  const states=[...new Set((pending.length?pending:l.permits).map(p=>p.state))];
  const provider = ctx.provider || 'permitservice';
  const m = modalShell('<h2>Order permit'+(states.length>1?'s':'')+'</h2><p class="mdesc">We send the load size to a permit service — it files with each state for you and sends the permit back with its route and travel hours. '+esc(HAUL_TYPES[(l.oversize.types[0])])+' · '+states.join(', ')+'.</p>');
  const modal=m.querySelector('.modal');
  modal.appendChild(el('<div class="field"><label>How do you want to get them?</label></div>'));
  let prov=provider; modal.querySelector('.field').appendChild(createBrandedSelect(PERMIT_PROVIDERS.filter(x=>x.id!=='manual').map(x=>({value:x.id,label:x.label})), provider, (v)=>{ prov=v; }));
  modal.appendChild(el('<div class="field inline"><div><label>Length (ft)</label><input type="number" id="pl" value="'+(l.dims?l.dims.lengthFt:'')+'"/></div><div><label>Width (ft)</label><input type="number" id="pw" value="'+(l.dims?l.dims.widthFt:'')+'"/></div></div>'));
  modal.appendChild(el('<div class="field inline"><div><label>Height (ft)</label><input type="number" id="ph" value="'+(l.dims?l.dims.heightFt:'')+'"/></div><div><label>Weight (lb)</label><input type="number" id="pwt" value="'+(l.dims?l.dims.weightLb:'')+'"/></div></div>'));
  modal.appendChild(el('<div class="field"><label>States</label><input type="text" value="'+states.join(', ')+'" disabled/></div>'));
  modal.appendChild(el('<div class="sp-banner info" style="margin-top:0">'+iconHTML('info',18)+'<div>Usually ready in 2–4 hours; superloads can take a day or two. You will get a notification the moment each permit is active.</div></div>'));
  const actions=el('<div class="actions"></div>');
  const cancel=el('<button class="btn">Cancel</button>'); cancel.onclick=closeModal;
  const send=el('<button class="btn primary">'+iconHTML('send',15)+'Order permit'+(states.length>1?'s':'')+'</button>');
  send.onclick=()=>{ (pending.length?pending:l.permits).forEach(p=>{ p.status='requested'; p.provider=prov; p.requested=NOW; p.eta='2–4 business hours'; }); logAct(l, 'Permits ordered from '+(PERMIT_PROVIDERS.find(x=>x.id===prov)||{label:'permit service'}).label+' for '+states.join(', ')); showToast('Permits ordered · '+states.length+' state'+(states.length>1?'s':'')+' pending', 'warning'); closeModal(); if(openPanelRefresh) openPanelRefresh(); };
  actions.appendChild(cancel); actions.appendChild(send); modal.appendChild(actions);
  return m;
}
function modalPermitUpload(ctx){
  const l=loadById(ctx.loadId); const pending=l.permits.filter(p=>p.status!=='received');
  const m = modalShell('<h2>Upload permit</h2><p class="mdesc">Attach the permit PDF you received. AI reads the approved route, travel days/hours and restrictions and puts them on the map automatically.</p>');
  const modal=m.querySelector('.modal');
  modal.appendChild(el('<div class="field"><label>Which permit?</label></div>'));
  let pick = ctx.pick || (pending[0] ? pending[0].id : (l.permits[0]&&l.permits[0].id));
  modal.querySelector('.field').appendChild(createBrandedSelect(l.permits.map(p=>({value:p.id,label:p.state+' · '+HAUL_TYPES[p.type]+' · '+PERMIT_STATUS[p.status]})), pick, (v)=>{ pick=v; }));
  modal.appendChild(el('<div class="field"><label>Permit number</label><input type="text" id="pnum" placeholder="e.g. CO-OS-4471"/></div>'));
  const drop=el('<div class="dropzone" style="border:1.5px dashed var(--border);border-radius:12px;padding:26px;text-align:center;color:var(--text400);cursor:pointer">'+iconHTML('upload_file',34,'color:var(--border2)')+'<div style="margin-top:8px;font-size:13px">Tap to choose the permit PDF</div></div>');
  let uploaded=false; drop.onclick=()=>{ uploaded=true; drop.innerHTML=iconHTML('task',30,'color:var(--accent)')+'<div style="margin-top:6px;font-size:13px;color:var(--text900);font-weight:600">permit.pdf · captured</div><div class="ai-line" style="justify-content:center;margin-top:6px">'+iconHTML('auto_awesome',14)+'AI is reading the route and travel windows…</div>'; };
  modal.appendChild(drop);
  const actions=el('<div class="actions"></div>');
  const cancel=el('<button class="btn">Cancel</button>'); cancel.onclick=closeModal;
  const save=el('<button class="btn primary">Save & read with AI</button>');
  save.onclick=()=>{ if(!uploaded){ showToast('Choose the permit file first','warning'); return; } const p=l.permits.find(x=>x.id===pick); p.number=modal.querySelector('#pnum').value.trim()||p.state+'-'+Math.floor(1000+Math.random()*8999); simulatePermitArrival(l, p); closeModal(); };
  actions.appendChild(cancel); actions.appendChild(save); modal.appendChild(actions);
  return m;
}

/* ============================================================
   KEYBOARD SHORTCUTS (list-level; ignored while typing or in a modal)
   ============================================================ */
document.addEventListener('keydown', (e)=>{
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  const typing = tag==='INPUT' || tag==='TEXTAREA' || tag==='SELECT' || (document.activeElement && document.activeElement.isContentEditable);
  if(state.modal || typing) return;
  if(e.key==='/'){ e.preventDefault(); const s=document.getElementById('loadSearch'); if(s){ s.focus(); s.select(); } return; }
  if(e.key==='?'){ const kb=document.querySelector('.doc-toolbar .icon-btn[title^="Keyboard"]'); if(kb) openShortcutsFlyout(kb); return; }
  const rows = buildRows(); const pageRows = state.perPage ? rows.slice((state.page-1)*state.perPage, state.page*state.perPage) : rows;
  if(!pageRows.length) return;
  const idx = pageRows.findIndex(r=>r.l.id===state.cursor);
  const key = e.key.toLowerCase();
  if(e.key==='ArrowDown' || e.key==='ArrowUp'){
    e.preventDefault();
    const n = e.key==='ArrowDown' ? Math.min(pageRows.length-1, idx+1) : Math.max(0, idx-1);
    state.cursor = pageRows[n].l.id;
    document.querySelectorAll('tr[data-id]').forEach(tr=>tr.classList.toggle('cursor', tr.dataset.id===state.cursor));
    const tr=document.querySelector('tr[data-id="'+state.cursor+'"]'); if(tr) tr.scrollIntoView({block:'nearest'});
    if(state.openLoadId){ openLoadPanel(pageRows[n].l); }
    return;
  }
  const cur = state.cursor ? loadById(state.cursor) : null;
  if(e.key==='Enter' && cur){ openLoadPanel(cur); return; }
  if(e.key===' ' && cur){ e.preventDefault(); const i=pageRows.findIndex(r=>r.l.id===cur.id); toggleSelect(cur.id, i, false, pageRows); return; }
  if(key==='n'){ openModal('addLoad',{step:'method'}); return; }
  if(key==='f'){ openModal('filters'); return; }
  if(key==='m'){ state.viewMode = state.viewMode==='list'?'map':'list'; render(); return; }
  if(key==='a'){ const ids=[...state.selected]; if(ids.length) openModal('assign', {loadId:ids[0], bulkIds:ids}); else if(cur) openModal('assign',{loadId:cur.id}); return; }
});

/* ============================================================
   DESKTOP SCALING (07 §10 — verbatim from DOC)
   ============================================================ */
function applyDesktopScale(){
  const DESIGN_WIDTH = 1320, DESIGN_HEIGHT = 1040;
  const scale = window.innerWidth / DESIGN_WIDTH;
  currentAppScale = scale;
  if('zoom' in document.body.style){
    app.style.transform = ''; app.style.zoom = scale;
    document.body.style.width = ''; document.body.style.height = '';
  } else {
    app.style.transformOrigin = 'top left'; app.style.transform = 'scale('+scale+')';
    document.body.style.width = (DESIGN_WIDTH*scale)+'px'; document.body.style.height = (DESIGN_HEIGHT*scale)+'px';
  }
  document.querySelectorAll('.zoom-sync').forEach(elz=>{ elz.style.zoom = scale; });
}

applyView(VIEWS[0]);
render();
applyDesktopScale();
window.addEventListener('resize', applyDesktopScale);
