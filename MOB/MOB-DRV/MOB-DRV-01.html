<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EasyWay Driver">
<meta name="theme-color" content="#2e2a5c">
<title>MOB-DRV-01 — EasyWay Driver (Mobile Mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
<style>
:root{
  --accent:#48C876; --info:#56a8dd; --warning:#FFAD20; --danger:#E82C3F; --purple:#7852F7; --accentBlue:#2E5BFF;
  --rail:#2e2a5c; --text900:#333761; --text600:#666989; --text400:#9a9ab0; --neutral300:#b3b4c4; --neutral200:#d0d0da;
  --border:#e5e6eb; --border2:#eeeef2; --rowBorder:#f0f0f4; --headerBg:#fafafc;
  --bg50:#f5f5f7; --white:#fff;
  --success-bg:#eafcf1; --success-t:#1e8e5a;
  --warning-bg:#fff5e6; --warning-t:#a85e00;
  --danger-bg:#fdecec; --danger-t:#c22b2b;
  --neutral-bg:#f0f0f4; --neutral-t:#666989;
  --accent-dark:#1e8e5a; --info-bg:#eef4fb; --purple-bg:#efeafe; --selected-bg:#f4fdf7;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{font-family:'Source Sans 3',sans-serif;color:var(--text900);background:var(--bg50);font-size:15px;line-height:1.4;overscroll-behavior:none;}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-variation-settings:'FILL' 0;font-weight:normal;font-style:normal;line-height:1;display:inline-block;white-space:nowrap;-webkit-font-smoothing:antialiased;}
.material-symbols-outlined.icon-filled{font-variation-settings:'FILL' 1;}
#frame{position:fixed;inset:0;background:var(--bg50);overflow:hidden;}
#app{position:absolute;inset:0;display:flex;flex-direction:column;}
/* Desktop preview: a phone bezel; on a real phone the app is edge-to-edge */
@media (min-width:600px){
  body{background:#e6e6ec;}
  #frame{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:390px;height:844px;border-radius:46px;border:10px solid #1a1830;box-shadow:0 30px 80px rgba(0,0,0,.35);inset:auto;}
  #frame:before{content:'';position:absolute;top:10px;left:50%;transform:translateX(-50%);width:120px;height:30px;background:#1a1830;border-radius:0 0 18px 18px;z-index:50;}
  :root{--sat:34px;--sab:18px;}
  .desk-hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);font-size:12px;color:var(--text400);text-align:center;}
}
@media (max-width:599px){ .desk-hint{display:none;} }

/* Header */
.m-header{flex-shrink:0;background:#fff;padding:calc(var(--sat) + 8px) 12px 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border2);min-height:calc(var(--sat) + 56px);}
.m-header.dark{background:var(--rail);color:#fff;border-bottom:none;}
.m-header .h-title{font-size:18px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.m-header .h-sub{font-size:12.5px;color:var(--text400);font-weight:400;display:block;margin-top:1px;}
.m-header.dark .h-sub{color:rgba(255,255,255,.6);}
.icon-btn{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--text900);cursor:pointer;background:none;border:none;position:relative;flex-shrink:0;}
.icon-btn:active{background:var(--bg50);}
.m-header.dark .icon-btn{color:#fff;}
.icon-btn .badge{position:absolute;top:6px;right:6px;min-width:16px;height:16px;border-radius:8px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid #fff;}
.m-header.dark .icon-btn .badge{border-color:var(--rail);}

/* Screen body */
.m-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px calc(var(--sab) + 84px);animation:fadeIn .18s ease;}
.m-body.no-tabs{padding-bottom:calc(var(--sab) + 24px);}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.section{font-size:11px;font-weight:700;letter-spacing:.4px;color:var(--text400);margin:16px 2px 8px;display:flex;align-items:center;gap:8px;}
.section .spacer{flex:1;} .section a{color:var(--accent-dark);font-weight:600;letter-spacing:0;font-size:13px;text-transform:none;}
.card{background:#fff;border:1px solid var(--border2);border-radius:16px;padding:14px;margin-bottom:10px;}
.card.tap{cursor:pointer;} .card.tap:active{background:var(--bg50);}
.card.accent{border-color:#bfe9d0;background:var(--selected-bg);}
.card.warn{border-color:#f3dcb0;background:var(--warning-bg);}
.card.danger{border-color:#f5c2c2;background:var(--danger-bg);}
.card.purple{border-color:#d9cffb;background:var(--purple-bg);}
.card h3{margin:0 0 4px;font-size:16px;font-weight:700;}
.card .sub{font-size:13px;color:var(--text600);}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--rowBorder);font-size:14px;}
.kv:last-child{border-bottom:none;} .kv .k{color:var(--text600);} .kv .v{font-weight:600;text-align:right;}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--rowBorder);cursor:pointer;}
.row:last-child{border-bottom:none;} .row:active{opacity:.7;}
.row .r-icon{width:40px;height:40px;border-radius:12px;background:var(--bg50);display:flex;align-items:center;justify-content:center;color:var(--text900);flex-shrink:0;}
.row .r-icon.ok{background:var(--success-bg);color:var(--success-t);} .row .r-icon.warn{background:var(--warning-bg);color:var(--warning-t);} .row .r-icon.bad{background:var(--danger-bg);color:var(--danger-t);} .row .r-icon.info{background:var(--info-bg);color:var(--info);} .row .r-icon.ai{background:var(--purple-bg);color:var(--purple);}
.row .r-main{flex:1;min-width:0;} .row .r-title{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;} .row .r-sub{font-size:12.5px;color:var(--text600);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
.row .r-right{text-align:right;flex-shrink:0;font-size:13px;color:var(--text400);display:flex;align-items:center;gap:4px;}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;white-space:nowrap;}
.pill.success{background:var(--success-bg);color:var(--success-t);} .pill.warning{background:var(--warning-bg);color:var(--warning-t);} .pill.danger{background:var(--danger-bg);color:var(--danger-t);} .pill.info{background:var(--info-bg);color:var(--info);} .pill.neutral{background:var(--neutral-bg);color:var(--neutral-t);} .pill.purple{background:var(--purple-bg);color:var(--purple);} .pill.dashed{background:#fff;border:1px dashed var(--border);color:var(--text400);}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:48px;border-radius:14px;border:1px solid var(--border);background:#fff;color:var(--text900);font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;}
.btn:active{background:var(--bg50);} .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;} .btn.primary:active{background:#3fb96a;} .btn.danger{background:var(--danger);border-color:var(--danger);color:#fff;} .btn.dark{background:var(--text900);border-color:var(--text900);color:#fff;} .btn.purple{background:var(--purple);border-color:var(--purple);color:#fff;} .btn:disabled{opacity:.45;pointer-events:none;}
.btn-row{display:flex;gap:10px;margin-top:10px;} .btn-row .btn{flex:1;}
.btn.sm{height:40px;font-size:14px;border-radius:12px;}
.link{color:var(--accent-dark);font-weight:600;font-size:14px;cursor:pointer;background:none;border:none;font-family:inherit;padding:0;}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.quick .q{background:#fff;border:1px solid var(--border2);border-radius:14px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--text900);cursor:pointer;text-align:center;}
.quick .q .material-symbols-outlined{font-size:24px;} .quick .q:active{background:var(--bg50);}
.seg{display:flex;background:var(--neutral-bg);border-radius:12px;padding:3px;margin-bottom:12px;}
.seg button{flex:1;border:none;background:none;height:34px;border-radius:10px;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--text600);cursor:pointer;}
.seg button.active{background:#fff;color:var(--text900);box-shadow:0 1px 3px rgba(0,0,0,.08);}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;} .chips::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;border:1px solid var(--border);border-radius:20px;padding:8px 14px;font-size:13.5px;font-weight:600;background:#fff;cursor:pointer;white-space:nowrap;} .chip.active{background:var(--text900);color:#fff;border-color:var(--text900);}
.stat3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.stat{background:#fff;border:1px solid var(--border2);border-radius:14px;padding:10px 8px;text-align:center;} .stat .n{font-size:20px;font-weight:700;} .stat .l{font-size:11px;font-weight:700;letter-spacing:.3px;color:var(--text400);}
.ai{display:flex;gap:8px;align-items:flex-start;color:var(--purple);font-size:13px;font-weight:600;}

/* HOS */
.hos{display:flex;flex-direction:column;gap:9px;}
.hos-row{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text600);}
.hos-row .lbl{width:44px;font-weight:600;color:var(--text900);} .hos-row .val{width:66px;font-weight:700;color:var(--text900);text-align:right;}
.hos-bar{flex:1;height:8px;border-radius:4px;background:var(--border2);overflow:hidden;} .hos-bar i{display:block;height:100%;background:var(--accent);border-radius:4px;} .hos-bar i.warn{background:var(--warning);} .hos-bar i.danger{background:var(--danger);}
.big-clock{text-align:center;padding:10px 0 6px;} .big-clock .t{font-size:44px;font-weight:700;letter-spacing:-1px;line-height:1;} .big-clock .l{font-size:12px;font-weight:700;letter-spacing:.4px;color:var(--text400);margin-top:4px;}
.duty{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.duty button{height:52px;border-radius:14px;border:1px solid var(--border);background:#fff;font-family:inherit;font-size:13px;font-weight:700;color:var(--text600);cursor:pointer;} .duty button.active{background:var(--text900);color:#fff;border-color:var(--text900);}
.log{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--border2);} .log span{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;} .log .off{background:var(--neutral300);} .log .sb{background:var(--info);} .log .dr{background:var(--accent);} .log .on{background:var(--warning);}
.log-hours{display:flex;justify-content:space-between;font-size:10px;color:var(--text400);margin-top:4px;}

/* Load / stops */
.load-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;} .load-head .num{font-size:20px;font-weight:700;}
.route{font-size:15px;font-weight:600;} .route .arrow{color:var(--text400);margin:0 6px;}
.stops{margin-top:6px;} .stop{display:flex;gap:12px;padding:10px 0;position:relative;}
.stop .dot{width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--border);flex-shrink:0;margin-top:5px;background:var(--info);} .stop .dot.delivery{background:var(--accent);} .stop .dot.done{background:var(--text400);} .stop .dot.here{box-shadow:0 0 0 3px rgba(72,200,118,.35);}
.stop:not(:last-child):before{content:'';position:absolute;left:6px;top:24px;bottom:-10px;width:2px;background:var(--border2);}
.stop .s-body{flex:1;min-width:0;} .stop .s-title{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap;} .stop .s-addr{font-size:13px;color:var(--text600);margin-top:2px;} .stop .s-time{font-size:13px;margin-top:4px;} .stop .s-time b{font-weight:600;} .stop .s-time.late{color:var(--danger-t);}
.stop .s-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;} .stop .s-actions .btn{width:auto;flex:1;height:40px;font-size:13.5px;border-radius:12px;padding:0 10px;}
.eta-box{display:flex;gap:10px;align-items:center;background:var(--bg50);border-radius:12px;padding:10px 12px;margin-top:8px;} .eta-box .e-main{font-size:15px;font-weight:700;} .eta-box .e-sub{font-size:12.5px;color:var(--text600);}
.timer{font-variant-numeric:tabular-nums;}

/* Messages */
.thread{display:flex;flex-direction:column;gap:8px;} .msg{max-width:84%;padding:10px 13px;border-radius:16px;font-size:14.5px;line-height:1.35;} .msg.in{background:#fff;border:1px solid var(--border2);align-self:flex-start;border-bottom-left-radius:5px;} .msg.out{background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:5px;} .msg .m-meta{font-size:11px;opacity:.7;margin-top:3px;} .msg.sys{align-self:center;background:none;color:var(--text400);font-size:12px;text-align:center;}
.composer{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border2);padding:8px 10px calc(var(--sab) + 8px);display:flex;gap:8px;align-items:flex-end;}
.composer textarea{flex:1;border:1px solid var(--border);border-radius:14px;padding:11px 14px;font-family:inherit;font-size:15px;resize:none;height:44px;max-height:110px;outline:none;color:var(--text900);}
.composer .send{width:44px;height:44px;border-radius:14px;background:var(--accent);color:#fff;border:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tpl-row{display:flex;gap:8px;overflow-x:auto;padding:0 0 8px;scrollbar-width:none;} .tpl-row::-webkit-scrollbar{display:none;}

/* Documents / photos */
.doc-thumb{width:100%;height:150px;border-radius:12px;background:repeating-linear-gradient(0deg,#fff 0 12px,#f2f2f6 12px 14px);border:1px solid var(--border2);position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:10px;color:var(--text400);font-size:12px;}
.doc-thumb:before{content:'';position:absolute;left:12px;top:12px;width:60%;height:10px;background:#dcdce4;border-radius:4px;} .doc-thumb:after{content:'';position:absolute;left:12px;top:28px;width:40%;height:8px;background:#e6e6ee;border-radius:4px;}
.doc-thumb .stamp{position:absolute;right:14px;top:14px;border:2px solid var(--accent);color:var(--accent-dark);font-weight:700;font-size:12px;padding:3px 8px;border-radius:6px;transform:rotate(-8deg);opacity:.85;}
.camera{background:#1a1830;border-radius:16px;height:230px;position:relative;display:flex;align-items:center;justify-content:center;color:#fff;overflow:hidden;}
.camera .vf{position:absolute;inset:26px;border:2px solid rgba(255,255,255,.5);border-radius:10px;} .camera .vf i{position:absolute;width:22px;height:22px;border:3px solid var(--accent);} .camera .vf i.tl{left:-3px;top:-3px;border-right:none;border-bottom:none;} .camera .vf i.tr{right:-3px;top:-3px;border-left:none;border-bottom:none;} .camera .vf i.bl{left:-3px;bottom:-3px;border-right:none;border-top:none;} .camera .vf i.br{right:-3px;bottom:-3px;border-left:none;border-top:none;}
.camera .hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:12px;opacity:.8;}
.shutter{width:66px;height:66px;border-radius:50%;background:#fff;border:5px solid #d0d0da;margin:14px auto 0;cursor:pointer;display:block;}

/* Checklist */
.chk{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--rowBorder);}
.chk:last-child{border-bottom:none;} .chk .c-name{flex:1;font-size:15px;} .chk .c-btns{display:flex;gap:6px;} .chk .c-btns button{height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--border);background:#fff;font-family:inherit;font-size:13px;font-weight:600;color:var(--text600);cursor:pointer;} .chk .c-btns button.pass.on{background:var(--success-bg);border-color:var(--accent);color:var(--success-t);} .chk .c-btns button.def.on{background:var(--danger-bg);border-color:var(--danger);color:var(--danger-t);}
.progress{height:6px;border-radius:3px;background:var(--border2);overflow:hidden;margin:8px 0 4px;} .progress i{display:block;height:100%;background:var(--accent);}

/* Forms */
.field{margin-bottom:12px;} .field label{display:block;font-size:12.5px;font-weight:700;color:var(--text600);margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;height:48px;border:1px solid var(--border);border-radius:14px;padding:0 14px;font-family:inherit;font-size:15px;color:var(--text900);background:#fff;outline:none;} .field textarea{height:96px;padding:12px 14px;resize:none;} .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--info);}
.field.inline{display:flex;gap:10px;} .field.inline>div{flex:1;}
.switch-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--rowBorder);font-size:15px;} .switch-row:last-child{border-bottom:none;}
.switch{width:46px;height:26px;border-radius:13px;background:var(--neutral200);position:relative;cursor:pointer;transition:background .15s;flex-shrink:0;} .switch.on{background:var(--accent);} .switch .knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2);} .switch.on .knob{left:23px;}

/* Tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border2);display:flex;padding:6px 6px calc(var(--sab) + 6px);z-index:20;}
.tabbar .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--text400);cursor:pointer;padding:4px 0;position:relative;}
.tabbar .tab.active{color:var(--accent-dark);} .tabbar .tab .material-symbols-outlined{font-size:24px;}
.tabbar .tab .dot{position:absolute;top:2px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid #fff;}

/* Sheet + toast */
.scrim{position:absolute;inset:0;background:rgba(46,42,92,.45);z-index:40;display:flex;align-items:flex-end;animation:fadeIn .15s;}
.sheet{width:100%;background:#fff;border-radius:22px 22px 0 0;padding:10px 16px calc(var(--sab) + 16px);max-height:88%;overflow-y:auto;animation:slideUp .2s ease;}
@keyframes slideUp{from{transform:translateY(40px);opacity:.6;}to{transform:none;opacity:1;}}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--neutral200);margin:0 auto 12px;}
.sheet h3{margin:0 0 4px;font-size:18px;} .sheet .sub{font-size:13.5px;color:var(--text600);margin-bottom:12px;}
.toast-m{position:absolute;left:14px;right:14px;bottom:calc(var(--sab) + 90px);background:var(--text900);color:#fff;border-radius:14px;padding:12px 14px;font-size:14px;font-weight:600;z-index:60;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:slideUp .2s;} .toast-m .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0;} .toast-m .dot.warning{background:var(--warning);} .toast-m .dot.danger{background:var(--danger);} .toast-m .dot.ai{background:var(--purple);}
.avatar{width:44px;height:44px;border-radius:50%;background:#dbeafe;color:#3b82c4;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.avatar.lg{width:72px;height:72px;font-size:24px;}
.brand{display:flex;align-items:center;gap:8px;justify-content:center;} .brand .wordmark{font-weight:700;font-size:22px;color:#fff;letter-spacing:-.3px;}
.signin{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 24px calc(var(--sab) + 24px);background:var(--rail);color:#fff;}
.signin .card{background:#fff;color:var(--text900);margin-top:22px;}
.empty{text-align:center;color:var(--text400);padding:40px 20px;font-size:14px;} .empty .material-symbols-outlined{font-size:44px;color:var(--border);}
.unread{font-weight:700;} .r-title .unread-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:middle;}

</style>
</head>
<body>
<div id="frame"><div id="app"></div></div>
<div class="desk-hint">Open this page on your phone for the full-screen experience · MOB-DRV-01</div>
<script>
/* ============================================================
   EasyWay Driver — mobile mockup (MOB-DRV-01). Hash router, one state, no libraries.
   ============================================================ */
const NOW = new Date(2026, 8, 9, 9, 40);
function D(d, h, m){ return new Date(2026, 8, 9 + d, h, m||0); }
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function fmtTime(d){ if(!d) return '—'; let h=d.getHours(), m=d.getMinutes(); const ap=h>=12?'PM':'AM'; h=h%12; if(h===0) h=12; return h+':'+(m<10?'0':'')+m+' '+ap; }
function fmtDate(d){ return MONTHS[d.getMonth()]+' '+d.getDate(); }
function fmtDay(d){ const same=d.toDateString()===NOW.toDateString(); const tom=new Date(NOW); tom.setDate(tom.getDate()+1); return same?'Today':(d.toDateString()===tom.toDateString()?'Tomorrow':DOW[d.getDay()]+' '+fmtDate(d)); }
function fmtDayTime(d){ return fmtDay(d)+' '+fmtTime(d); }
function fmtDur(min){ min=Math.round(Math.abs(min)); const h=Math.floor(min/60), m=min%60; if(!h) return m+'m'; if(!m) return h+'h'; return h+'h '+(m<10?'0':'')+m+'m'; }
function relTime(d){ const diff=(d-NOW)/60000; if(Math.abs(diff)<1) return 'now'; return diff<0 ? fmtDur(-diff)+' ago' : 'in '+fmtDur(diff); }
function money(n){ return '$'+Math.round(n).toLocaleString('en-US'); }
function apptText(a){ if(a.type==='hard') return fmtDayTime(a.start)+' · hard appt'; return fmtDayTime(a.start)+'–'+fmtTime(a.end)+(a.type==='fcfs'?' · FCFS':' · window'); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function ic(name, size, extra, filled){ return '<span class="material-symbols-outlined'+(filled?' icon-filled':'')+'" style="font-size:'+(size||22)+'px;'+(extra||'')+'">'+name+'</span>'; }

function nextStop(l){ return l.stops.find(s=>!s.departed) || null; }

function activeLoad(){ return loads.find(l=>['at_pickup','in_transit','at_delivery'].includes(l.status)) || null; }
function etaOf(l){ const n=nextStop(l); if(!n || n.arrived || !n.milesLeft) return null; return new Date(NOW.getTime() + n.milesLeft/55*3600000); }
function liveMinutes(base){ return (NOW - base)/60000 + (Date.now()-state.timerBase)/60000; }

function render(){

  if(!signedIn && r.name!=='signin'){ location.replace('#/signin'); return; }
  app.innerHTML='';

  const top = ['home','loads','messages','docs','more'].includes(r.name);
  if(top) app.appendChild(tabbar(r.name));

}
function header(title, opts){
  opts=opts||{};
  const h = document.createElement('div'); h.className='m-header'+(opts.dark?' dark':'');
  h.innerHTML = (opts.back?'<button class="icon-btn" data-back>'+ic('arrow_back',24)+'</button>':'')+(opts.left||'')+'<div class="h-title">'+title+(opts.sub?'<span class="h-sub">'+opts.sub+'</span>':'')+'</div>'+(opts.right||'');
  const b=h.querySelector('[data-back]'); if(b) b.onclick=back;
  return h;
}
function body(html, noTabs){ const b=document.createElement('div'); b.className='m-body'+(noTabs?' no-tabs':''); b.innerHTML=html; return b; }
function bind(node){
  node.querySelectorAll('[data-go]').forEach(n=>{ n.addEventListener('click', (e)=>{ e.stopPropagation(); go(n.dataset.go); }); });
  node.querySelectorAll('[data-toast]').forEach(n=>{ n.addEventListener('click', (e)=>{ e.stopPropagation(); toast(n.dataset.toast, n.dataset.tone||''); }); });
}
function tabbar(active){
  const unread = threads.reduce((s,t)=>s+t.unread,0); const needs = loads.filter(l=>l.status==='dispatched').length;
  const tabs=[['home','home','Home'],['loads','route','Loads'],['messages','chat','Messages'],['docs','description','Docs'],['more','menu','More']];
  const bar = document.createElement('div'); bar.className='tabbar';
  bar.innerHTML = tabs.map(([k,i,l])=>'<div class="tab'+(k===active?' active':'')+'" data-go="#/'+k+'">'+ic(i,24,'',k===active)+l+((k==='messages'&&unread)||(k==='loads'&&needs)?'<span class="dot"></span>':'')+'</div>').join('');
  bind(bar); return bar;
}
function toast(msg, tone){ document.querySelectorAll('.toast-m').forEach(t=>t.remove()); const t=document.createElement('div'); t.className='toast-m'; t.innerHTML='<span class="dot '+(tone||'')+'"></span><span>'+msg+'</span>'; app.appendChild(t); setTimeout(()=>t.remove(), 2800); }
function openSheet(html, onOpen){
  closeSheet(false);

}

function scrPti(){
  app.appendChild(header('Inspection', {back:true, sub:'Truck '+ME.truck.unit+' · Trailer '+ME.trailer.unit}));
  const total=PTI_ITEMS.reduce((s,[,items])=>s+items.length,0); const done=Object.keys(ptiState).length; const defects=Object.values(ptiState).filter(v=>v==='def').length;
  let h='<div class="card"><div style="display:flex;align-items:center;gap:8px"><h3 style="margin:0;flex:1">Post-trip inspection</h3><span class="pill '+(pti.postDone?'success':'info')+'">'+(pti.postDone?'Done '+fmtTime(pti.postDone):'Due end of shift')+'</span></div><div class="sub">Pre-trip done today at '+fmtTime(pti.preDone)+'. Tap Pass or Defect on every item — defects need a photo and go straight to the shop.</div><div class="progress"><i style="width:'+(done/total*100)+'%"></i></div><div class="sub">'+done+' of '+total+' checked'+(defects?' · <span style="color:var(--danger-t);font-weight:600">'+defects+' defect'+(defects>1?'s':'')+'</span>':'')+'</div></div>';
  h += '<div class="card purple"><div class="ai">'+ic('auto_awesome',18)+'<span>Photo assist: point the camera at each tire — tread depth and uneven wear are checked automatically. Last check flagged the front-left tire at 5/32.</span></div></div>';
  PTI_ITEMS.forEach(([sec, items])=>{ h += '<div class="section">'+sec.toUpperCase()+'</div><div class="card" style="padding:2px 14px">'+items.map(it=>{ const v=ptiState[it]||''; return '<div class="chk"><span class="c-name">'+esc(it)+'</span><div class="c-btns"><button class="pass '+(v==='pass'?'on':'')+'" data-it="'+esc(it)+'" data-v="pass">Pass</button><button class="def '+(v==='def'?'on':'')+'" data-it="'+esc(it)+'" data-v="def">Defect</button></div></div>'; }).join('')+'</div>'; });
  h += '<div class="btn-row" style="margin-top:14px"><button class="btn" id="allpass">Mark all pass</button><button class="btn primary" id="submit" '+(done<total?'disabled':'')+'>'+ic('verified',20)+'Submit</button></div>';
  const b=body(h, true); app.appendChild(b); bind(b);
  b.querySelectorAll('[data-it]').forEach(x=>x.onclick=()=>{ const it=x.dataset.it, v=x.dataset.v; if(v==='def'){ openSheet('<h3>Defect · '+esc(it)+'</h3><div class="sub">Photo + a short note. The shop and Safety are notified; a work order opens on truck '+ME.truck.unit+'.</div>'+cameraHtml(it)+'<div class="field" style="margin-top:12px"><label>Note</label><input type="text" id="note" placeholder="e.g. Left turn signal not blinking"/></div><div class="switch-row"><span>Truck is safe to drive</span><span class="switch on" id="safe"><span class="knob"></span></span></div><button class="btn danger" id="ok" disabled>Report defect</button>', (sh)=>{ sh.querySelector('#safe').onclick=(e)=>e.currentTarget.classList.toggle('on'); wireCamera(sh, ()=>{ ptiState[it]='def'; pti.defects.push({it, note:sh.querySelector('#note').value}); closeSheet(); toast('Defect reported · work order created','warning'); render(); }); }); } else { ptiState[it]='pass'; render(); } });
  b.querySelector('#allpass').onclick=()=>{ PTI_ITEMS.forEach(([,items])=>items.forEach(it=>{ if(!ptiState[it]) ptiState[it]='pass'; })); render(); };
  b.querySelector('#submit').onclick=()=>{ pti.postDone=NOW; tasks=tasks.filter(t=>t.id!=='t1'); toast('Inspection submitted · '+(defects?defects+' defect'+(defects>1?'s':'')+' sent to the shop':'no defects')); go('#/home'); };
}
