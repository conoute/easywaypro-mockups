<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[TL-XXX-YY] — [Feature Name] — Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#48C876;
    --accent-dark:#379a5c;
    --info:#56a8dd;
    --warning:#FFAD20;
    --danger:#E82C3F;
    --ai:#7852F7;
    --text-900:#333761;
    --text-400:#9a9ab0;
    --bg-50:#f5f5f7;
    --bg-100:#eeeef2;
    --white:#ffffff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Source Sans 3', sans-serif;
    background:var(--bg-50);
    color:var(--text-900);
    padding:32px 16px 80px;
  }
  .wrap{max-width:880px;margin:0 auto;}
  .header{
    margin-bottom:28px;
  }
  .eyebrow{
    color:var(--info);
    font-weight:700;
    font-size:13px;
    letter-spacing:0.02em;
  }
  h1{
    font-size:26px;
    font-weight:700;
    margin:4px 0 6px;
  }
  .sub{
    color:var(--text-400);
    font-size:14px;
    line-height:1.5;
    max-width:620px;
  }
  .progress-row{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:18px;
  }
  .progress-track{
    flex:1;
    height:8px;
    background:var(--bg-100);
    border-radius:8px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--accent);
    width:0%;
    transition:width .3s ease;
  }
  .progress-label{
    font-size:13px;
    font-weight:600;
    color:var(--text-900);
    white-space:nowrap;
  }
  .section{
    background:var(--white);
    border-radius:14px;
    margin-bottom:18px;
    overflow:hidden;
    border:1px solid var(--bg-100);
  }
  .section-head{
    padding:16px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    user-select:none;
  }
  .section-head:hover{background:var(--bg-50);}
  .section-title{
    font-size:16px;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .section-letter{
    width:26px;height:26px;
    border-radius:7px;
    background:var(--text-900);
    color:white;
    font-size:13px;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .section-count{
    font-size:12px;
    color:var(--text-400);
    font-weight:600;
  }
  .chevron{
    transition:transform .2s ease;
    color:var(--text-400);
  }
  .section.open .chevron{transform:rotate(180deg);}
  .section-body{
    max-height:0;
    overflow:hidden;
    transition:max-height .25s ease;
  }
  .section.open .section-body{max-height:6000px;}
  .item{
    padding:18px 20px;
    border-top:1px solid var(--bg-100);
  }
  .item-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
    margin-bottom:4px;
  }
  .item-num{
    font-size:11px;
    font-weight:700;
    color:var(--text-400);
  }
  .item-title{
    font-size:14.5px;
    font-weight:600;
    color:var(--text-900);
  }
  .item-question{
    font-size:12.5px;
    color:var(--text-400);
    margin-bottom:10px;
  }
  .yn{
    display:flex;
    gap:6px;
    flex-shrink:0;
  }
  .yn button{
    border:1.5px solid var(--bg-100);
    background:var(--white);
    color:var(--text-400);
    font-size:12px;
    font-weight:700;
    padding:5px 12px;
    border-radius:7px;
    cursor:pointer;
  }
  .yn button.active-yes{
    background:var(--accent);
    border-color:var(--accent);
    color:white;
  }
  .yn button.active-no{
    background:var(--danger);
    border-color:var(--danger);
    color:white;
  }
  .options{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin:10px 0;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--bg-50);
    border:1px solid var(--bg-100);
    border-radius:20px;
    padding:6px 12px 6px 8px;
    font-size:12.5px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .opt input{accent-color:var(--accent);cursor:pointer;}
  .opt.checked{
    background:rgba(72,200,118,0.12);
    border-color:var(--accent);
    color:var(--accent-dark);
    font-weight:600;
  }
  .no-options{
    font-size:12px;
    color:var(--text-400);
    font-style:italic;
    margin:6px 0;
  }
  textarea{
    width:100%;
    border:1px solid var(--bg-100);
    border-radius:9px;
    padding:10px 12px;
    font-family:inherit;
    font-size:13px;
    color:var(--text-900);
    resize:vertical;
    min-height:44px;
    margin-top:4px;
  }
  textarea:focus{outline:2px solid var(--info);outline-offset:1px;}
  .notes-label{
    font-size:11px;
    color:var(--text-400);
    font-weight:600;
    margin-top:8px;
    display:block;
  }
  .footer-bar{
    position:sticky;
    bottom:16px;
    display:flex;
    justify-content:center;
    margin-top:24px;
  }
  .export-btn{
    background:var(--text-900);
    color:white;
    border:none;
    padding:13px 28px;
    border-radius:10px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 8px 24px rgba(51,55,97,0.25);
  }
  .export-btn:hover{background:#292c50;}
  .modal-bg{
    display:none;
    position:fixed;inset:0;
    background:rgba(51,55,97,0.45);
    align-items:center;justify-content:center;
    padding:20px;
    z-index:50;
  }
  .modal-bg.show{display:flex;}
  .modal{
    background:white;
    border-radius:14px;
    max-width:640px;
    width:100%;
    max-height:80vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .modal-head{
    padding:16px 20px;
    border-bottom:1px solid var(--bg-100);
    display:flex;justify-content:space-between;align-items:center;
  }
  .modal-head h3{margin:0;font-size:15px;}
  .modal-close{
    border:none;background:var(--bg-50);
    width:28px;height:28px;border-radius:8px;
    cursor:pointer;font-size:16px;color:var(--text-400);
  }
  .modal-body{
    padding:16px 20px;
    overflow-y:auto;
  }
  #summaryText{
    width:100%;
    min-height:320px;
    font-family:ui-monospace,monospace;
    font-size:12px;
    border:1px solid var(--bg-100);
    border-radius:9px;
    padding:12px;
  }
  .copy-btn{
    margin-top:10px;
    background:var(--accent);
    color:white;
    border:none;
    padding:9px 18px;
    border-radius:8px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
  }
  .copy-btn.copied{background:var(--info);}
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="eyebrow">[CAT-XXX or ENT-XXX] · [TL-XXX-YY]</div>
    <h1>[Feature Name] — Screen Checklist</h1>
    <p class="sub">Check what applies to this screen, add details where needed. At the end, generate the summary for <code>03_Checklist_Ecran.md</code>.</p>
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-label" id="progressLabel">0% complete</div>
    </div>
  </div>

  <div id="sections"></div>

  <div class="footer-bar">
    <button class="export-btn" onclick="openSummary()">Generate summary →</button>
  </div>

</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="modal-head">
      <h3>Summary — ready to copy</h3>
      <button class="modal-close" onclick="closeSummary()">✕</button>
    </div>
    <div class="modal-body">
      <textarea id="summaryText" readonly></textarea>
      <button class="copy-btn" id="copyBtn" onclick="copySummary()">Copy all</button>
    </div>
  </div>
</div>

<script>
/*
  HOW TO USE THIS TEMPLATE FOR A NEW FEATURE:
  1. Update the <title> and the .eyebrow / <h1> text above with the real code and feature name.
  2. Below, each item already has the STANDARD question from 03_Checklist_Ecran.md — do not change
     the titles/questions, they are the fixed 15-point checklist structure.
  3. Fill in "options" arrays with feature-specific checkable choices (fast to fill, consistent
     phrasing). Leave an options array empty ([]) if Yes/No + a free-text note is enough for that item.
  4. Open in a browser, fill it in, click "Generate summary", paste the result into
     03_Checklist_Ecran.md under a new "## VALIDATION — [code] — [name]" section.
*/
const DATA = [
  {
    letter:'A', title:'Data & Display',
    items:[
      { title:'Table', question:'Which columns appear in the list?', options:[], notes:true },
      { title:'Filters', question:'Which fields are filterable?', options:[], notes:true },
      { title:'Sorting', question:'Which columns can be sorted?', options:[], notes:true },
      { title:'Search', question:'Which fields does it search?', options:[], notes:true },
      { title:'Customizable fields/columns', question:'Who can change them (role)?', options:[], notes:true }
    ]
  },
  {
    letter:'B', title:'Actions & Behavior',
    items:[
      { title:'What actions the screen has', question:'List them (e.g. Create, Edit, Delete, Export, Assign...)', options:[], notes:true },
      { title:'Warnings/confirmations on actions', question:'Which actions require confirmation? What message?', options:[], notes:true },
      { title:'Notifications on actions', question:'Who receives them, through which channel (in-app/email/push)?', options:[], notes:true },
      { title:'Trigger for automatic task', question:'Which action generates which task, for whom?', options:[], notes:true },
      { title:'Comments', question:'At what level (per row, per record)?', options:[], notes:true },
      { title:'Activity logging (audit log)', question:'What exactly gets logged?', options:[], notes:true }
    ]
  },
  {
    letter:'C', title:'Access & Security',
    items:[
      { title:'Role-based access (grant/revoke)', question:'Which roles see/edit/have no access at all?', options:[], notes:true }
    ]
  },
  {
    letter:'D', title:'Intelligence & Automation',
    items:[
      { title:'Suggested settings (Suggestions)', question:'What is the suggestion based on?', options:[], notes:true },
      { title:'AI integrated', question:'What exactly does the AI do here?', options:[], notes:true }
    ]
  },
  {
    letter:'E', title:'External Integrations',
    items:[
      { title:'Third-party integration', question:'Which external service? What happens if unavailable (fallback)? Data sent/received?', options:[], notes:true }
    ]
  }
];

const state = {};
DATA.forEach((sec,si)=>{
  sec.items.forEach((item,ii)=>{
    const key = si+'-'+ii;
    state[key] = { yn:null, opts:{}, note:'' };
  });
});

function renderSections(){
  const root = document.getElementById('sections');
  root.innerHTML='';
  DATA.forEach((sec,si)=>{
    const secEl = document.createElement('div');
    secEl.className='section'+(si===0?' open':'');
    secEl.id='sec-'+si;
    secEl.innerHTML = `
      <div class="section-head" onclick="toggleSection(${si})">
        <div class="section-title">
          <span class="section-letter">${sec.letter}</span>
          ${sec.title}
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <span class="section-count" id="count-${si}"></span>
          <span class="chevron">▾</span>
        </div>
      </div>
      <div class="section-body" id="body-${si}"></div>
    `;
    root.appendChild(secEl);
    const body = secEl.querySelector('#body-'+si);
    sec.items.forEach((item,ii)=>{
      const key = si+'-'+ii;
      const itemEl = document.createElement('div');
      itemEl.className='item';
      itemEl.innerHTML = `
        <div class="item-top">
          <div>
            <div class="item-num">Item ${ii+1}</div>
            <div class="item-title">${item.title}</div>
          </div>
          <div class="yn">
            <button id="yes-${key}" onclick="setYN('${key}','yes')">Yes</button>
            <button id="no-${key}" onclick="setYN('${key}','no')">No</button>
          </div>
        </div>
        <div class="item-question">${item.question}</div>
        <div class="options" id="opts-${key}"></div>
        ${item.notes ? `<label class="notes-label">Note / custom detail</label><textarea id="note-${key}" placeholder="Write any adjustment, threshold, exception..." oninput="setNote('${key}', this.value)"></textarea>` : ''}
      `;
      body.appendChild(itemEl);
      const optsWrap = itemEl.querySelector('#opts-'+key);
      if (item.options.length === 0) {
        optsWrap.innerHTML = `<div class="no-options">No preset options — use Yes/No and the note field.</div>`;
      } else {
        item.options.forEach((opt,oi)=>{
          const label = document.createElement('label');
          label.className='opt';
          label.id='opt-'+key+'-'+oi;
          label.innerHTML = `<input type="checkbox" onchange="toggleOpt('${key}',${oi},this.checked)"><span>${opt}</span>`;
          optsWrap.appendChild(label);
        });
      }
    });
  });
  updateProgress();
}

function toggleSection(si){
  document.getElementById('sec-'+si).classList.toggle('open');
}

function setYN(key, val){
  state[key].yn = state[key].yn === val ? null : val;
  const yesBtn = document.getElementById('yes-'+key);
  const noBtn = document.getElementById('no-'+key);
  yesBtn.classList.toggle('active-yes', state[key].yn==='yes');
  noBtn.classList.toggle('active-no', state[key].yn==='no');
  updateProgress();
}

function toggleOpt(key, idx, checked){
  state[key].opts[idx] = checked;
  document.getElementById('opt-'+key+'-'+idx).classList.toggle('checked', checked);
  updateProgress();
}

function setNote(key, val){
  state[key].note = val;
  updateProgress();
}

function updateProgress(){
  const keys = Object.keys(state);
  let filled = 0;
  keys.forEach(k=>{
    const s = state[k];
    const hasOpt = Object.values(s.opts).some(v=>v);
    if(s.yn || hasOpt || s.note.trim()) filled++;
  });
  const pct = Math.round((filled/keys.length)*100);
  document.getElementById('progressFill').style.width = pct+'%';
  document.getElementById('progressLabel').textContent = pct+'% complete';

  DATA.forEach((sec,si)=>{
    let secFilled = 0;
    sec.items.forEach((item,ii)=>{
      const k = si+'-'+ii;
      const s = state[k];
      const hasOpt = Object.values(s.opts).some(v=>v);
      if(s.yn || hasOpt || s.note.trim()) secFilled++;
    });
    document.getElementById('count-'+si).textContent = secFilled+'/'+sec.items.length;
  });
}

function openSummary(){
  let out = `## VALIDATION — [TL-XXX-YY] — [Feature Name]\n\n`;
  DATA.forEach((sec,si)=>{
    out += `### ${sec.letter}. ${sec.title}\n\n`;
    sec.items.forEach((item,ii)=>{
      const key = si+'-'+ii;
      const s = state[key];
      const selected = item.options.filter((o,oi)=>s.opts[oi]);
      out += `**${item.title}**`;
      if(s.yn) out += ` — ${s.yn.toUpperCase()}`;
      out += `\n${item.question}\n`;
      if(selected.length) out += `- Selected: ${selected.join(', ')}\n`;
      if(s.note && s.note.trim()) out += `- Note: ${s.note.trim()}\n`;
      out += `\n`;
    });
  });
  document.getElementById('summaryText').value = out;
  document.getElementById('modalBg').classList.add('show');
}

function closeSummary(){
  document.getElementById('modalBg').classList.remove('show');
}

function copySummary(){
  const ta = document.getElementById('summaryText');
  ta.select();
  document.execCommand('copy');
  const btn = document.getElementById('copyBtn');
  btn.textContent = 'Copied ✓';
  btn.classList.add('copied');
  setTimeout(()=>{ btn.textContent='Copy all'; btn.classList.remove('copied'); }, 1800);
}

renderSections();
</script>
</body>
</html>
