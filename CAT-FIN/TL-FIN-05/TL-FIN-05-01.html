.notif-row{padding:12px 8px;border-top:1px solid var(--border2);cursor:pointer;border-radius:6px;}
.notif-row:hover{background:var(--bg50);}
.notif-row-text{font-size:14px;color:var(--text900);line-height:1.4;}
.notif-row-actions{display:flex;gap:12px;margin-top:10px;}
.notif-mini-btn{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700;cursor:pointer;}
.notif-mini-btn.view{color:var(--info);}
.notif-mini-btn.approve{color:var(--accent-dark, var(--accent));}
.notif-mini-btn.reject{color:var(--danger);}
.btn:disabled, input:disabled{opacity:.5;cursor:not-allowed;}
tbody .drag-handle{color:var(--text400);cursor:grab;display:flex;align-items:center;}
tbody tr.sortable-ghost{background:var(--bg50);}
.row-actions:hover{background:var(--border2);color:var(--text900);}
input[type=checkbox]{accent-color:var(--accent);cursor:pointer;width:15px;height:15px;}
.pagination-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px 4px;flex-shrink:0;}
.page-size-group{display:flex;align-items:center;gap:14px;}
.page-size-select{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text400);}
.page-size-select select{border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:12px;font-family:inherit;color:var(--text900);cursor:pointer;}
.pagination-bar .psum{font-size:12px;color:var(--text400);}
.pagenav{display:flex;gap:4px;}
.pagenav button{border:none;background:none;padding:6px 10px;border-radius:6px;font-size:12px;font-weight:600;color:var(--text400);cursor:pointer;}
.pagenav button.active{background:var(--text900);color:#fff;}
.pagenav button:disabled{opacity:.35;cursor:default;}
.flyout{position:fixed;background:#fff;border-radius:10px;box-shadow:0 12px 28px rgba(0,0,0,.16);border:1px solid var(--border2);z-index:320;min-width:200px;padding:8px;max-height:min(480px, calc(100vh - 24px));overflow-y:auto;}
.flyout button{width:100%;text-align:left;border:none;background:none;padding:11px 12px;font-size:14px;color:var(--text900);cursor:pointer;border-radius:7px;display:flex;align-items:center;gap:9px;font-family:inherit;}
.flyout button:hover{background:var(--bg50);}
.flyout button.danger{color:var(--danger);}
.flyout hr{border:none;border-top:1px solid var(--border2);margin:5px 2px;}
.swatch-section-label{font-size:10px;font-weight:700;color:var(--text400);letter-spacing:.3px;margin:4px 0 8px;}
.modal-scrim{position:fixed;inset:0;background:rgba(46,42,92,.35);display:flex;align-items:flex-start;justify-content:center;padding:60px 20px;overflow-y:auto;z-index:200;}
.modal{background:#fff;border-radius:16px;width:100%;max-width:460px;padding:26px 28px;box-shadow:0 20px 50px rgba(0,0,0,.2);}
.modal h2{font-size:17px;margin:0 0 6px;}
.modal .mdesc{font-size:12.5px;color:var(--text400);margin-bottom:18px;line-height:1.5;}
.modal .field{margin-bottom:14px;}
.modal .field label{font-size:11.5px;font-weight:700;color:var(--text400);display:block;margin-bottom:5px;}
.modal .field input[type=text], .modal .field select, .modal .field textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13px;font-family:inherit;color:var(--text900);}
.modal .field textarea{min-height:64px;resize:vertical;}
.modal .actions{display:flex;gap:10px;margin-top:20px;}
.modal .actions .btn{flex:1;justify-content:center;padding:10px;}
.radio-row{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--border2);border-radius:10px;padding:12px;cursor:pointer;}
.radio-row input[type=radio]{margin-top:2px;accent-color:var(--accent);cursor:pointer;}
.radio-row .radio-text{display:flex;flex-direction:column;gap:2px;}
.radio-row .rtitle{font-size:13px;font-weight:600;color:var(--text900);}
.radio-row .rsub{font-size:11.5px;color:var(--text400);}
.export-mode-row{display:flex;gap:10px;margin-top:14px;}
.export-mode-card{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;border:1.5px solid var(--border2);border-radius:12px;padding:16px 12px;cursor:pointer;background:#fff;font-family:inherit;color:var(--text900);}
.export-mode-card span:first-of-type{font-size:13px;font-weight:700;margin-top:4px;}
.export-mode-card .emc-sub{font-size:11px;font-weight:400;color:var(--text400);}
.export-mode-card.active{border-color:var(--accent);background:#f4fdf7;}
.export-format-row{display:flex;gap:8px;margin:8px 0 4px;}
.export-format-row .btn{flex:1;justify-content:center;}
.modal-close{position:absolute;top:22px;right:24px;border:none;background:var(--bg50);width:28px;height:28px;border-radius:8px;cursor:pointer;color:var(--text400);display:flex;align-items:center;justify-content:center;transition:background .12s ease,color .12s ease;}
.modal-close:hover{background:var(--border2);color:var(--text900);}
.modal-wrap{position:relative;}
.modal.filter-panel{width:460px;}
.modal.filter-panel.customize-mode{border:1.5px dashed var(--accent);}
.filter-header{display:flex;align-items:center;gap:8px;margin-bottom:14px;padding-right:40px;}
.filter-header h2{flex:1;margin:0;font-size:17px;}
.filter-section-label{font-size:10.5px;font-weight:700;color:var(--text400);letter-spacing:.3px;margin:14px 0 8px;}
.filter-field{margin-bottom:12px;}
.filter-field label{display:block;font-size:11px;font-weight:600;color:var(--text600);margin-bottom:6px;}
.filter-field-row{display:flex;align-items:center;gap:8px;margin-bottom:2px;user-select:none;position:relative;}
.filter-field-row .drag-handle{color:var(--text400);cursor:grab;flex-shrink:0;}
.filter-field-row .filter-field{flex:1;margin-bottom:0;}
.filter-input-box{border:1px solid var(--border);border-radius:8px;padding:9px 12px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-size:13px;color:var(--text900);background:#fff;}
.filter-input-box .ph{color:var(--neutral300);}
.filter-checklist{border:1px solid var(--border2);border-top:none;border-radius:0 0 8px 8px;padding:8px;margin-top:-1px;max-height:220px;overflow-y:auto;}
.filter-checklist label{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text900);padding:5px 4px;cursor:pointer;}
.filter-toggle-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;}
.filter-toggle-row label{font-size:12.5px;color:var(--text900);}
.filter-range{display:flex;align-items:center;gap:8px;}
.filter-range input{border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12.5px;font-family:inherit;width:100%;}
.preset-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.preset-chip{border:1px solid var(--border);background:#fff;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--text900);cursor:pointer;font-family:inherit;}
.preset-chip:hover{background:var(--bg50);}
.preset-chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.more-filters-link{display:flex;align-items:center;gap:6px;color:var(--accent);font-weight:600;font-size:12.5px;cursor:pointer;margin:10px 0;}
.filter-divider{height:1px;background:var(--border2);margin:10px 0;}
.colpanel-row{display:flex;align-items:center;gap:10px;padding:7px 4px;border-radius:6px;user-select:none;position:relative;}
.colpanel-row input[type=checkbox]{accent-color:var(--accent);}
.colpanel-row .name{flex:1;font-size:12.5px;}
.colpanel-row .drag-handle{color:var(--text400);cursor:grab;display:flex;align-items:center;}
.colpanel-row.frozen{opacity:.55;}
.col-icon-btn{color:var(--text400);cursor:pointer;display:flex;padding:4px;border-radius:6px;margin-left:2px;}
.col-icon-btn:hover{background:var(--bg50);color:var(--text900);}
.select-all-row{display:flex;gap:14px;padding:2px 4px 10px;}
.pin-toggle-row{display:flex;gap:18px;flex-wrap:wrap;padding:2px 4px 12px;}
.pin-toggle{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--accent-dark, var(--accent));cursor:pointer;}
.pin-toggle input{accent-color:var(--accent);cursor:pointer;}
.select-all-row a{font-size:11.5px;font-weight:700;color:var(--accent);cursor:pointer;}
.select-all-row a:hover{text-decoration:underline;}
.dropzone{border:2px dashed var(--border);border-radius:12px;padding:30px 20px;text-align:center;color:var(--text400);margin-bottom:16px;transition:border-color .15s,background .15s;}
.dropzone.dragover{border-color:var(--accent);background:#f4fdf7;color:var(--accent);}
.dropzone .dzicon{margin-bottom:8px;}
.dropzone .dzhint{font-size:11.5px;margin-top:4px;}
.upload-options{display:flex;gap:10px;margin-bottom:16px;}
.upload-options .btn{flex:1;justify-content:center;}
.queue-label{font-size:11px;font-weight:700;color:var(--text400);letter-spacing:.3px;margin-bottom:8px;}
.queue-list{display:flex;flex-direction:column;gap:6px;max-height:200px;overflow-y:auto;margin-bottom:16px;}
.queue-row{display:flex;align-items:center;gap:10px;background:var(--headerBg);border-radius:8px;padding:8px 10px;}
.queue-row .qicon{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
.queue-row .qtext{flex:1;min-width:0;}
.queue-row .qname{font-size:12px;font-weight:600;color:var(--text900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.queue-row .qmeta{font-size:10.5px;color:var(--text400);}
.queue-row .qremove{color:var(--text400);cursor:pointer;flex-shrink:0;}
.empty-queue{font-size:12px;color:var(--text400);text-align:center;padding:14px 0;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text900);color:#fff;padding:12px 18px;border-radius:10px;font-size:12.5px;font-weight:600;box-shadow:0 8px 20px rgba(0,0,0,.25);z-index:400;display:flex;align-items:center;gap:8px;}
.toast .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);}
.placeholder-tab{display:flex;align-items:center;justify-content:center;flex:1;color:var(--text400);font-size:13px;text-align:center;padding:60px 20px;}
body{margin:0;background:#525659;font-family:'Source Sans 3',Arial,sans-serif;display:flex;justify-content:center;padding:40px 20px;}
/* ===== 07 §1 additions (2026-09-09) + adopted rail label size (07 §7) ===== */
:root{ --accent-dark:#1e8e5a; --info-bg:#eef4fb; --purple-bg:#efeafe; --selected-bg:#f4fdf7; }
.rail-section-label{font-size:10px;font-weight:700;color:rgba(255,255,255,.35);letter-spacing:.06em;}
/* ===== Filter panel spacing override (proposed for _shared, 06 §1) ===== */
.filter-panel .filter-field{margin-bottom:16px;}
.filter-panel .filter-field-row{margin-bottom:12px;}
.filter-panel .filter-section-label{margin-top:18px;}
.filter-panel #pinnedWrap{border-top:1px solid var(--border2);margin-top:4px;padding-top:12px;}
/* ===== Shared additions used by this screen ===== */
.link-btn{font-size:11.5px;font-weight:700;color:var(--accent-dark);cursor:pointer;background:none;border:none;font-family:inherit;padding:0;display:inline-flex;align-items:center;gap:4px;}
.link-btn:hover{text-decoration:underline;}
.status-pill.success{background:var(--success-bg);color:var(--success-t);}
.status-pill.warning{background:var(--warning-bg);color:var(--warning-t);}
.status-pill.danger{background:var(--danger-bg);color:var(--danger-t);}
.status-pill.info{background:var(--info-bg);color:#2f6f9c;}
.status-pill.neutral{background:var(--neutral-bg);color:var(--neutral-t);}
.status-pill.ai{background:var(--purple-bg);color:var(--purple);display:inline-flex;align-items:center;gap:4px;}
.status-pill.missing{background:#fff;color:var(--danger-t);border:1px dashed var(--danger-t);}
.status-pill.clickable{cursor:pointer;}
.ai-line{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--purple);font-weight:600;margin-top:6px;}
.bulk-bar{display:flex;align-items:center;gap:10px;background:var(--success-bg);border:1px solid #cdeedb;border-radius:10px;padding:8px 14px;margin:0 20px 10px;font-size:12.5px;font-weight:600;color:var(--success-t);}
.bulk-bar .btn{padding:6px 10px;}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 20px;color:var(--text400);gap:6px;text-align:center;}
.empty-state .es-title{font-size:15px;font-weight:600;color:var(--text900);}
td.frozen-left,th.frozen-left{position:sticky;left:0;background:#fff;z-index:1;} th.frozen-left{background:var(--headerBg);z-index:3;}
.frozen-left-last{box-shadow:2px 0 4px -2px rgba(0,0,0,0.08);}
td.frozen-right,th.frozen-right{position:sticky;right:0;background:#fff;z-index:1;} th.frozen-right{background:var(--headerBg);z-index:3;}
.frozen-right-first{box-shadow:-2px 0 4px -2px rgba(0,0,0,0.08);}
tbody tr:hover td.frozen-left, tbody tr:hover td.frozen-right{background:var(--bg50);}
tbody tr.selected td{background:var(--selected-bg);}
tbody tr.selected td.frozen-left, tbody tr.selected td.frozen-right{background:var(--selected-bg);}
thead th.num, tbody td.num{text-align:right;font-variant-numeric:tabular-nums;}
tbody td .cell-main{font-weight:600;color:var(--text900);}
tbody td .cell-meta{font-size:11px;color:var(--text400);margin-top:1px;}
.sp-banner{border-radius:10px;padding:12px;margin-bottom:16px;font-size:12.5px;line-height:1.5;display:flex;gap:10px;align-items:flex-start;}
.sp-banner.info{background:var(--info-bg);color:var(--text900);} .sp-banner.warning{background:var(--warning-bg);color:var(--text900);} .sp-banner.danger{background:var(--danger-bg);color:var(--text900);} .sp-banner.ai{background:var(--purple-bg);color:var(--text900);}
/* ===== Screen: IFTA Calculator ===== */
.ifta-screen{display:flex;flex-direction:column;flex:1;min-height:0;}
.return-header{display:flex;align-items:flex-start;gap:20px;padding:18px 20px 14px;border-bottom:1px solid var(--border2);flex-shrink:0;}
.return-header h1{font-size:24px;font-weight:700;margin:0 0 4px;display:flex;align-items:center;gap:10px;}
.return-header .rh-sub{font-size:12.5px;color:var(--text600);display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.return-header .rh-sub b{color:var(--text900);font-weight:600;}
.return-header .rh-facts{display:flex;gap:22px;margin-left:auto;flex-shrink:0;}
.rh-fact{display:flex;flex-direction:column;gap:2px;min-width:90px;}
.rh-fact .k{font-size:10.5px;font-weight:700;color:var(--text400);letter-spacing:.3px;}
.rh-fact .v{font-size:14px;font-weight:600;color:var(--text900);}
.rh-fact .v.danger{color:var(--danger-t);} .rh-fact .v.warn{color:var(--warning-t);}
.quarter-select{min-width:200px;}
/* stepper — DECISION-NEEDED (proposed pattern, see 04) */
.stepper{display:flex;align-items:center;gap:0;padding:14px 20px 0;flex-shrink:0;}
.step{display:flex;align-items:center;gap:10px;cursor:pointer;padding:6px 10px 6px 6px;border-radius:10px;}
.step:hover{background:var(--bg50);}
.step .sn{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:var(--text400);background:#fff;flex-shrink:0;}
.step .st{display:flex;flex-direction:column;gap:1px;}
.step .st .l{font-size:13px;font-weight:700;color:var(--text600);white-space:nowrap;}
.step .st .m{font-size:11px;color:var(--text400);white-space:nowrap;}
.step.done .sn{background:var(--accent);border-color:var(--accent);color:#fff;}
.step.attention .sn{background:var(--warning-bg);border-color:var(--warning);color:var(--warning-t);}
.step.active .sn{border-color:var(--text900);color:var(--text900);}
.step.active .st .l{color:var(--text900);}
.step.active{background:var(--bg50);}
.step-line{flex:1;height:1px;background:var(--border);margin:0 6px;min-width:20px;}
/* summary strip = quiet cards (DOC .sp-task-card style, on --headerBg) */
.sum-row{display:flex;gap:12px;padding:14px 20px 0;flex-shrink:0;}
.sum-card{flex:1;background:var(--headerBg);border:1px solid var(--border2);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;}
.sum-card .k{font-size:10.5px;font-weight:700;color:var(--text400);letter-spacing:.3px;}
.sum-card .v{font-size:18px;font-weight:700;color:var(--text900);font-variant-numeric:tabular-nums;}
.sum-card .v.danger{color:var(--danger-t);} .sum-card .v.warn{color:var(--warning-t);} .sum-card .v.good{color:var(--accent-dark);}
.sum-card .m{font-size:11px;color:var(--text400);}
.sum-card.danger{border-color:#f5c9cd;background:var(--danger-bg);} .sum-card.warn{border-color:#f7dfa8;background:var(--warning-bg);}
.quick-chips{display:flex;gap:6px;flex-shrink:0;}
.quick-chips .preset-chip{font-size:11.5px;}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;flex-shrink:0;}
.seg button{border:none;background:#fff;padding:8px 12px;font-size:12px;font-weight:600;color:var(--text600);cursor:pointer;font-family:inherit;}
.seg button.active{background:var(--text900);color:#fff;}
.seg button + button{border-left:1px solid var(--border);}
.table-wrap{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 20px;}
.table-wrap .table-outer{flex:1;min-height:0;}
.jur-chip{display:inline-block;background:var(--bg50);border:1px solid var(--border2);border-radius:6px;padding:2px 6px;font-size:11px;font-weight:600;color:var(--text600);margin:1px 2px 1px 0;white-space:nowrap;font-variant-numeric:tabular-nums;}
.jur-chip.base{border-color:var(--accent);color:var(--accent-dark);}
.veh-cell{display:flex;align-items:center;gap:8px;}
.veh-tile{width:28px;height:28px;border-radius:7px;background:var(--bg50);display:flex;align-items:center;justify-content:center;color:var(--text600);flex-shrink:0;}
.src-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700;white-space:nowrap;}
.src-pill.eld,.src-pill.api{background:var(--info-bg);color:#2f6f9c;}
.src-pill.upload{background:var(--neutral-bg);color:var(--neutral-t);}
.src-pill.manual{background:var(--warning-bg);color:var(--warning-t);}
.src-pill.pdf{background:var(--purple-bg);color:var(--purple);}
/* review checks */
.checks{padding:16px 20px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;flex:1;min-height:0;}
.check-row{display:flex;align-items:flex-start;gap:12px;border:1px solid var(--border2);border-radius:10px;padding:12px 14px;background:#fff;}
.check-row .ci{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.check-row.ok .ci{background:var(--success-bg);color:var(--success-t);}
.check-row.warn .ci{background:var(--warning-bg);color:var(--warning-t);}
.check-row.fail .ci{background:var(--danger-bg);color:var(--danger-t);}
.check-row.ai .ci{background:var(--purple-bg);color:var(--purple);}
.check-row .ct{flex:1;min-width:0;}
.check-row .ct .t{font-size:13px;font-weight:600;color:var(--text900);}
.check-row .ct .d{font-size:12px;color:var(--text600);margin-top:2px;line-height:1.45;}
.check-row .ct .ref{font-size:11px;color:var(--text400);margin-top:4px;}
.check-row .ca{flex-shrink:0;display:flex;gap:8px;align-items:center;}
.calc-box{margin:0 20px 16px;border:1px solid var(--border2);border-radius:12px;padding:16px 18px;background:var(--headerBg);display:flex;align-items:center;gap:18px;flex-shrink:0;}
.calc-box .cb-text{flex:1;}
.calc-box .cb-text .t{font-size:15px;font-weight:600;}
.calc-box .cb-text .d{font-size:12px;color:var(--text600);margin-top:2px;line-height:1.5;}
.calc-progress{height:6px;border-radius:3px;background:var(--border2);overflow:hidden;margin-top:8px;}
.calc-progress > div{height:100%;background:var(--accent);width:0;transition:width .35s ease;}
/* report */
.report{flex:1;min-height:0;overflow-y:auto;padding:0 20px 20px;}
.report-actions{display:flex;gap:8px;align-items:center;padding:14px 20px 0;flex-shrink:0;flex-wrap:wrap;}
.report-card{border:1px solid var(--border2);border-radius:12px;padding:16px 18px;margin-top:14px;}
.report-card .rc-title{font-size:15px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.report-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 20px;font-size:12.5px;}
.report-grid .k{color:var(--text400);font-size:10.5px;font-weight:700;letter-spacing:.3px;}
.report-grid .v{color:var(--text900);font-weight:600;}
.report table{min-width:0;}
.report tbody tr.total td{font-weight:700;background:var(--headerBg);border-top:2px solid var(--border);}
.report tbody tr.surcharge td{color:var(--text600);font-style:normal;}

// ---- Deterministic generator (mulberry32) so every session shows the same demo data ----
function rng(seed){ return function(){ let t = seed += 0x6D2B79F5; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function pad2(n){ return String(n).padStart(2,'0'); }
function dstr(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function fmtDate(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-'); return m+'/'+d+'/'+y; }
function fmtDateLong(iso){ const d=new Date(iso+'T12:00:00'); return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function fmtNum(n,dec){ return Number(n||0).toLocaleString('en-US',{minimumFractionDigits:dec||0,maximumFractionDigits:dec||0}); }
function fmtMoney(n){ const v=Number(n||0); const s='$'+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); return v<0?'('+s+')':s; }

function generateQuarter(q){
  const R = rng(q.seed);
  const start = new Date(q.from+'T12:00:00'); const end = new Date(q.to+'T12:00:00');
  const cutoff = q.status==='in_progress' ? new Date('2026-09-08T12:00:00') : end;
  const trips=[], fuel=[]; let tripId=1, fuelId=1;
  VEHICLES.forEach((v,vi)=>{
    let odo = 180000 + vi*23000 + Math.floor(R()*9000);
    let d = new Date(start); d.setDate(d.getDate()+Math.floor(R()*3));
    while(d <= cutoff){
      const route = ROUTES[Math.floor(R()*ROUTES.length)];
      const out = trips.length%2===0 || R()>0.35;
      const legs = route.legs.map(([j,m])=>[j, Math.round(m*(0.94+R()*0.12))]);
      const total = legs.reduce((s,l)=>s+l[1],0);
      const days = Math.max(1, Math.round(total/520));
      const endD = new Date(d); endD.setDate(endD.getDate()+days);
      if(endD > cutoff) break;
      const src = v.unit==='TRK-104' && R()<0.35 ? (R()<0.5?'upload':'manual') : (R()<0.06?'manual':'eld');
      const pings = src==='eld' ? Math.round(total/48*6*(0.9+R()*0.2)) : 0;
      let status='complete';
      const gap = (v.unit==='TRK-104' && q.status==='in_progress' && dstr(d)>='2026-08-13' && dstr(d)<='2026-08-15') ? true : false;
      if(gap) status='gap';
      const t = { id:'TR-'+q.key.replace('-','')+'-'+pad2(tripId++), unit:v.unit, driver:v.driver, from:dstr(d), to:dstr(endD), origin: out?route.o:route.d, dest: out?route.d:route.o, legs: out?legs:legs.slice().reverse(), total, odoStart:odo, odoEnd:odo+total, source:src, pings, status, reviewed: q.status!=='in_progress' };
      trips.push(t); odo += total;
      // fuel stops along the route (1–3), roughly total/6.3 gallons
      const stops = Math.max(1, Math.min(3, Math.round(total/650)+ (R()<0.4?1:0)));
      let remaining = total/(6.1+R()*0.6);
      for(let s=0;s<stops;s++){
        const leg = t.legs[Math.min(t.legs.length-1, Math.floor((s+0.5)/stops*t.legs.length))];
        const j = leg[0];
        const gal = s===stops-1 ? remaining : Math.round(remaining*(0.35+R()*0.3));
        remaining -= gal;
        const gallons = Math.max(38, Math.round(gal*10)/10);
        const price = (JUR[j].diesel + 2.95 + R()*0.55);
        const fd = new Date(d); fd.setDate(fd.getDate()+Math.floor(days*(s+0.5)/stops));
        const csrc = (v.unit==='TRK-104') ? (R()<0.5?'api-efs':CARD_SOURCES[Math.floor(R()*CARD_SOURCES.length)]) : CARD_SOURCES[Math.floor(R()*CARD_SOURCES.length)];
        const receipt = csrc==='manual' ? (R()<0.5?'missing':'attached') : 'attached';
        const vendors = VENDORS[j]||['Pilot Travel Center'];
        fuel.push({ id:'FP-'+q.key.replace('-','')+'-'+pad2(fuelId++), date:dstr(fd), unit:v.unit, driver:v.driver, jur:j, vendor:vendors[Math.floor(R()*vendors.length)], fuelType:'Diesel', gallons, price:Math.round(price*1000)/1000, total:Math.round(gallons*price*100)/100, source:csrc, receipt, card:v.card, trip:t.id, reviewed: q.status!=='in_progress' });
      }
      d = new Date(endD); d.setDate(d.getDate()+1+Math.floor(R()*2));
    }
  });
  if(q.status==='in_progress'){
    // one purchase in a jurisdiction with no miles (data-quality demo) + one AI-flagged low-gallon entry
    fuel.push({ id:'FP-2026Q3-'+pad2(fuelId++), date:'2026-08-21', unit:'TRK-104', driver:'Carlos Mendes', jur:'OH', vendor:'Flying J #706', fuelType:'Diesel', gallons:112.4, price:3.612, total:405.99, source:'api-efs', receipt:'attached', card:'EFS ••8421', trip:null, reviewed:false, flag:'no_miles' });
  }
  trips.sort((a,b)=> a.from<b.from?-1:a.from>b.from?1:0);
  fuel.sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:0);
  return { trips, fuel };
}

// ---- Tax computation (P720 / 10 §3) — the one function every report, export and history row uses ----
function computeReturn(q, fuelTypeRate){
  const { trips, fuel } = DATA[q.key];
  const milesBy = {}; let totalMiles=0;
  trips.forEach(t=> t.legs.forEach(([j,m])=>{ milesBy[j]=(milesBy[j]||0)+m; totalMiles+=m; }));
  const galBy = {}; let totalGal=0;
  fuel.forEach(f=>{ galBy[f.jur]=(galBy[f.jur]||0)+f.gallons; totalGal+=f.gallons; });
  totalMiles = Math.round(totalMiles); totalGal = Math.round(totalGal);            // P720: nearest whole unit
  const mpg = totalGal ? Math.floor((totalMiles/totalGal)*100)/100 : 0;            // two decimals (truncated per IFT506 example)
  const codes = Array.from(new Set([...Object.keys(milesBy), ...Object.keys(galBy)])).sort();
  const monthsLate = q.monthsLate||0;
  const rows = codes.map(code=>{
    const j = JUR[code]; const rate = fuelTypeRate ? fuelTypeRate(j) : j.diesel;
    const total = Math.round(milesBy[code]||0), taxable = total;                    // no exempt miles in this fleet (10 §3.4)
    const taxableGal = mpg ? Math.round(taxable/mpg) : 0;
    const taxPaidGal = Math.round(galBy[code]||0);
    const net = taxableGal - taxPaidGal;
    const tax = Math.round(net*rate*100)/100;
    const surcharge = j.surcharge ? Math.round(taxableGal*j.surcharge*100)/100 : 0;  // on taxable gallons, never a credit
    const interest = monthsLate && (tax+surcharge)>0 ? Math.round((tax+surcharge)*IFTA_MONTHLY_INTEREST*monthsLate*100)/100 : 0;
    return { code, name:j.name, rate, total, taxable, taxableGal, taxPaidGal, net, tax, surchargeRate:j.surcharge, surcharge, interest, due: Math.round((tax+surcharge+interest)*100)/100 };
  });
  const sum = (k)=> rows.reduce((s,r)=>s+r[k],0);
  const taxTotal = Math.round(sum('tax')*100)/100, surchargeTotal = Math.round(sum('surcharge')*100)/100, interestTotal = Math.round(sum('interest')*100)/100;
  const netTax = Math.round((taxTotal+surchargeTotal)*100)/100;
  const penalty = monthsLate ? Math.max(LATE_PENALTY_MIN, Math.round(Math.max(0,netTax)*LATE_PENALTY_PCT*100)/100) : 0;
  const remittance = Math.round((netTax + interestTotal + penalty)*100)/100;
  return { totalMiles, totalGal, mpg, rows, taxTotal, surchargeTotal, interestTotal, penalty, netTax, remittance, milesBy, galBy, vehicles: new Set(trips.map(t=>t.unit)).size, jurisdictions: codes.length };
}

function safeSortable(listEl, opts){ if(!window.Sortable) return; new Sortable(listEl, Object.assign({}, SORTABLE_DEFAULTS, opts)); }
function positionFlyout(menu, anchor){
  menu.style.position='fixed'; menu.style.visibility='hidden';
  app.appendChild(menu);
  const anchorRect = anchor.getBoundingClientRect(); const menuRect = menu.getBoundingClientRect();
  let top = anchorRect.bottom + 6; let left = anchorRect.left;
  if(left + menuRect.width > window.innerWidth - 8) left = window.innerWidth - menuRect.width - 8;
  if(left < 8) left = 8;
  if(top + menuRect.height > window.innerHeight - 8) top = anchorRect.top - menuRect.height - 6;
  if(top < 8) top = 8;
  menu.style.top = top+'px'; menu.style.left = left+'px'; menu.style.visibility='visible';
}
function closeOnOutside(menu, anchor){ setTimeout(()=>{ document.addEventListener('click', function h(ev){ if(!menu.contains(ev.target) && ev.target!==anchor){ menu.remove(); document.removeEventListener('click',h); } }); },0); }
function attachTooltip(target, textFn){
  let tip=null;
  target.addEventListener('mouseenter', ()=>{
    if(railExpanded) return;
    const text = typeof textFn==='function' ? textFn() : textFn;
    tip = document.createElement('div'); tip.className='rail-tooltip'; tip.textContent=text;

    tip.style.left = (r.right+10)+'px'; tip.style.top = (r.top+r.height/2)+'px';
  });

function showToast(msg, tone){

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
}
function isoDate(d){ return d.toISOString().slice(0,10); }
function normSearch(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,''); }
// 06 §5 — two-tier search: contiguous match wins, else all tokens
function matchesSearch(haystackParts, query){
  const q = String(query||'').trim().toLowerCase(); if(!q) return 2;
  const hay = haystackParts.map(p=>String(p||'').toLowerCase()).join(' | ');
  if(normSearch(hay).includes(normSearch(q))) return 2;
  const tokens = q.split(/\s+/).map(normSearch).filter(Boolean);
  return tokens.length && tokens.every(t=> normSearch(hay).includes(t)) ? 1 : 0;
}
function applySearch(list, query, partsFn){
  if(!query) return list;
  const scored = list.map(x=>({x, s:matchesSearch(partsFn(x), query)})).filter(o=>o.s>0);
  const best = Math.max(0, ...scored.map(o=>o.s));
  return scored.filter(o=>o.s===best).map(o=>o.x);
}

function render(){

  applyFrozenOffsets();
}
function applyFrozenOffsets(){
  const t = document.querySelector('.table-wrap table'); if(!t) return;

function omniResults(q){
  const out = { VEHICLES:[], JURISDICTIONS:[], RETURNS:[], RECORDS:[] };
  if(!q.trim()) return out;
  VEHICLES.forEach(v=>{ if(matchesSearch([v.unit,v.make,v.plate,v.driver,v.vin],q)) out.VEHICLES.push({label:v.unit+' · '+v.driver, meta:v.make, go:()=>{ state.activeTab='return'; state.step='miles'; state.filters=defaultFilters(); state.filters.vehicle=new Set([v.unit]); state.page=1; render(); }}); });
  JURISDICTIONS.forEach(j=>{ if(matchesSearch([j.code,j.name],q)) out.JURISDICTIONS.push({label:j.name+' ('+j.code+')', meta:'Diesel $'+j.diesel.toFixed(4), go:()=>{ state.activeTab='rates'; state.ratesSearch=j.name; render(); }}); });
  QUARTERS.forEach(x=>{ if(matchesSearch([x.label,x.key,x.confirmation,'ifta return'],q)) out.RETURNS.push({label:x.label+' return', meta:statusLabel(x), go:()=>{ openQuarter(x.key); }}); });
  const d = DATA[state.quarter];
  d.fuel.forEach(f=>{ if(out.RECORDS.length<5 && matchesSearch([f.id,f.vendor,f.unit,f.jur,f.date],q)) out.RECORDS.push({label:f.id+' · '+f.vendor, meta:fmtDate(f.date)+' · '+f.gallons+' gal', go:()=>{ state.activeTab='return'; state.step='fuel'; state.search=f.id; state.page=1; render(); }}); });
  d.trips.forEach(t=>{ if(out.RECORDS.length<5 && matchesSearch([t.id,t.origin,t.dest,t.unit],q)) out.RECORDS.push({label:t.id+' · '+t.origin+' → '+t.dest, meta:fmtDate(t.from), go:()=>{ state.activeTab='return'; state.step='miles'; state.search=t.id; state.page=1; render(); }}); });
  return out;
}
function wireOmnisearch(input){
  let menu=null;
  const close=()=>{ if(menu){ menu.remove(); menu=null; } };
  const paint=()=>{
    close(); const q=input.value; if(!q.trim()) return;
    const res = omniResults(q); menu = el('<div class="flyout omni-flyout"></div>');
    let any=false;
    Object.entries(res).forEach(([g,items])=>{
      if(!items.length) return; any=true;
      menu.appendChild(el(`<div class="omni-group">${g} · ${items.length}</div>`));
      items.slice(0,5).forEach(it=>{ const r=el(`<div class="omni-row"><span>${it.label}</span><span class="om">${it.meta||''}</span></div>`); r.onmousedown=(e)=>{ e.preventDefault(); close(); input.value=''; it.go(); }; menu.appendChild(r); });
      if(items.length>5) menu.appendChild(el(`<div class="omni-row om" style="justify-content:center;">${items.length-5} more</div>`));
    });
    if(!any) menu.appendChild(el('<div class="no-options-hint" style="padding:10px 12px;">No results.</div>'));
    positionFlyout(menu, input.parentElement);
  };
  input.oninput = paint;
  input.onkeydown = (e)=>{ if(e.key==='Escape'){ close(); input.value=''; } if(e.key==='Enter'){ const first=menu&&menu.querySelector('.omni-row'); if(first){ first.dispatchEvent(new MouseEvent('mousedown')); } } };
  input.onblur = ()=> setTimeout(close,120);
}

// ===== Pagination (DOC renderPagination) =====
function renderPagination(total){
  const perPage = state.perPage || 10;
  const totalPages = Math.max(1, Math.ceil(total/perPage)); if(state.page>totalPages) state.page=totalPages;
  const start = total===0?0:(state.page-1)*perPage+1; const end = Math.min(state.page*perPage, total);
  const bar = el('<div class="pagination-bar"></div>');
  const left = el(`<div class="page-size-group"><span class="psum">Showing ${start}–${end} of ${total}</span></div>`);
  const sizeWrap = el(`<label class="page-size-select"><span>Show</span></label>`); const select = el('<select id="perPageSelect"></select>');
  PAGE_SIZE_OPTIONS.forEach(n=> select.appendChild(el(`<option value="${n}" ${n===perPage?'selected':''}>${n}</option>`)));
  select.onchange=(e)=>{ state.perPage=Number(e.target.value); state.page=1; render(); };
  sizeWrap.appendChild(select); sizeWrap.appendChild(el('<span>per page</span>')); left.appendChild(sizeWrap); bar.appendChild(left);
  const nav = el('<div class="pagenav"></div>');
  const prev = el(`<button ${state.page===1?'disabled':''}>${iconHTML('chevron_left',16)}</button>`); prev.onclick=()=>{ state.page--; render(); }; nav.appendChild(prev);
  const pages = []; for(let i=1;i<=totalPages;i++){ if(totalPages<=7 || i<=2 || i>totalPages-2 || Math.abs(i-state.page)<=1) pages.push(i); else if(pages[pages.length-1]!=='…') pages.push('…'); }
  pages.forEach(i=>{ if(i==='…'){ nav.appendChild(el('<span style="padding:0 4px;color:var(--text400)">…</span>')); return; } const b=el(`<button class="${i===state.page?'active':''}">${i}</button>`); b.onclick=()=>{ state.page=i; render(); }; nav.appendChild(b); });
  const next = el(`<button ${state.page===totalPages?'disabled':''}>${iconHTML('chevron_right',16)}</button>`); next.onclick=()=>{ state.page++; render(); }; nav.appendChild(next);
  bar.appendChild(nav); return bar;
}

function createBrandedSelect(options, currentValue, onChange){
  const el_ = el('<button type="button" class="branded-select"></button>');
  let value = (currentValue && options.some(o=>o.value===currentValue)) ? currentValue : (options[0]?.value ?? '');
  function currentLabel(){ const o = options.find(o=>o.value===value); return o ? o.label : (options[0]?.placeholder || 'Select...'); }
  function paint(){ el_.innerHTML = '<span class="bs-current">'+currentLabel()+'</span>'+iconHTML('expand_more',16); }
  paint();
  el_.onclick = (e)=>{
    e.preventDefault(); document.querySelectorAll('.flyout').forEach(m=>m.remove());
    const menu = el('<div class="flyout branded-select-menu"></div>');
    options.forEach(opt=>{
      const active = opt.value === value;
      const item = el('<button type="button" class="bs-option'+(active?' active':'')+(opt.emphasis?' emphasis':'')+'">'+(active?iconHTML('check',15):'<span class="bs-check-spacer"></span>')+'<span>'+opt.label+'</span></button>');
      item.onclick = ()=>{ value = opt.value; paint(); menu.remove(); if(onChange) onChange(value); };

// ===== Data-quality helpers shared by steps and checks =====
function tripIssues(t){ const out=[]; if(t.status==='gap') out.push('ELD gap'); if(t.source!=='eld' && !t.reviewed) out.push('Needs review'); if(t.source!=='eld' && !t.odoStart) out.push('No odometer'); return out; }

// ----- STEP 3 — Review & calculate -----
function renderReviewStep(q, d, r){
  const wrap = el('<div class="ifta-screen"></div>');
  const checks = buildChecks(q); const fails = checks.filter(c=>c.tone==='fail').length, warns = checks.filter(c=>c.tone==='warn').length;

  sum.appendChild(sumCard('CHECKS', checks.length, fails+' blocking · '+warns+' warnings', fails?'danger':(warns?'warn':''), fails?'danger':(warns?'warn':'good')));
  sum.appendChild(sumCard('TOTAL MILES', fmtNum(r.totalMiles), 'IFTA + non-IFTA (P710.100)'));
  sum.appendChild(sumCard('TOTAL GALLONS', fmtNum(r.totalGal), 'all fuel placed in qualified vehicles'));
  sum.appendChild(sumCard('FLEET MPG', r.mpg.toFixed(2), 'miles ÷ gallons, 2 decimals (P720.350)'));
  sum.appendChild(sumCard('TAX RATES', qCode(q)+' final', 'IFTA, Inc. matrix · '+fmtDate(q.ratesFinal)));
  wrap.appendChild(sum);
  const list = el('<div class="checks"></div>');
  checks.forEach(c=>{
    const icon = c.tone==='ok'?'check_circle':(c.tone==='warn'?'warning':(c.tone==='fail'?'error':'auto_awesome'));
    const row = el('<div class="check-row '+c.tone+'"><div class="ci">'+iconHTML(icon,18)+'</div><div class="ct"><div class="t">'+c.title+'</div><div class="d">'+c.desc+'</div><div class="ref">'+iconHTML('menu_book',12)+' '+c.ref+'</div></div><div class="ca"></div></div>');
    const ca = row.querySelector('.ca');
    if(!isFiled(q)) c.actions.forEach(([l,fn])=>{ const prim = /^(Confirm recovered|Mark all as|Request receipts|Open purchase|Ask )/.test(l); const b = el('<button class="btn'+(prim?' primary':'')+'" style="padding:6px 10px;">'+l+'</button>'); b.onclick=fn; ca.appendChild(b); });
    list.appendChild(row);
  });
  wrap.appendChild(list);
  const box = el('<div class="calc-box"></div>');
  if(isFiled(q)){
    box.appendChild(el('<div class="cb-text"><div class="t">'+q.label+' return was calculated and filed on '+fmtDateLong(q.filedOn)+'</div><div class="d">Confirmation '+q.confirmation+' · '+q.payMethod+' · net tax '+fmtMoney(r.netTax)+(r.penalty?' · penalty $'+fmtNum(r.penalty,2)+' · interest $'+fmtNum(r.interestTotal,2):'')+'.</div></div>'));
    const b = el('<button class="btn primary">'+iconHTML('description',16)+'Open return</button>'); b.onclick=()=>{ state.step='report'; render(); }; box.appendChild(b);
  } else {
    box.appendChild(el('<div class="cb-text"><div class="t">'+(state.calculating?'Calculating '+q.label+' return…':(state.calculated[q.key]?'Recalculate '+q.label+' return':'Calculate '+q.label+' return'))+'</div><div class="d">Per jurisdiction: taxable miles ÷ fleet MPG = taxable gallons; minus tax-paid gallons = net taxable gallons × rate. Surcharges on taxable gallons (KY, VA). Miles and gallons rounded to whole units, MPG to 2 decimals, tax to cents.'+(q.status==='in_progress'?' Figures stay <b>preliminary</b> until the quarter ends on '+fmtDateLong(q.to)+'.':'')+(fails?' <b>'+fails+' blocking check'+(fails>1?'s':'')+'</b> — you can still calculate a preliminary return.':'')+'</div>'+(state.calculating?'<div class="calc-progress"><div id="calcBar" style="width:'+state.calcProgress+'%"></div></div>':'')+'</div>'));
    const b = el('<button class="btn primary" '+(state.calculating?'disabled':'')+'>'+iconHTML('calculate',16)+(state.calculated[q.key]?'Recalculate':'Calculate return')+'</button>');

  }
  wrap.appendChild(box);
  return wrap;

function startCalculation(q){
  state.calculating=true; state.calcProgress=0; render();

}

function applyDesktopScale(){
  const DESIGN_WIDTH = 1320;
  const scale = window.innerWidth / DESIGN_WIDTH;
  currentAppScale = scale;
  if('zoom' in document.body.style){ app.style.transform=''; app.style.zoom=scale; document.body.style.width=''; document.body.style.height=''; }
  else { app.style.transformOrigin='top left'; app.style.transform='scale('+scale+')'; document.body.style.width=(DESIGN_WIDTH*scale)+'px'; document.body.style.height=(1040*scale)+'px'; }
  document.querySelectorAll('.zoom-sync').forEach(elz=>{ elz.style.zoom = scale; });
}
applyDesktopScale();
window.addEventListener('resize', applyDesktopScale);
